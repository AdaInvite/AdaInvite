<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad y Acceso - XV Mayte</title>
    
    <meta name="theme-color" content="#F5F5F0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        terracota: '#2A2A2A', /* Dark Grey/Black para tonos oscuros */
                        blanco: {
                            perla: '[#FFFFFF]' /* Beige/Neutro claro para fondos */
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        :root {
            --terracota: #FFFFFF; 
            --blanco-perla: #FFFFFF;
            --font-elegant: 'Montserrat', sans-serif;
            --font-script: 'Imperial Script', cursive;
            --font-numbers: 'Montserrat', sans-serif; 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: var(--font-elegant);
            background-color: var(--blanco-perla);
            color: var(--terracota);
        }

        h1, h2, h3, h4, p, span, input, button { font-family: var(--font-elegant); }
        .font-bold { font-weight: 600; }
        .font-light { font-weight: 300; }
        .font-script { font-family: var(--font-script) !important; font-weight: 400; }
        .font-numbers { font-family: var(--font-numbers) !important; }

        .fondo-perla {
            background-image: url('https://i.imgur.com/XpSlXib.gif');
            background-size: cover;
            background-position: center;
            width: 100%;
        }

        /* Contenedor principal estilo invitación */
        .forma-ovalada {
            background-color: rgba(255, 255, 255, 0.1); /* Efecto cristal transparente */
            backdrop-filter: blur(12px); /* Efecto reproductor de música/cristal */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2); /* Borde sutil para resaltar el cristal */
            color: #FFFFFF;
            border-radius: 250px 250px 0 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);  
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            width: 95vw;
            max-width: 480px; 
            height: 96svh; 
            padding: 5% 6%; 
            overflow: hidden; 
        }

               /* Lector QR Personalizado al tema */
        #qr-reader { 
            width: 100%; 
            max-width: 320px; 
            margin: 0 auto; 
            border-radius: 16px; 
            overflow: hidden; 
            border: none !important; 
            background-color: rgba(0, 0, 0, 0.2) !important; /* Fondo oscuro translúcido para integrar con el cristal */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            padding-bottom: 10px;
        }
        
        /* Contenedor de la cámara */
        #qr-reader__scan_region {
            border-radius: 16px 16px 0 0 !important;
            overflow: hidden !important;
            background-color: #000000 !important; /* Fondo negro puro mientras carga */
        }
        #qr-reader__scan_region img { display: none !important; } 
        #qr-reader video { object-fit: cover !important; border-radius: 16px 16px 0 0 !important; }
        
        /* Cuadro blanco de enfoque */
        .scan-region-highlight { 
            border: 2px solid #FFFFFF !important; 
            border-radius: 12px !important;
        }

        /* Selector de cámara (Soluciona el texto ilegible) */
        #qr-reader__camera_selection { 
            color: #2A2A2A !important; /* Texto oscuro para máxima legibilidad */
            background-color: #FFFFFF !important; /* Fondo blanco sólido */
            border: none !important;
            border-radius: 6px !important;
            padding: 10px 12px !important;
            font-size: 12px !important;
            font-family: var(--font-elegant) !important;
            width: 90% !important;
            max-width: 280px !important;
            margin: 15px auto 10px auto !important;
            display: block !important;
            outline: none !important;
            text-align: center;
        }

        /* Botón de Iniciar / Detener escaneo */
        #qr-reader__dashboard_section_csr button {
            background-color: #FFFFFF !important; 
            color: #2A2A2A !important; 
            border: 1px solid #FFFFFF !important; 
            padding: 12px 15px !important; 
            border-radius: 6px !important; 
            font-size: 10px !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.15em !important;
            margin: 5px auto 10px auto !important; 
            cursor: pointer !important; 
            width: 90% !important; 
            max-width: 280px !important;
            font-weight: 700 !important;
            display: block !important;
            transition: all 0.3s ease !important;
        }
        
        #qr-reader__dashboard_section_csr button:hover {
            background-color: #2A2A2A !important;
            color: #FFFFFF !important;
        }

        /* Limpieza visual: Ocultar textos extra y enlaces ("Powered by", "Scan an image file") */
        #qr-reader__dashboard_section_swaplink { display: none !important; }
        #qr-reader a { display: none !important; }
        #qr-reader__dashboard_section_csr > span { display: none !important; }

                /* Botones generales */
        .btn-elegant { 
            background-color: transparent; 
            border: 1px solid #FFFFFF; /* Borde blanco fijo */
            color: #FFFFFF; /* ¡Texto en blanco para que resalte! */
            font-size: 10px; 
            letter-spacing: 0.2em; 
            text-transform: uppercase; 
            padding: 14px 24px; 
            border-radius: 0; 
            font-weight: 600; 
            transition: all 0.3s;
        }
        .btn-elegant:hover { 
            background-color: #FFFFFF; /* Fondo blanco al interactuar */
            color: black; /* Texto oscuro al interactuar */
        }


        /* Scrollbar oculta para limpieza visual */
        .forma-ovalada::-webkit-scrollbar { display: none; }
        .forma-ovalada { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <section class="relative min-h-[100svh] flex flex-col justify-end items-center pt-8 pb-0 px-2 fondo-perla relative overflow-hidden">
        
        <div class="forma-ovalada w-full mx-auto" id="mainContainer">
            
            <div id="vistaCamara" class="hidden w-full flex flex-col items-center mt-4">
                <p class="text-[10px] uppercase tracking-[0.5em] font-bold opacity-90 text-white mb-1">Staff de Acceso</p>
                <h1 class="text-6xl text-white font-script mb-6">XV Mayte</h1>
                
                <div id="qr-reader" class="mb-4"></div>
                <p class="text-[11px] text-white mt-4 mb-8 uppercase tracking-widest px-4 text-center leading-relaxed">Aleja el celular 25cm para enfocar y pide al invitado hacer zoom al código.</p>
                
                <div class="w-full max-w-[300px] border-t border-terracota/20 pt-6 mt-2">
                    <p class="text-[11px] uppercase tracking-widest text-white mb-4 font-bold">¿La cámara no enfoca?</p>
                    <div class="flex flex-col gap-4">
                        <input type="text" id="manualFolio" placeholder="EJ. XV-1234" class="w-full bg-white border-b border-terracota/40 px-2 py-2 outline-none text-2xl text-center text-terracota uppercase font-light tracking-widest placeholder-terracota/30" maxlength="7">
                        <button onclick="verificarManual()" class="bg-white text-black border border-white px-6 py-4 font-bold text-[10px] uppercase tracking-[0.2em] shadow-md hover:bg-terracota transition-all duration-300">Validar Folio</button>
                    </div>
                </div>
            </div>

            <div id="vistaCargando" class="hidden py-24 flex-col items-center w-full mt-10">
                <div class="w-16 h-16 border-4 border-terracota/20 border-t-transparent rounded-full animate-spin mx-auto mb-8"></div>
                <p class="text-white uppercase tracking-[0.3em] text-[10px] font-bold animate-pulse">Consultando Lista...</p>
            </div>

            <div id="vistaAprobado" class="hidden py-8 w-full flex-col items-center mt-4">
                <div class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 border border-[#10B981] shadow-[0_0_30px_rgba(16,185,129,0.15)] bg-white">
                    <svg class="w-10 h-10 text-[#10B981]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <p class="text-[10px] uppercase tracking-[0.4em] text-white mb-1 font-bold">Autorizado</p>
                <h1 class="text-6xl text-white font-script mb-2">¡Bienvenido!</h1>
                <p id="mostrarFolio" class="text-xs tracking-[0.5em] font-numbers text-white/60 mb-8 font-light">XV-0000</p>
                
                <div class="w-full max-w-[300px] border border-terracota/10 rounded-2xl p-6 text-center mb-8 bg-white shadow-sm">
                    <p class="text-[12px] uppercase tracking-[0.3em] text-black font-bold mb-2">Titular del Pase</p>
                    <p class="text-2xl text-black font-bold mb-6" id="mostrarNombre">Nombre</p>
                    
                    <div class="w-16 h-px bg-terracota/20 mx-auto mb-6"></div>
                    
                    <p class="text-[12px] uppercase tracking-[0.3em] text-black font-bold mb-2">Accesos:</p>
                    <p class="text-4xl text-black font-bold" id="mostrarPersonas">0</p>
                </div>
                
                <button onclick="reiniciarEscaner()" class="btn-elegant w-full max-w-[300px]">Siguiente Invitado</button>
            </div>

            <div id="vistaDenegado" class="hidden py-8 w-full flex-col items-center mt-4">
                <div class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 border border-[#EF4444] shadow-[0_0_30px_rgba(239,68,68,0.15)] bg-white">
                    <svg class="w-10 h-10 text-[#EF4444]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </div>
                <p class="text-[10px] uppercase tracking-[0.4em] text-[#EF4444] mb-1 font-bold">Error</p>
                <h1 class="text-6xl text-terracota font-script mb-6">No Válido</h1>
                
                <p id="mensajeError" class="text-base font-light text-terracota mb-10 px-6 text-center">El folio no existe en la lista.</p>
                
                <button onclick="reiniciarEscaner()" class="btn-elegant w-full max-w-[300px] !border-[#EF4444] !text-[#EF4444] hover:!bg-[#EF4444] hover:!text-white">Volver a intentar</button>
            </div>

        </div>
    </section>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyz3yy625GdJ0e3eOlpwyWizIU-HsBE0M-ntRNRNInjKr_H9I0J8tp8eNeNXP99VnGsXA/exec';
let html5QrcodeScanner;

window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const folio = urlParams.get('folio') || urlParams.get('pase');
    if (folio) { verificarFolioEnGoogle(folio); } else { iniciarCamara(); }
});

// Cambiamos la variable global
let html5QrCode; 

function iniciarCamara() {
    ocultarTodasLasVistas();
    document.getElementById('vistaCamara').classList.remove('hidden');
    document.getElementById('vistaCamara').classList.add('flex');
    document.getElementById('mainContainer').style.borderColor = "black";
    document.getElementById('manualFolio').value = '';

    // Usamos Html5Qrcode en lugar de Scanner para tener control total sin interfaz basura
    if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
    }

    const configuracion = { 
        fps: 15, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0,
        disableFlip: true
    };

    // Encendemos la cámara trasera directamente
    html5QrCode.start(
        { facingMode: "environment" }, 
        configuracion, 
        onScanSuccess, 
        onScanFailure
    ).catch((err) => {
        console.error("Error al iniciar cámara en Safari:", err);
        // Si falla (por falta de permisos o HTTPS), le avisamos al staff
        document.getElementById('qr-reader').innerHTML = `
            <div class="text-center p-4">
                <p class="text-[10px] text-white uppercase tracking-widest mb-4">Error de cámara</p>
                <button onclick="iniciarCamara()" class="btn-elegant w-full">Reintentar</button>
            </div>
        `;
    });
}

function apagarCamara() {
    if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
            html5QrCode.clear();
        }).catch(e => console.error("Error al apagar cámara", e));
    }
}

function onScanSuccess(decodedText) {
    reproducirBeep();
    apagarCamara();
    let folioExtraido = decodedText;
    try {
        let url = new URL(decodedText);
        folioExtraido = url.searchParams.get('pase') || url.searchParams.get('folio') || decodedText;
    } catch(e) {}

    // Por si quedó algún QR viejo generado con el formato anterior (con barras | )
    if(folioExtraido.includes('|')) {
        folioExtraido = folioExtraido.split('|')[0].replace('XV-XV-', 'XV-'); 
    }

    if(folioExtraido) verificarFolioEnGoogle(folioExtraido);
    else mostrarDenegado("Código irreconocible.");
}

function onScanFailure(error) { 
    // Silencioso, no queremos que lance alertas cada segundo que no ve un QR
}

function verificarManual() {
    const folioManual = document.getElementById('manualFolio').value.trim();
    if(!folioManual) return;
    apagarCamara();
    verificarFolioEnGoogle(folioManual);
}


async function verificarFolioEnGoogle(folio) {
    ocultarTodasLasVistas();
    document.getElementById('vistaCargando').classList.remove('hidden');
    document.getElementById('vistaCargando').classList.add('flex');
    try {
        // Consultar a Google Sheets
        const requestUrl = `${SCRIPT_URL}?action=consultar_folio&folio=${encodeURIComponent(folio)}`;
        const response = await fetch(requestUrl);
        const result = await response.json();
        
        ocultarTodasLasVistas();
        if (result.status === "found") {
            document.getElementById('mostrarFolio').innerText = folio;
            document.getElementById('mostrarNombre').innerText = result.name;
            document.getElementById('mostrarPersonas').innerText = result.pax;
            
            document.getElementById('vistaAprobado').classList.remove('hidden');
            document.getElementById('vistaAprobado').classList.add('flex');
            document.getElementById('mainContainer').style.borderColor = "rgba(16, 185, 129, 0.4)"; 
        } else {
            mostrarDenegado("Ese folio no existe o aún no tiene pases asignados.");
        }
    } catch (error) {
        mostrarDenegado("Error de conexión con la base de datos.");
    }
}

function mostrarDenegado(mensaje) {
    ocultarTodasLasVistas();
    document.getElementById('mensajeError').innerText = mensaje || "Pase no válido.";
    document.getElementById('vistaDenegado').classList.remove('hidden');
    document.getElementById('vistaDenegado').classList.add('flex');
    document.getElementById('mainContainer').style.borderColor = "rgba(239, 68, 68, 0.4)"; // Borde rojo sutil
}

function ocultarTodasLasVistas() {
    const vistas = ['vistaCamara', 'vistaCargando', 'vistaAprobado', 'vistaDenegado'];
    vistas.forEach(id => {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(id).classList.remove('flex');
    });
    document.getElementById('mainContainer').style.borderColor = "transparent";
}

function reiniciarEscaner() {
    window.history.replaceState({}, document.title, window.location.pathname);
    iniciarCamara();
}
// Función para generar un "beep" de éxito
function reproducirBeep() {
    try {
        const contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
        const oscilador = contextoAudio.createOscillator();
        const ganancia = contextoAudio.createGain();

        // Configuración del sonido (tono agradable y claro)
        oscilador.type = 'sine'; 
        oscilador.frequency.setValueAtTime(880, contextoAudio.currentTime); 
        
        // Volumen y duración del beep (0.15 segundos)
        ganancia.gain.setValueAtTime(0.1, contextoAudio.currentTime);
        ganancia.gain.exponentialRampToValueAtTime(0.00001, contextoAudio.currentTime + 0.15);

        oscilador.connect(ganancia);
        ganancia.connect(contextoAudio.destination);

        oscilador.start();
        oscilador.stop(contextoAudio.currentTime + 0.15); 
    } catch(e) {
        console.warn("Audio no soportado en este navegador");
    }
}

    </script>
</body>
</html>
