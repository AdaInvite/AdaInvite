<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nuestra Boda M&M - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#FFFFFF">
    <meta property="og:title" content="Melissa & Miguel - Recuerdos">
    <meta property="og:description" content="Ayúdanos a capturar los mejores momentos de nuestra boda.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tema: {
                            negro: '#1A1A1A',
                            blanco: '#FFFFFF',
                            amarillo: '#FFE596', 
                            amarilloclaro: '#FFFCF0', 
                            amarillohover: '#E5B242', 
                            gris: '#4A4A4A',
                            borde: '#E5E7EB'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Única fuente: Forum -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
    
    <!-- Librería para convertir HEIC a JPG -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            --font-elegant: 'Forum', serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: var(--font-elegant);
            color: #4A4A4A;
            scroll-behavior: smooth;
            background-color: #FFFFFF;
        }

        /* Aplicar la fuente a todos los elementos por defecto */
        * {
            font-family: var(--font-elegant) !important;
        }

        /* TEXTURAS PREMIUM DE LA INVITACIÓN */
        .textura-papel {
            background-color: #FFFFFF;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
        }

        .textura-tarjeta {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.25'/%3E%3C/svg%3E");
        }

        .hojas-decor {
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        /* INPUTS ELEGANTES */
        .input-boda {
            background-color: rgba(255, 255, 255, 0.8); 
            border: 1px solid rgba(229, 178, 66, 0.4); 
            color: #1A1A1A;
            border-radius: 8px; 
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .input-boda:focus { border-color: #E5B242; outline: none; background-color: #FFFFFF; box-shadow: 0 4px 15px rgba(229, 178, 66, 0.2); }
        .input-boda::placeholder { color: #A0A0A0; font-weight: 300; text-transform: uppercase; letter-spacing: 0.1em; font-size: 13px;}
        select option { background-color: #FFFFFF; color: #1A1A1A; }
        select { text-align-last: center; text-transform: uppercase; letter-spacing: 0.1em; font-size: 13px !important;} 

        #uploadModal { transition: opacity 0.4s ease, visibility 0.4s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px; width: 100%; max-height: 220px; overflow-y: auto; padding: 10px;
        }
        
        /* OVERLAY DE CARGA */
        #processingOverlay {
            position: absolute; inset: 0;
            background: rgba(255, 252, 240, 0.95); backdrop-filter: blur(4px);
            z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 0.75rem; transition: opacity 0.3s;
        }
        #processingOverlay.hidden { opacity: 0; pointer-events: none; display: none; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* TOAST ELEGANTES */
        #toastMessage {
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast-visible {
            opacity: 1 !important;
            transform: translate(-50%, 0) !important;
            pointer-events: auto !important;
        }
        
        /* TRANSICIÓN DE TARJETAS */
        .tarjeta-recuerdo {
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .tarjeta-recuerdo:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            z-index: 10;
        }
    </style>
</head>
<body class="textura-papel">

    <!-- Toast de Notificaciones -->
    <div id="toastMessage" class="fixed top-8 left-1/2 transform -translate-x-1/2 -translate-y-16 opacity-0 pointer-events-none px-8 py-4 rounded-xl shadow-2xl z-[9999] text-xs uppercase font-bold tracking-[0.2em] text-center min-w-[300px] border border-tema-amarillohover/30">
        Mensaje aquí
    </div>

    <!-- CONTENEDOR PRINCIPAL PANTALLA COMPLETA -->
    <div class="w-full min-h-screen flex flex-col relative z-10">

        <!-- HEADER LIMPIO Y ELEGANTE -->
        <header class="w-full pt-8 pb-12 px-6 flex flex-col items-center text-center relative z-10">
            
            <p class="text-sm uppercase tracking-[0.2em] text-black font-bold z-10 text-center drop-shadow-sm mb-6">
                Muro de Recuerdos
            </p>
            
            <!-- LOGO DE LOS NOVIOS -->
            <img src="https://i.imgur.com/1yxib4f.png" alt="Logo Melissa y Miguel" class="w-48 mx-auto mb-4 drop-shadow-sm object-contain">

            <p class="text-base text-tema-gris max-w-2xl mx-auto text-bold opacity-90 mb-4 px-2">
                "Tantos siglos, tantos mundos, tanto espacio y coincidir. Ayúdanos a capturar la magia de este gran día."
            </p>

            <button id="openModalBtn" class="bg-tema-amarillo textura-tarjeta text-tema-negro font-bold py-4 px-10 rounded-xl uppercase tracking-[0.2em] text-sm hover:bg-tema-amarillohover transition-all hover:-translate-y-1 active:scale-95 shadow-md">
                Subir mis fotos 
            </button>
        </header>

        <!-- SECCIÓN DE GALERÍA -->
        <main class="w-full flex-grow max-w-[1400px] mx-auto px-4 md:px-8 pb-10 relative z-10">
            
            <!-- CONTROLES DE VISTA -->
            <div class="w-full flex flex-col items-center border-t border-tema-borde pt-2 mb-4 gap-2">
                <p class="text-[11px] uppercase tracking-[0.2em] text-tema-gris font-bold">Galería de Invitados</p>
                <div class="bg-tema-amarilloclaro textura-tarjeta border border-tema-amarillo/50 rounded-xl p-1 flex shadow-sm w-fit mx-auto">
                    <button id="btn1Col" class="px-8 py-3 text-xs font-bold uppercase tracking-[0.15em] text-tema-negro bg-tema-amarillo rounded-lg transition-all">Amplia</button>
                    <button id="btn2Col" class="px-8 py-3 text-xs font-bold uppercase tracking-[0.15em] text-tema-gris hover:bg-white/50 rounded-lg transition-all">Cuadrícula</button>
                </div>
            </div>
            
            <!-- CONTENEDOR MASONRY (Muro) -->
            <div id="muro" class="columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-6 w-full pb-10">
                <!-- Tarjetas generadas dinámicamente -->
            </div>
        </main>
    </div>

    <!-- MODAL DE SUBIDA PREMIUM -->
    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-6 bg-black/60 backdrop-blur-sm hidden w-full h-full">
        <div class="relative bg-tema-amarilloclaro textura-tarjeta border border-tema-amarillo rounded-3xl w-full max-w-lg p-8 md:p-10 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto overflow-x-hidden hide-scrollbar">

            <button id="closeModalBtnIcon" class="absolute top-6 right-6 text-tema-gris hover:text-tema-negro transition-colors z-20 bg-white rounded-full p-2 shadow-sm border border-tema-borde">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="text-center mb-2 mt-2 relative z-10 flex flex-col items-center">
                <h2 class="text-2xl uppercase text-tema-negro">Tus Momentos</h2>
                <img src="https://i.imgur.com/oCEoM9X.png" alt="Decoración" class="w-32 mt-2 mb-4 opacity-80 object-contain">
               
            </div>

            <div id="uploadForm" class="w-full flex flex-col gap-6 text-left relative z-10">
                <div>
                    <label class="text-tema-negro text-[11px] font-bold tracking-[0.2em] uppercase mb-2 block">Familia / Nombre</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia López" class="input-boda py-3.5 px-4 w-full text-center">
                </div>
                
                <div>
                    <label class="text-tema-negro text-[11px] font-bold tracking-[0.2em] uppercase mb-2 block">Momento del evento</label>
                    <select id="folderSelect" class="input-boda py-3.5 px-4 w-full cursor-pointer appearance-none text-center font-semibold">
                        <option value="" disabled selected class="text-gray-400">Selecciona el momento...</option>
                        <option value="Ceremonia Religiosa">Ceremonia Religiosa</option>
                        <option value="Recepción">La Recepción</option>
                        <option value="El Banquete">El Banquete</option>
                        <option value="El Baile">El Baile y Fiesta</option>
                        <option value="Con los Novios">Con los Novios</option>
                    </select>
                </div>
                
                <div class="mt-2">
                    <label class="text-tema-negro text-[11px] font-bold tracking-[0.2em] uppercase mb-2 block">Tus Archivos</label>
                    <div id="dropZone" class="relative border border-dashed border-tema-amarillohover/60 bg-white/70 rounded-xl p-4 text-center transition-all hover:bg-white cursor-pointer shadow-sm overflow-hidden group">
                        
                        <div id="processingOverlay" class="hidden">
                            <svg class="animate-spin h-8 w-8 text-tema-amarillohover mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p class="text-tema-negro text-[10px] font-bold uppercase tracking-[0.2em] text-center px-2">Procesando archivos...<br>No cierres esta ventana</p>
                        </div>

                        <input type="file" id="archivoInput" accept="image/jpeg, image/png, video/mp4, video/mov, image/heic, image/heif" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        
                        <svg class="w-10 h-10 mx-auto text-tema-amarillohover/60 group-hover:text-tema-amarillohover transition-colors mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-tema-negro text-sm font-bold uppercase tracking-[0.2em]">Toca aquí para buscar</p>
                        <p class="text-gray-400 text-[11px] tracking-widest mt-2 uppercase">(Videos máximo 30s)</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-tema-amarillo/30 rounded-xl bg-white shadow-sm overflow-hidden">
                        <p class="text-[10px] text-tema-negro text-center py-3 uppercase font-bold border-b border-gray-100 tracking-[0.2em] bg-gray-50/50">Imágenes a subir:</p>
                        <div id="previewContainer" class="bg-white"></div>
                        <button id="removePreviewBtn" class="w-full py-4 text-[11px] text-red-500 bg-red-50/50 uppercase font-bold hover:bg-red-100 transition-colors tracking-widest border-t border-red-100">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-4 mt-6">
                    <button id="btnCancelar" class="flex-1 bg-white border border-tema-borde text-tema-gris font-bold rounded-xl py-4 text-xs uppercase hover:bg-gray-50 transition-colors shadow-sm">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-tema-amarillo textura-tarjeta text-tema-negro font-bold rounded-xl py-4 text-xs uppercase shadow-md hover:bg-tema-amarillohover hover:-translate-y-1 transition-transform border border-transparent">Subir a la galería</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="text-xs uppercase tracking-widest font-bold mt-6 text-tema-negro bg-tema-amarillo p-4 rounded-xl hidden text-center w-full relative z-10 shadow-md"></p>
        </div>
    </div>

    <!-- FIREBASE Y LÓGICA CORE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // CREDENCIALES DE MELISSA Y MIGUEL
        const firebaseConfig = {
          apiKey: "AIzaSyDx6aIzPkxE3BKLwLegToNKb7hyEaddGA8",
          authDomain: "boda-a-y-r.firebaseapp.com",
          projectId: "boda-a-y-r",
          storageBucket: "boda-a-y-r.firebasestorage.app",
          messagingSenderId: "74608605808",
          appId: "1:74608605808:web:dd4bdb1a9d2bedb2c8d2b5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // GESTIÓN DE LIKES (LocalStorage) para 1 like por persona
        let likedPosts = JSON.parse(localStorage.getItem('liked_posts_melissa_miguel')) || [];

        // SISTEMA DE ALERTAS (TOAST ELEGANTES)
        window.showToast = function(msg, isError = true) {
            const toast = document.getElementById('toastMessage');
            toast.innerText = msg;
            if(isError) {
                toast.classList.add('bg-white', 'text-red-600', 'border-red-500/50');
                toast.classList.remove('bg-tema-negro', 'text-white', 'border-tema-negro');
            } else {
                toast.classList.remove('bg-white', 'text-red-600', 'border-red-500/50');
                toast.classList.add('bg-tema-negro', 'text-white', 'border-tema-negro');
            }
            toast.classList.add('toast-visible');
            
            setTimeout(() => {
                toast.classList.remove('toast-visible');
            }, 3500);
        };

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");
        const processingOverlay = document.getElementById('processingOverlay');

        // Modal triggers
        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

        // Medir duración video
        function getVideoDuration(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.onloadedmetadata = () => {
                    window.URL.revokeObjectURL(video.src);
                    resolve(video.duration);
                };
                video.src = URL.createObjectURL(file);
            });
        }

        // INPUT ARCHIVOS (HEIC Y VIDEOS)
        archivoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            processingOverlay.classList.remove('hidden');
            previewContainer.innerHTML = "";
            
            const archivosProcesados = new DataTransfer();

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                const fileName = file.name.toLowerCase();

                // Límite Video 30s
                if (file.type.includes("video")) {
                    const duration = await getVideoDuration(file);
                    if (duration > 30) {
                        window.showToast(`El video "${file.name}" dura más de 30s y no se subirá.`, true);
                        continue; 
                    }
                }

                await new Promise(resolve => setTimeout(resolve, 100));

                // HEIC Conversión
                if (fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic') {
                    try {
                        const conversionPromise = heic2any({ blob: file, toType: "image/jpeg", quality: 0.5 });
                        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Tiempo agotado")), 15000));
                        const convertedBlob = await Promise.race([conversionPromise, timeoutPromise]);
                        const finalBlob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                        file = new File([finalBlob], file.name.replace(/\.heic|\.heif/i, ".jpg"), { type: "image/jpeg" });
                    } catch (err) {
                        console.warn(`Error al convertir ${file.name}:`, err);
                        continue;
                    }
                }

                archivosProcesados.items.add(file);
                
                // Miniaturas
                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-24 bg-gray-100 rounded-lg overflow-hidden shadow-sm border border-gray-200";
                
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/30"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            }

            archivoInput.files = archivosProcesados.files;
            processingOverlay.classList.add('hidden');

            if (archivoInput.files.length > 0) {
                dropZone.classList.add('hidden');
                previsualizacion.classList.remove('hidden');
            } else {
                archivoInput.value = ""; 
                dropZone.classList.remove('hidden');
                previsualizacion.classList.add('hidden');
            }
        });

        document.getElementById('removePreviewBtn').addEventListener('click', () => {
            archivoInput.value = "";
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        // SUBIR ARCHIVOS
        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) {
                window.showToast("POR FAVOR, COMPLETA TODOS LOS CAMPOS.", true);
                return;
            }

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, 'boda_melissa_miguel/' + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_melissa_miguel"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "¡IMÁGENES GUARDADAS CON ÉXITO!";
            setTimeout(() => location.reload(), 1500);
        });

        // VISTAS DEL GRID
        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "px-8 py-3 text-xs font-bold uppercase tracking-[0.15em] text-tema-negro bg-tema-amarillo rounded-lg transition-all";
            btn2Col.className = "px-8 py-3 text-xs font-bold uppercase tracking-[0.15em] text-tema-gris hover:bg-white/50 rounded-lg transition-all";
            // Amplia: 1 col movil, 2 cols tablet, 3 cols desktop
            muro.className = "columns-1 sm:columns-2 lg:columns-3 gap-6 w-full pb-10";
        });
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "px-8 py-3 text-xs font-bold uppercase tracking-[0.15em] text-tema-negro bg-tema-amarillo rounded-lg transition-all";
            btn1Col.className = "px-8 py-3 text-xs font-bold uppercase tracking-[0.15em] text-tema-gris hover:bg-white/50 rounded-lg transition-all";
            // Cuadrícula: 2 cols movil, 3 cols tablet, 4-5 cols desktop
            muro.className = "columns-2 sm:columns-3 lg:columns-4 xl:columns-5 gap-4 w-full pb-10";
        });

        // RENDERIZAR MURO
        let isFirstLoad = true;
        const q = query(collection(db, "muro_melissa_miguel"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="text-tema-gris font-bold text-lg md:text-xl col-span-full py-20 text-center break-inside-avoid">Aún no hay recuerdos. ¡Sé el primero en subir un momento mágico!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto bg-black/5 cursor-pointer object-cover"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto object-cover" loading="lazy">`;
                    
                    const userLiked = likedPosts.includes(id);
                    // Usamos el amarillo hover para el corazon activo, gris para inactivo
                    const heartColorClass = userLiked ? 'text-tema-amarillohover fill-current' : 'text-gray-300';

                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "tarjeta-recuerdo break-inside-avoid mb-6 bg-white border border-tema-borde rounded-xl flex flex-col overflow-hidden relative z-20 shadow-md";
                    
                    divTarjeta.innerHTML = `
                        <div class="relative w-full">
                            ${media}
                        </div>
                        <div class="flex flex-col p-4 bg-white gap-3">
                            <div class="w-full flex justify-start">
                                <span class="bg-white/90 backdrop-blur-sm border border-tema-borde text-tema-negro text-[10px] font-bold px-4 py-2 rounded-full shadow-sm uppercase tracking-widest">${datos.momento}</span>
                            </div>
                            <div class="flex items-center justify-between w-full border-t border-gray-100 pt-3">
                                <h4 class="text-tema-negro font-bold uppercase text-xs md:text-sm tracking-[0.2em] truncate flex-1">${datos.nombre}</h4>
                                <div class="flex items-center gap-2 pl-2">
                                    <button onclick="darLike('${id}')" class="flex items-center gap-1.5 transition-transform focus:outline-none hover:scale-110 active:scale-95 duration-200">
                                        <svg id="heart-icon-${id}" class="w-6 h-6 ${heartColorClass} transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                        <span id="contador-likes-${id}" class="font-bold text-base text-tema-negro">${datos.likes}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) contadorLikes.innerText = datos.likes;
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) tarjetaRemover.remove();
                }
            });

            isFirstLoad = false;
        });

        // 1 LIKE POR PERSONA
        window.darLike = async function(id) {
            if (likedPosts.includes(id)) {
                window.showToast("YA DISTE ME GUSTA A ESTE RECUERDO", false);
                return;
            }

            const heartIcon = document.getElementById(`heart-icon-${id}`);
            const contadorText = document.getElementById(`contador-likes-${id}`);
            
            if (heartIcon) {
                heartIcon.classList.remove('text-gray-300', 'fill-none');
                heartIcon.classList.add('text-tema-amarillohover', 'fill-current');
            }
            if (contadorText) {
                contadorText.innerText = (parseInt(contadorText.innerText) || 0) + 1;
            }

            likedPosts.push(id);
            localStorage.setItem('liked_posts_melissa_miguel', JSON.stringify(likedPosts));

            try {
                await updateDoc(doc(db, "muro_melissa_miguel", id), { likes: increment(1) });
            } catch (error) {
                console.error("Error al dar like:", error);
                window.showToast("ERROR AL CONECTAR.", true);
            }
        };

        window.activarVideo = function(id) {
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
