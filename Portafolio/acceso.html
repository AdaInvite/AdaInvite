<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - XV Regina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #121212; color: white; }
        #qr-reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 1rem; overflow: hidden; border: 2px solid #B5737A; }
        #qr-reader__scan_region img { display: none !important; }
        #qr-reader__dashboard_section_csr button { background-color: #B5737A; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-900 rounded-2xl shadow-2xl p-6 text-center border border-gray-700 transition-all duration-300" id="mainContainer">
        
        <div id="vistaCamara" class="hidden">
            <h2 class="text-2xl font-bold text-[#B5737A] mb-2">Escáner de Acceso</h2>
            <p class="text-gray-400 text-xs uppercase tracking-widest mb-6">Apunta la cámara al código QR</p>
            <div id="qr-reader"></div>
        </div>

        <div id="vistaCargando" class="hidden py-10">
            <div class="w-16 h-16 border-4 border-[#B5737A] border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
            <p class="text-gray-400 uppercase tracking-widest text-xs font-bold">Verificando pase en la base de datos...</p>
        </div>

        <div id="vistaAprobado" class="hidden py-6">
            <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(34,197,94,0.4)]">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-green-400 mb-2">ACCESO APROBADO</h2>
            <p id="mostrarFolio" class="text-gray-500 tracking-widest mb-6">XV-0000</p>
            
            <div class="bg-gray-800 rounded-lg p-4 text-left mb-6">
                <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Nombre del Invitado</p>
                <p id="mostrarNombre" class="text-xl font-bold text-white mb-4">...</p>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Pases Válidos</p>
                <p id="mostrarPersonas" class="text-xl font-bold text-white">...</p>
            </div>
            
            <button onclick="reiniciarEscaner()" class="w-full border border-gray-500 text-gray-300 py-3 rounded-md uppercase tracking-widest text-xs font-bold hover:bg-gray-800 transition-colors">Escanear otro pase</button>
        </div>

        <div id="vistaDenegado" class="hidden py-6">
            <div class="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(220,38,38,0.4)]">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-red-500 mb-2">PASE NO VÁLIDO</h2>
            <p id="mensajeError" class="text-gray-400 text-sm mt-4 mb-8">El folio escaneado no existe o no se pudo verificar.</p>
            
            <button onclick="reiniciarEscaner()" class="w-full bg-red-600/20 border border-red-600 text-red-400 py-3 rounded-md uppercase tracking-widest text-xs font-bold hover:bg-red-600/40 transition-colors">Intentar de nuevo</button>
        </div>

    </div>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrudXH6-mkiTLJLh-Olgm3kGg3TdwIVBOGLRna3xa9hFC5a8-QvHxjR_gv9gg7TX7r/exec';
        let html5QrcodeScanner;

        // Lógica inteligente de inicio
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const folio = urlParams.get('folio') || urlParams.get('pase');

            // Si hay un folio en la URL (porque escanearon con la app normal del cel), lo verificamos.
            if (folio) {
                verificarFolioEnGoogle(folio);
            } else {
                // Si no hay folio (porque entraron a acceso.html directamente), abrimos la cámara.
                iniciarCamara();
            }
        });

        function iniciarCamara() {
            ocultarTodasLasVistas();
            document.getElementById('vistaCamara').classList.remove('hidden');
            document.getElementById('mainContainer').classList.remove('border-green-500', 'border-red-600');

            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: {width: 250, height: 250}, aspectRatio: 1.0 });
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            }
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear().then(() => {
                html5QrcodeScanner = null;
                
                let folioExtraido = decodedText;
                try {
                    let url = new URL(decodedText);
                    folioExtraido = url.searchParams.get('pase') || url.searchParams.get('folio') || decodedText;
                } catch(e) {}

                if(folioExtraido) {
                    verificarFolioEnGoogle(folioExtraido);
                } else {
                    mostrarDenegado("El QR escaneado no tiene un formato válido.");
                }
            });
        }

        function onScanFailure(error) { /* Ignorado intencionalmente */ }

        async function verificarFolioEnGoogle(folio) {
            ocultarTodasLasVistas();
            document.getElementById('vistaCargando').classList.remove('hidden');
            document.getElementById('mainContainer').classList.remove('border-green-500', 'border-red-600');

            try {
                const requestUrl = `${SCRIPT_URL}?action=consultar&folio=${encodeURIComponent(folio)}`;
                const response = await fetch(requestUrl);
                const result = await response.json();

                ocultarTodasLasVistas();

                if (result.status === "found") {
                    document.getElementById('mostrarFolio').innerText = folio;
                    document.getElementById('mostrarNombre').innerText = result.name;
                    document.getElementById('mostrarPersonas').innerText = result.pax;
                    document.getElementById('vistaAprobado').classList.remove('hidden');
                    document.getElementById('mainContainer').classList.add('border-green-500');
                } else {
                    mostrarDenegado("Ese pase no se encuentra en la base de datos.");
                }
            } catch (error) {
                mostrarDenegado("Error de conexión con la base de datos.");
            }
        }

        function mostrarDenegado(mensaje) {
            ocultarTodasLasVistas();
            document.getElementById('mensajeError').innerText = mensaje || "El folio escaneado no existe o fue escrito incorrectamente.";
            document.getElementById('vistaDenegado').classList.remove('hidden');
            document.getElementById('mainContainer').classList.add('border-red-600');
        }

        function ocultarTodasLasVistas() {
            document.getElementById('vistaCamara').classList.add('hidden');
            document.getElementById('vistaCargando').classList.add('hidden');
            document.getElementById('vistaAprobado').classList.add('hidden');
            document.getElementById('vistaDenegado').classList.add('hidden');
        }

        function reiniciarEscaner() {
            // Limpiar la URL para que no se quede trabado en el mismo pase
            window.history.replaceState({}, document.title, window.location.pathname);
            iniciarCamara();
        }
    </script>
</body>
</html>
