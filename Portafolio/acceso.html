<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad y Acceso - XV Regina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --rosa-elegante: #B5737A;
            --bg-floral: url('https://i.imgur.com/1jA6vDL.jpeg');
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.95)), var(--bg-floral); 
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; 
        }
        h1, h2, h3, h4, .serif { font-family: 'Cormorant Garamond', serif; font-weight: 400; }
        .font-script { font-family: 'Pinyon Script', cursive; }

        /* Lector QR */
        #qr-reader { width: 100%; max-width: 350px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px solid rgba(181, 115, 122, 0.4); background-color: black; }
        #qr-reader__scan_region img { display: none !important; } 
        #qr-reader__dashboard_section_csr button, #qr-reader__camera_selection {
            background-color: #1a1a1a; color: white; border: 1px solid rgba(181, 115, 122, 0.5); 
            padding: 8px 15px; border-radius: 6px; font-size: 11px; text-transform: uppercase; 
            margin: 5px; cursor: pointer; width: 90%; max-width: 300px;
        }
        #qr-reader__camera_selection { color: black; background: white; margin-bottom: 15px;}
        .scan-region-highlight { border: 3px solid var(--rosa-elegante) !important; border-radius: 15px;}
        #qr-reader video { object-fit: cover !important; }
        .btn-premium { background-color: transparent; border: 1px solid var(--rosa-elegante); color: var(--rosa-elegante); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 24px; border-radius: 4px; font-weight: bold; transition: all 0.3s;}
        .btn-premium:hover { background-color: var(--rosa-elegante); color: white; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-black/70 backdrop-blur-lg rounded-2xl shadow-2xl p-6 text-center border border-rosa-elegante/20 transition-all duration-300" id="mainContainer">
        
        <div id="vistaCamara" class="hidden">
            <p class="text-[9px] uppercase tracking-[0.4em] text-gray-400 mb-1 font-bold">Staff de Acceso</p>
            <h1 class="text-3xl text-rosa-elegante font-script mb-4">AdaInvite VIP</h1>
            
            <div id="qr-reader" class="mb-4 shadow-lg"></div>
            <p class="text-[10px] text-gray-400 mb-6 uppercase tracking-widest">Aleja el celular 15cm para enfocar</p>
            
            <div class="border-t border-white/10 pt-4 mt-2">
                <p class="text-[9px] uppercase tracking-widest text-gray-400 mb-2 font-bold">¿La cámara no enfoca?</p>
                <div class="flex gap-2">
                    <input type="text" id="manualFolio" placeholder="EJ. XV-1234" class="w-full bg-black/50 border border-rosa-elegante/50 rounded-md px-4 py-3 outline-none serif text-xl text-center text-white uppercase" maxlength="7">
                    <button onclick="verificarManual()" class="bg-rosa-elegante text-white px-6 py-3 rounded-md font-bold text-[10px] uppercase tracking-widest hover:bg-white hover:text-rosa-elegante transition-all duration-300">Validar</button>
                </div>
            </div>
        </div>

        <div id="vistaCargando" class="hidden py-16">
            <div class="w-16 h-16 border-4 border-[#B5737A] border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
            <p class="text-gray-300 uppercase tracking-[0.3em] text-xs font-bold animate-pulse">Consultando Lista...</p>
        </div>

        <div id="vistaAprobado" class="hidden py-6">
            <div class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-8 border-2 border-green-500 shadow-[0_0_40px_rgba(34,197,94,0.3)] bg-green-950/50">
                <svg class="w-12 h-12 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <p class="text-[11px] uppercase tracking-[0.4em] text-green-400 mb-2 font-bold">Autorizado</p>
            <h1 class="text-6xl text-rosa-elegante font-script mb-2 drop-shadow-lg">¡Bienvenido!</h1>
            <p id="mostrarFolio" class="text-sm tracking-[0.5em] font-light text-gray-500 mb-6">XV-0000</p>
            
            <div class="bg-white/5 border border-white/10 rounded-xl p-6 text-left mb-6 backdrop-blur-sm">
                <p class="serif text-3xl text-white mb-1" id="mostrarNombre">Nombre</p>
                <p class="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold mb-4">Titular del Pase</p>
                <div class="w-full h-px bg-white/10 my-4"></div>
                <p class="serif text-3xl text-rosa-elegante" id="mostrarPersonas">0</p>
                <p class="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold">Accesos Válidos</p>
            </div>
            
            <button onclick="reiniciarEscaner()" class="btn-premium w-full mt-2">Siguiente Invitado</button>
        </div>

        <div id="vistaDenegado" class="hidden py-6">
            <div class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-8 border-2 border-red-600 shadow-[0_0_40px_rgba(220,38,38,0.3)] bg-red-950/50">
                <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <p class="text-[11px] uppercase tracking-[0.4em] text-red-500 mb-2 font-bold">Error</p>
            <h1 class="text-6xl text-rosa-elegante font-script mb-6 drop-shadow-lg">No Válido</h1>
            <p id="mensajeError" class="serif text-xl italic text-red-200/80 mb-8 px-4">El folio no existe en la lista.</p>
            
            <button onclick="reiniciarEscaner()" class="btn-premium w-full !border-red-600 !text-red-500 hover:!bg-red-600 hover:!text-white">Volver a intentar</button>
        </div>

    </div>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrudXH6-mkiTLJLh-Olgm3kGg3TdwIVBOGLRna3xa9hFC5a8-QvHxjR_gv9gg7TX7r/exec';
        let html5QrcodeScanner;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const folio = urlParams.get('folio') || urlParams.get('pase');
            if (folio) { verificarFolioEnGoogle(folio); } else { iniciarCamara(); }
        });

        function iniciarCamara() {
            ocultarTodasLasVistas();
            document.getElementById('vistaCamara').classList.remove('hidden');
            document.getElementById('mainContainer').classList.remove('border-green-500', 'border-red-600');
            document.getElementById('manualFolio').value = '';

            if (!html5QrcodeScanner) {
                // Ajustes para forzar mejor enfoque
                html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { 
                    fps: 10, 
                    qrbox: {width: 250, height: 250},
                    aspectRatio: 1.0, 
                    rememberLastUsedCamera: true,
                    videoConstraints: {
                        facingMode: "environment",
                        focusMode: "continuous" // Intentamos forzar autofocus
                    }
                }, false);
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            }
        }

        function onScanSuccess(decodedText) {
            apagarCamara();
            let folioExtraido = decodedText;
            try {
                let url = new URL(decodedText);
                folioExtraido = url.searchParams.get('pase') || url.searchParams.get('folio') || decodedText;
            } catch(e) {}

            if(folioExtraido) verificarFolioEnGoogle(folioExtraido);
            else mostrarDenegado("Código irreconocible.");
        }

        function onScanFailure(error) { /* Silencioso para no saturar consola */ }

        // Función para el botón manual
        function verificarManual() {
            const folioManual = document.getElementById('manualFolio').value.trim();
            if(!folioManual) return;
            apagarCamara();
            verificarFolioEnGoogle(folioManual);
        }

        function apagarCamara() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().then(() => { html5QrcodeScanner = null; }).catch(e => {});
            }
        }

        async function verificarFolioEnGoogle(folio) {
            ocultarTodasLasVistas();
            document.getElementById('vistaCargando').classList.remove('hidden');
            try {
                const requestUrl = `${SCRIPT_URL}?action=consultar&folio=${encodeURIComponent(folio)}`;
                const response = await fetch(requestUrl);
                const result = await response.json();
                ocultarTodasLasVistas();
                if (result.status === "found") {
                    document.getElementById('mostrarFolio').innerText = folio;
                    document.getElementById('mostrarNombre').innerText = result.name;
                    document.getElementById('mostrarPersonas').innerText = result.pax;
                    document.getElementById('vistaAprobado').classList.remove('hidden');
                    document.getElementById('mainContainer').style.borderColor = "#22C55E";
                } else {
                    mostrarDenegado("Ese folio no existe en la lista de invitados.");
                }
            } catch (error) {
                mostrarDenegado("Error de conexión con la base de datos.");
            }
        }

        function mostrarDenegado(mensaje) {
            ocultarTodasLasVistas();
            document.getElementById('mensajeError').innerText = mensaje || "Pase no válido.";
            document.getElementById('vistaDenegado').classList.remove('hidden');
            document.getElementById('mainContainer').style.borderColor = "#DC2626";
        }

        function ocultarTodasLasVistas() {
            document.getElementById('vistaCamara').classList.add('hidden');
            document.getElementById('vistaCargando').classList.add('hidden');
            document.getElementById('vistaAprobado').classList.add('hidden');
            document.getElementById('vistaDenegado').classList.add('hidden');
            document.getElementById('mainContainer').style.borderColor = "rgba(181, 115, 122, 0.2)";
        }

        function reiniciarEscaner() {
            window.history.replaceState({}, document.title, window.location.pathname);
            iniciarCamara();
        }
        function iniciarCamara() {
            ocultarTodasLasVistas();
            document.getElementById('vistaCamara').classList.remove('hidden');
            document.getElementById('mainContainer').classList.remove('border-green-500', 'border-red-600');
            document.getElementById('manualFolio').value = '';

            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { 
                    fps: 20, // Aumentamos la rapidez de captura
                    qrbox: {width: 250, height: 250},
                    aspectRatio: 1.0, 
                    rememberLastUsedCamera: true,
                    disableFlip: true, // Desactiva la lectura en espejo (Acelera el proceso x2)
                    formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] // SOLO busca códigos QR, ignora los de barras (Acelera x5)
                }, false);
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            }
        }
    </script>
</body>
</html>
