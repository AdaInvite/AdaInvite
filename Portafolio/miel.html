<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle">Miel Dorada - Tienda Online</title>
    <style>
        /* Estilos Base y Variables */
        :root {
            --primary: #FFC107; /* Color miel */
            --primary-dark: #FFA000;
            --dark: #333333;
            --light: #F9F9F9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--dark);
        }
        
        /* Navegación */
        header {
            background-color: var(--dark);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        .nav-controls { display: flex; gap: 15px; align-items: center; }
        button { cursor: pointer; border: none; border-radius: 5px; padding: 8px 15px; font-weight: bold; }
        .btn-primary { background-color: var(--primary); color: var(--dark); }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-secondary { background-color: white; color: var(--dark); border: 1px solid #ccc; }
        
        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1587049352847-4d4b1ed74dd4?auto=format&fit=crop&w=1200&q=80') center/cover;
            color: white;
            text-align: center;
            padding: 4rem 1rem;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--primary); }

        /* Catálogo de Productos */
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .price { font-size: 1.2rem; color: var(--primary-dark); font-weight: bold; margin: 10px 0; }

        /* Modales (Carrito y Pago) */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center;
        }
        .modal { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .close-btn { background: none; color: red; font-size: 1.2rem; }
        
        /* Elementos del carrito */
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .cart-total { font-weight: bold; font-size: 1.2rem; text-align: right; margin-top: 15px; }

        /* Formulario de Pago */
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" data-i18n="siteTitle">Miel Dorada</div>
        <div class="nav-controls">
            <select id="langSwitch" onchange="changeLanguage()" class="btn-secondary">
                <option value="es">ES 🇪🇸</option>
                <option value="en">EN 🇺🇸</option>
            </select>
            <button class="btn-primary" onclick="toggleModal('cartModal')">
                <span data-i18n="cart">Carrito</span> (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>

    <section class="hero">
        <h1 data-i18n="heroTitle">La Mejor Miel Natural</h1>
        <p data-i18n="heroDesc">Directo de nuestras colmenas a tu mesa, 100% orgánica.</p>
    </section>

    <main class="container">
        <h2 data-i18n="shop" style="border-bottom: 3px solid var(--primary); display: inline-block;">Nuestros Productos</h2>
        <div class="grid" id="productGrid">
            </div>
    </main>

    <div class="modal-overlay" id="cartModal">
        <div class="modal">
            <div class="modal-header">
                <h3 data-i18n="cartTitle">Tu Carrito</h3>
                <button class="close-btn" onclick="toggleModal('cartModal')">✖</button>
            </div>
            <div id="cartItems">
                <p data-i18n="emptyCart">Tu carrito está vacío</p>
            </div>
            <div class="cart-total" id="cartTotalContainer" style="display:none;">
                <span data-i18n="total">Total:</span> $<span id="cartTotal">0.00</span>
            </div>
            <button class="btn-primary" id="checkoutBtn" style="width: 100%; margin-top: 15px; display:none;" onclick="openCheckout()" data-i18n="checkoutBtn">Ir a Pagar</button>
        </div>
    </div>

    <div class="modal-overlay" id="checkoutModal">
        <div class="modal">
            <div class="modal-header">
                <h3 data-i18n="payTitle">Pasarela de Pago Segura</h3>
                <button class="close-btn" onclick="toggleModal('checkoutModal')">✖</button>
            </div>
            <p style="font-size: 0.8rem; color: gray;" data-i18n="secureNotice">🔒 Tus datos están encriptados.</p>
            <form id="paymentForm" onsubmit="processPayment(event)">
                <div class="form-group">
                    <label data-i18n="payName">Nombre en la Tarjeta</label>
                    <input type="text" required placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label data-i18n="payCard">Número de Tarjeta</label>
                    <input type="text" required placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label data-i18n="payExp">Vencimiento</label>
                        <input type="text" required placeholder="MM/YY">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>CVC</label>
                        <input type="password" required placeholder="123" maxlength="4">
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;" data-i18n="paySubmit">Pagar Ahora</button>
            </form>
        </div>
    </div>

    <script>
        // --- 1. SISTEMA DE IDIOMAS (i18n) ---
        const translations = {
            es: {
                siteTitle: "Miel Dorada", cart: "Carrito", heroTitle: "La Mejor Miel Natural",
                heroDesc: "Directo de nuestras colmenas a tu mesa, 100% orgánica.",
                shop: "Nuestros Productos", cartTitle: "Tu Carrito", emptyCart: "Tu carrito está vacío",
                total: "Total:", checkoutBtn: "Ir a Pagar", payTitle: "Pago Seguro",
                secureNotice: "🔒 Entorno de prueba (Sin conexión real).", payName: "Nombre en la Tarjeta",
                payCard: "Número de Tarjeta", payExp: "Vencimiento (MM/AA)", paySubmit: "Pagar Ahora",
                addCart: "Agregar", successMsg: "¡Pago exitoso! Gracias por tu compra dulce.",
                p1_name: "Miel Cruda (500g)", p2_name: "Panal de Miel Entero", p3_name: "Miel de Bosque Oscura"
            },
            en: {
                siteTitle: "Golden Honey", cart: "Cart", heroTitle: "The Best Natural Honey",
                heroDesc: "Straight from our hives to your table, 100% organic.",
                shop: "Our Products", cartTitle: "Your Cart", emptyCart: "Your cart is empty",
                total: "Total:", checkoutBtn: "Proceed to Checkout", payTitle: "Secure Checkout",
                secureNotice: "🔒 Test environment (No real connection).", payName: "Name on Card",
                payCard: "Card Number", payExp: "Expiry (MM/YY)", paySubmit: "Pay Now",
                addCart: "Add to Cart", successMsg: "Payment successful! Thank you for your sweet purchase.",
                p1_name: "Raw Honey (500g)", p2_name: "Whole Honeycomb", p3_name: "Dark Forest Honey"
            }
        };

        let currentLang = 'es';

        const products = [
            { id: 1, img: "https://images.unsplash.com/photo-1577058869151-24b9015c3258?w=500", price: 12.00, key: "p1_name" },
            { id: 2, img: "https://images.unsplash.com/photo-1628189675200-84a1a364be16?w=500", price: 18.50, key: "p2_name" },
            { id: 3, img: "https://images.unsplash.com/photo-1606757656608-251147e4529b?w=500", price: 15.00, key: "p3_name" }
        ];

        function changeLanguage() {
            currentLang = document.getElementById('langSwitch').value;
            
            // Actualizar textos estáticos
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    element.innerText = translations[currentLang][key];
                }
            });
            
            // Actualizar placeholders del formulario
            document.querySelector('input[placeholder="Ej: Juan Pérez"]').placeholder = currentLang === 'es' ? 'Ej: Juan Pérez' : 'Ex: John Doe';

            renderProducts();
            renderCart();
        }

        // --- 2. RENDERIZADO DE PRODUCTOS ---
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                const name = translations[currentLang][p.key];
                const btnText = translations[currentLang].addCart;
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" alt="${name}">
                        <h3>${name}</h3>
                        <p class="price">$${p.price.toFixed(2)}</p>
                        <button class="btn-primary" onclick="addToCart(${p.id})">${btnText}</button>
                    </div>
                `;
            });
        }

        // --- 3. LÓGICA DEL CARRITO ---
        let cart = [];

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            document.getElementById('cartCount').innerText = cart.length;
            renderCart();
            // Pequeña animación visual
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "✓";
            setTimeout(() => btn.innerText = originalText, 1000);
        }

        function renderCart() {
            const cartDiv = document.getElementById('cartItems');
            const totalDiv = document.getElementById('cartTotalContainer');
            const checkoutBtn = document.getElementById('checkoutBtn');
            
            if (cart.length === 0) {
                cartDiv.innerHTML = `<p data-i18n="emptyCart">${translations[currentLang].emptyCart}</p>`;
                totalDiv.style.display = 'none';
                checkoutBtn.style.display = 'none';
                return;
            }

            cartDiv.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                cartDiv.innerHTML += `
                    <div class="cart-item">
                        <span>${translations[currentLang][item.key]}</span>
                        <span>$${item.price.toFixed(2)} <button onclick="removeFromCart(${index})" style="color:red; background:none; padding:0;">✖</button></span>
                    </div>
                `;
            });

            document.getElementById('cartTotal').innerText = total.toFixed(2);
            totalDiv.style.display = 'block';
            checkoutBtn.style.display = 'block';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            document.getElementById('cartCount').innerText = cart.length;
            renderCart();
        }

        // --- 4. CONTROL DE MODALES Y PAGO ---
        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function openCheckout() {
            toggleModal('cartModal');
            toggleModal('checkoutModal');
        }

        function processPayment(event) {
            event.preventDefault(); // Evita que recargue la página
            alert(translations[currentLang].successMsg);
            
            // Limpiar carrito después del "pago"
            cart = [];
            document.getElementById('cartCount').innerText = "0";
            renderCart();
            toggleModal('checkoutModal');
            document.getElementById('paymentForm').reset();
        }

        // Inicializar
        renderProducts();
    </script>
</body>
</html>
