<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV Zury Dayanna - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#D19C97">
    <meta property="og:title" content="XV Zury Dayanna - Recuerdos">
    <meta property="og:description" content="Sube tus fotos y videos favoritos de la fiesta.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosa: {
                            elegante: '#D19C97', 
                            oscuro: '#B57A74'
                        },
                        blanco: {
                            perla: '#FCF9F9'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --rosa-elegante: #D19C97;
            --blanco-perla: #FCF9F9;
            --bg-floral: url('https://i.imgur.com/1jA6vDL.jpeg');
            --font-serif: 'Cormorant Garamond', serif;
            --font-script: 'Pinyon Script', cursive;
            --font-body: 'Montserrat', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100svh;
            font-family: var(--font-body); 
            background-color: var(--blanco-perla);
            color: #2C2A2A;
            scroll-behavior: smooth;
        }
        
        h1, h2, h3, p, select, button, label, input { font-family: var(--font-body); }
        .serif { font-family: var(--font-serif); }
        .font-script { font-family: var(--font-script) !important; font-weight: 400; }

        .bg-floral-section {
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.50), rgba(0,0,0,0.6), rgba(0,0,0,0.7)), var(--bg-floral);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .bg-texture-main {
            background-image: url('https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/%C3%8Dtems%20boda%20negro/Textura%20sobre.png');
            background-size: 400px;
            opacity: 0.15;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .filtro-rosa {
            filter: brightness(0) saturate(100%) invert(75%) sepia(16%) saturate(718%) hue-rotate(314deg) brightness(89%) contrast(92%);
        }

        select option { background-color: #ffffff; color: #2C2A2A; }
        select { text-align-last: center; } 
        
        .input-zury {
            background-color: transparent; 
            border: none;
            border-bottom: 1px solid rgba(209, 156, 151, 0.5);
            color: #2C2A2A;
            border-radius: 0px; 
            font-size: 16px;
            font-family: var(--font-serif);
            transition: border-color 0.3s ease;
        }
        .input-zury:focus { border-color: var(--rosa-elegante); outline: none; }
        .input-zury::placeholder { color: rgba(44, 42, 42, 0.4); font-family: var(--font-serif); font-style: italic; }

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }

        /* Fix iOS parallax issue */
        @supports (-webkit-touch-callout: none) {
            .bg-floral-section { background-attachment: scroll; }
        }
    </style>
</head>
<body class="bg-floral-section relative flex flex-col items-center justify-start min-h-[100svh]">

    <div class="bg-texture-main"></div>

    <div class="max-w-5xl w-full flex flex-col items-center pt-16 pb-12 px-6 relative z-10" id="mainContainer">
        
        <h1 class="text-7xl md:text-9xl font-script text-white mb-2 text-center drop-shadow-lg">Recuerdos</h1>
        <p class="text-[10px] md:text-[12px] tracking-[0.4em] uppercase text-white font-bold mb-8 text-center drop-shadow-md">Mis XV Zury Dayanna</p>

        <p class="serif text-lg md:text-2xl italic text-white/90 leading-relaxed mb-10 text-center max-w-lg drop-shadow-sm">
            Hay momentos inolvidables que se atesoran para siempre en el corazón. Comparte los tuyos aquí.
        </p>

        <button id="openModalBtn" class="bg-white text-rosa-elegante font-bold py-4 px-10 rounded-sm uppercase tracking-[0.3em] text-[10px] shadow-lg hover:bg-rosa-elegante hover:text-white transition-all active:scale-95 border border-transparent hover:border-white duration-300">
            Subir mis fotos 
        </button>

        <div class="w-full pt-16 mt-6 flex flex-col items-center">
            <p class="text-[9px] text-white/80 uppercase tracking-[0.3em] mb-4 font-bold drop-shadow-md">Vista de Galería</p>
            <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-sm p-1 flex inline-flex shadow-sm mb-10">
                <button id="btn1Col" class="px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-rosa-elegante bg-white rounded-sm transition-all">1 Columna</button>
                <button id="btn2Col" class="px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-white hover:bg-white/20 rounded-sm transition-all">2 Columnas</button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-3 gap-6 w-full px-2">
            </div>
        </div>
        
    </div>

    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
        <div class="relative bg-blanco-perla border border-rosa-elegante/30 rounded-md w-full max-w-md p-8 shadow-2xl flex flex-col items-center max-h-[90vh] overflow-y-auto overflow-x-hidden">
            
          
            <div class="bg-texture-main opacity-20"></div>

            <button id="closeModalBtnIcon" class="absolute top-5 right-5 text-rosa-elegante hover:text-rosa-oscuro transition-colors z-20 bg-white/50 rounded-full p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-6xl font-script text-rosa-elegante mb-8 mt-4 text-center relative z-10 drop-shadow-sm">Tus Momentos</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-6 text-left relative z-10 px-2">
                <div>
                    <label class="text-[#2C2A2A] text-[9px] font-bold tracking-[0.2em] uppercase mb-1 block opacity-80">Familia / Nombre</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia Gómez" class="input-zury py-2 w-full text-center">
                </div>
                
                <div>
                    <label class="text-[#2C2A2A] text-[9px] font-bold tracking-[0.2em] uppercase mb-1 block opacity-80">Momento del evento</label>
                    <select id="folderSelect" class="input-zury py-2 w-full cursor-pointer appearance-none text-center">
                        <option value="" disabled selected class="italic">Elige una opción...</option>
                        <option value="Ceremonia">Ceremonia Religiosa</option>
                        <option value="Recepción">La Recepción</option>
                        <option value="Brindis">El Brindis</option>
                        <option value="Pastel">El Pastel</option>
                        <option value="Vals">El Vals</option>
                        <option value="Baile">El Baile</option>
                    </select>
                </div>
                
                <div class="mt-2">
                    <label class="text-[#2C2A2A] text-[9px] font-bold tracking-[0.2em] uppercase mb-2 block opacity-80">Seleccionar archivos</label>
                    <div id="dropZone" class="relative border border-dashed border-rosa-elegante bg-white/50 rounded-md p-8 text-center transition-colors hover:bg-white cursor-pointer shadow-sm">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-rosa-elegante mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-[#2C2A2A] text-[10px] font-bold uppercase tracking-widest">Toca aquí para elegir</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-rosa-elegante/20 rounded-md bg-white shadow-sm">
                        <p class="text-[8px] text-[#2C2A2A] text-center py-2 uppercase font-bold border-b border-rosa-elegante/10 tracking-[0.2em]">Archivos seleccionados:</p>
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="w-full py-2.5 text-[9px] text-red-400 uppercase font-bold hover:bg-red-50 transition-colors rounded-b-md tracking-widest">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-4">
                    <button id="btnCancelar" class="flex-1 bg-white border border-rosa-elegante/30 text-[#2C2A2A] font-bold rounded-sm py-3.5 text-[9px] tracking-[0.2em] uppercase hover:bg-gray-50 transition-colors shadow-sm">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-rosa-elegante text-white border border-rosa-elegante font-bold rounded-sm py-3.5 text-[9px] tracking-[0.2em] uppercase shadow-md hover:-translate-y-1 transition-transform">Subir Álbum</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="text-[10px] uppercase tracking-widest font-bold mt-6 text-rosa-oscuro bg-white/80 p-4 rounded-sm border border-rosa-elegante/30 hidden text-center w-full relative z-10 shadow-sm"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // NOTA: Recuerda cambiar las credenciales para apuntar al proyecto de Zury en Firebase.
        // Aquí mantengo las del ejemplo, pero he cambiado la colección a "muro_zury".
        const firebaseConfig = {
              apiKey: "",
              authDomain: "",
              projectId: "",
              storageBucket: "",
              messagingSenderId: "",
              appId: ""
            };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");

        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

                archivoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            previewContainer.innerHTML = "";
            // Usamos DataTransfer para filtrar y dejar solo los archivos que cumplen la regla
            const validFiles = new DataTransfer(); 

            for (const file of files) {
                if (file.type.includes("video")) {
                    // Validación de duración para Zury
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    const duration = await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            window.URL.revokeObjectURL(video.src);
                            resolve(video.duration);
                        };
                        video.src = URL.createObjectURL(file);
                    });

                    // Si el video dura más de 30 segundos, avisamos y lo saltamos
                    if (duration > 30.5) {
                        alert(`El video "${file.name}" es muy largo. El límite para el muro de Zury es de 30 segundos.`);
                        continue;
                    }
                }
                
                validFiles.items.add(file);

                // Crear miniatura para la previsualización
                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-gray-100 rounded-sm overflow-hidden shadow-sm border border-gray-200";
                
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/30"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            }

            // Actualizamos el input original con la lista de archivos filtrados
            archivoInput.files = validFiles.files;

            if (archivoInput.files.length > 0) {
                dropZone.classList.add('hidden');
                previsualizacion.classList.remove('hidden');
            } else {
                previsualizacion.classList.add('hidden');
                dropZone.classList.remove('hidden');
            }
        });

        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) return alert("Por favor, completa todos los campos para continuar.");

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, 'xv_zury/' + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_zury"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "¡Recuerdos guardados con éxito!";
            setTimeout(() => location.reload(), 1500);
        });

        // Alternar vistas
        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-rosa-elegante bg-white rounded-sm transition-all";
            btn2Col.className = "px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-white hover:bg-white/20 rounded-sm transition-all";
            muro.className = "columns-1 md:columns-2 gap-6 w-full px-2";
        });
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-rosa-elegante bg-white rounded-sm transition-all";
            btn1Col.className = "px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-white hover:bg-white/20 rounded-sm transition-all";
            muro.className = "columns-2 md:columns-3 gap-4 w-full px-1";
        });

        // Dibujar Muro
        let isFirstLoad = true;
        const q = query(collection(db, "muro_zury"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="serif text-white/90 text-xl col-span-full py-12 text-center break-inside-avoid drop-shadow-sm">Aún no hay recuerdos. ¡Sé el primero en subir un momento mágico!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto rounded-t-sm bg-gray-100 cursor-pointer object-cover"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto rounded-t-sm object-cover">`;
                    
                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "break-inside-avoid mb-8 bg-white/95 backdrop-blur-sm rounded-sm shadow-xl border border-rosa-elegante/20 flex flex-col group hover:-translate-y-1 transition-transform duration-300";
                    
                    divTarjeta.innerHTML = `
                        <div class="relative">
                            <span class="absolute top-3 right-3 bg-rosa-elegante text-white text-[8px] font-bold px-3 py-1.5 rounded-sm uppercase z-10 shadow-md tracking-[0.2em]">${datos.momento}</span>
                            ${media}
                        </div>
                        <div class="flex items-center justify-between p-4">
                            <h4 class="text-[#2C2A2A] font-bold uppercase text-[10px] tracking-[0.2em] truncate flex-1">${datos.nombre}</h4>
                            <div class="flex items-center gap-2">
                                <button onclick="darLike('${id}')" class="flex items-center gap-1.5 text-rosa-elegante hover:text-rosa-oscuro transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span id="contador-likes-${id}" class="font-bold text-sm serif num-likes">${datos.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) {
                        contadorLikes.innerText = datos.likes;
                    }
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) {
                        tarjetaRemover.remove();
                    }
                }
            });

            isFirstLoad = false;
        });

        window.darLike = async function(id) {
            const docRef = doc(db, "muro_zury", id);
            await updateDoc(docRef, { likes: increment(1) });
        };

        window.activarVideo = function(id) {
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
