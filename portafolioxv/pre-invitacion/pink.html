<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pre Invitación - XV Nahomi Alexa</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#E6A8B8">
    <meta property="og:title" content="Pre Invitación - Mis XV Nahomi Alexa">
    <meta property="og:description" content="Reserva la fecha. Me encantaría celebrar este día especial contigo.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosa: { pastel: '#E6A8B8' },
                        blanco: { perla: '#F0EFEA' }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Imperial+Script&family=Unna:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --rosa-pastel: #E6A8B8;
            --blanco-perla: #F0EFEA;
            --font-elegant: 'Unna', serif;
            --font-script: 'Imperial Script', cursive;
            --font-numbers: 'Cinzel', serif; 
        }

        /* Ocultamos el scroll para forzar una sola pantalla perfecta */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: var(--font-elegant);
            background-color: #000;
            overflow: hidden; 
            color: var(--blanco-perla);
        }

        h1, h2, h3, h4, .serif, label, button, span, p { 
            font-family: var(--font-elegant); 
        }

        .font-numbers { font-family: var(--font-numbers) !important; }
        body, p, span { font-weight: 400; }
        .font-bold, h3, label { font-weight: 700; }
        .font-script { font-family: var(--font-script) !important; font-weight: 400; }

        /* --- SOBRE ANIMADO --- */
        #envelope-wrapper {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            transition: visibility 1.8s;
        }
        .envelope-bg {
            position: absolute; inset: 0;
            background-image: url("https://i.imgur.com/3CAvnBj.jpeg");
            background-size: cover; transition: opacity 1.2s ease-in-out; z-index: 1;
        }
        .flap-wrapper { position: absolute; top: 0; width: 50%; height: 100%; transition: transform 1.8s cubic-bezier(0.7, 0, 0.3, 1); will-change: transform; }
        .flap-left-wrapper { left: 0; z-index: 6; filter: drop-shadow(15px 0px 25px rgba(0,0,0,0.2)); }
        .flap-right-wrapper { right: 0; z-index: 5; filter: drop-shadow(-10px 0px 25px rgba(0,0,0,0.2)); }
        
        .flap { width: 100%; height: 100%; background-image: url("https://i.imgur.com/3CAvnBj.jpeg"); background-size: cover; }
        .flap-left { clip-path: polygon(0 0, 100% 50%, 0 100%); background-position: left center; }
        .flap-right { clip-path: polygon(100% 0, 0 50%, 100% 100%); background-position: right center; }
        .seal-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #envelope-wrapper.open .envelope-bg { opacity: 0; }
        #envelope-wrapper.open .flap-left-wrapper { transform: translateX(-800%); }
        #envelope-wrapper.open .flap-right-wrapper { transform: translateX(89%); }
        #envelope-wrapper.open .seal-wrapper { opacity: 0; transform: translate(-50%, -50%) scale(0.6); pointer-events: none; }

        #section-main { display: none; height: 100svh; position: relative; }

        /* --- ANIMACIONES DE ENTRADA --- */
        .reveal-scale { opacity: 0; transform: scale(0.9); transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
        .reveal-scale.active { opacity: 1; transform: scale(1); }
        .delay-100 { transition-delay: 150ms; }
        .delay-200 { transition-delay: 300ms; }

        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .spin-slow { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Sombra leve para los textos rosa */
        .sombra-leve { text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.6); }
    </style>
</head>
<body>

    <!-- MÚSICA -->
    <audio id="bg-music" loop>
        <source src="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/songs/ArianaGrande-intro(end%20of%20the%20world).mp3" type="audio/mpeg">
    </audio>
    <div id="audio-btn" class="fixed bottom-[20px] right-[20px] w-[35px] h-[35px] bg-transparent flex items-center justify-center z-[50] cursor-pointer transition-all duration-300 hidden" onclick="toggleAudio()">
        <img id="audio-icon" src="https://i.imgur.com/GbsF6Vh.png" class="w-full h-full object-cover" alt="Música">
    </div>

    <!-- SOBRE DE INICIO -->
    <div id="envelope-wrapper">
        <div class="envelope-bg"></div>
        <div id="envelope-container" class="w-full h-full relative z-10">
            <div class="flap-wrapper flap-left-wrapper">
                <div class="flap flap-left"></div>
            </div>
            <div class="flap-wrapper flap-right-wrapper">
                <div class="flap flap-right"></div>
            </div>
            <div class="seal-wrapper" onclick="openEnvelope()">
                <div class="text-lg mb-3 animate-bounce text-white font-light">Toca para abrir</div>
                <img src="https://i.imgur.com/yLDqFJ7.png" 
                     class="w-[120px]" style="animation: floating 6s infinite ease-in-out" alt="Sello">
            </div>
        </div>
    </div>

    <!-- TARJETA ÚNICA -->
    <main id="section-main">
        <!-- FONDO GIF FIJO CON BLUR -->
        <div class="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat blur-[5px] scale-105" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.65)), url('https://i.imgur.com/MmXulZL.gif');"></div>
        
        <!-- CONTENEDOR PRINCIPAL: Usa justify-evenly para distribuir el espacio vertical automáticamente -->
        <div class="relative z-10 h-full w-full max-w-2xl mx-auto flex flex-col justify-evenly items-center px-4 py-6 md:py-10 text-center">
            
            <!-- BLOQUE 1: Corona y Save the Date -->
            <div class="reveal-scale active flex flex-col items-center relative pt-4">
                <svg width="200" height="70" viewBox="0 0 250 90" class="absolute -top-4 md:-top-2 overflow-visible">
                    <path id="curve-text" d="M 20,80 Q 125,20 230,80" fill="transparent" />
                    <text width="250" text-anchor="middle">
                        <textPath href="#curve-text" startOffset="50%" class="fill-white font-bold text-sm tracking-[0.3em] uppercase">Save the date</textPath>
                    </text>
                </svg>
                <img src="https://i.imgur.com/yOsSYnN.png" alt="Corona" class="w-32 mt-4 relative z-10">
            </div>

            <!-- BLOQUE 2: Nombre -->
            <div class="reveal-scale active w-full">
                <h1 class="text-8xl font-script text-rosa-pastel sombra-leve">Nahomi</h1>
            </div>

            <!-- BLOQUE 3: Frase y Padres -->
            <div class="reveal-scale active delay-100 flex flex-col items-center gap-4 w-full px-2 md:px-8">
                <p class="text-base text-white/95 italic leading-relaxed font-light max-w-sm">
                    "Hoy celebro la vida, los sueños que comienzan a florecer y la ilusión de una nueva etapa. Mis quince años representan un momento inolvidable."
                </p>
            
            </div>

            <!-- Divisor -->
            <div class="reveal-scale active delay-100 w-20 h-[1px] bg-white/30 rounded-full shadow-[0_0_8px_rgba(255,255,255,0.2)]"></div>

            <!-- BLOQUE 4: Fecha -->
            <div class="reveal-scale active delay-200 flex items-center justify-center gap-5 md:gap-10">
                <div class="flex flex-col items-center text-center text-white">
                    <span class="text-xs md:text-base tracking-[0.4em] uppercase mb-1">Sábado</span>
                    <span class="text-6xl md:text-7xl leading-none font-numbers text-rosa-pastel sombra-leve">13</span>
                </div>
                <div class="w-px h-16 md:h-20 bg-white/40 shadow-[0_0_5px_rgba(255,255,255,0.3)]"></div>
                <div class="flex flex-col text-left text-white justify-center">
                    <span class="text-3xl md:text-4xl tracking-widest block font-bold leading-none mb-1">JUN</span>
                    <span class="text-xs md:text-base tracking-[0.5em] font-numbers text-rosa-pastel sombra-leve">2026</span>
                </div>
            </div>

            <!-- BLOQUE 5: Ciudad y Footer -->
            <div class="reveal-scale active delay-200 flex flex-col items-center">
                <h3 class="text-xl md:text-3xl font-numbers font-bold text-white uppercase tracking-[0.2em] mb-2">Aguascalientes</h3>
                <p class="text-sm md:text-base text-white/80 italic max-w-xs md:max-w-md px-2">Reserva la fecha. Pronto recibirás la invitación formal con todos los detalles.</p>
            </div>

        </div>
    </main>

    <script>
        // Función para abrir el sobre
        function openEnvelope() {
            document.getElementById('section-main').style.display = 'block';
            playAudio(); 

            document.getElementById('envelope-wrapper').classList.add('open');
            
            // Animaciones del interior
            setTimeout(() => {
                document.querySelectorAll('.reveal-scale').forEach(el => el.classList.add('active'));
                document.getElementById('audio-btn').classList.remove('hidden'); 
            }, 800);

            // Ocultar sobre del DOM
            setTimeout(() => {
                document.getElementById('envelope-wrapper').style.display = 'none';
            }, 1800);
        }

        // Lógica de Audio
        const audio = document.getElementById("bg-music");
        const audioIcon = document.getElementById("audio-icon");
        let isPlaying = false;

        function playAudio() {
            audio.play().then(() => {
                isPlaying = true;
                audioIcon.classList.add('spin-slow');
            }).catch(error => {
                console.log("Autoplay bloqueado. El usuario debe tocar el botón de música.");
            });
        }

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                audioIcon.classList.remove('spin-slow');
            } else {
                audio.play();
                audioIcon.classList.add('spin-slow');
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
