<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro de Recuerdos - XV Grettel</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#025939">
    <meta property="og:title" content="Mis XV Grettel - Recuerdos">
    <meta property="og:description" content="Sube tus fotos y videos favoritos de la fiesta.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        esmeralda: '#025939',
                        negro: '#111111',
                        blanco: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Poiret+One:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --esmeralda: #025939;
            --blanco: #FFFFFF;
            --negro: #111111;
            --font-elegant: 'Poiret One', sans-serif;
            --font-script: 'Italianno', cursive;
            --font-numbers: 'Poiret One', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100svh;
            font-family: var(--font-elegant); 
            background-color: var(--blanco); 
            color: var(--negro);
            scroll-behavior: smooth;
            overflow-x: hidden;
            font-weight: 600;
        }
        
        h1, p, select, button, label, input { font-family: var(--font-elegant); }
        .font-script { font-family: var(--font-script) !important; font-weight: 400; }
        .font-numbers { font-family: var(--font-numbers) !important; font-weight: 800; }
        .font-bold { font-weight: 800; }

        /* Fondo fijo elegante (floral con capa blanca para legibilidad) */
        .fondo-completo {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1; 
            background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.95)), url('https://i.imgur.com/5l1f4vK.png');
            background-size: cover; 
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .filtro-esmeralda { 
            filter: brightness(0) saturate(100%) invert(24%) sepia(34%) saturate(1637%) hue-rotate(119deg) brightness(97%) contrast(98%); 
        }

        select option { background-color: #ffffff; color: #111111; }
        select { text-align-last: center; } 
        
        .input-suelen {
            background-color: rgba(255, 255, 255, 0.8); 
            border: 1px solid rgba(2, 89, 57, 0.2); color: var(--negro);
            border-radius: 8px; font-size: 15px; font-weight: 800;
        }
        .input-suelen:focus { border-color: var(--esmeralda); outline: none; box-shadow: 0 0 0 2px rgba(2, 89, 57, 0.2); background-color: #ffffff; }
        .input-suelen::placeholder { color: rgba(17, 17, 17, 0.5); font-weight: 600; }

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }

        /* Estilo de tarjeta de galería adaptado al diseño */
        .tarjeta-recuerdo {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(2, 89, 57, 0.15);
            border-radius: 0px; /* Bordes rectos para mantener el estilo elegante/clásico */
            padding: 10px;
            box-shadow: 0 10px 30px -5px rgba(2, 89, 57, 0.1);
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        .tarjeta-recuerdo:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body class="relative flex flex-col items-center">

    <!-- Capa de fondo -->
    <div class="fondo-completo"></div>

    <div class="max-w-4xl w-full min-h-[100svh] flex flex-col items-center py-16 px-6 relative z-10" id="mainContainer">
        
        <img src="https://i.imgur.com/Hv9gZUu.png" class="w-24 md:w-32 mb-4 drop-shadow-sm filtro-esmeralda hover:scale-105 transition-transform duration-500" alt="Corona">
        
        <h1 class="text-8xl md:text-9xl font-script text-esmeralda mb-2 text-center drop-shadow-sm leading-none">Recuerdos</h1>
        <p class="text-sm tracking-[0.3em] uppercase text-negro font-bold mb-8 text-center border-b border-esmeralda/30 pb-2 px-6">Mis XV Grettel</p>

        <p class="text-base font-bold leading-relaxed mb-10 text-center max-w-md text-negro/80">
            Ayúdame a capturar cada momento. Comparte tus fotos y videos favoritos de esta noche inolvidable.
        </p>

        <button id="openModalBtn" class="bg-esmeralda text-blanco font-bold py-4 px-10 rounded-none uppercase tracking-[0.2em] text-sm shadow-xl hover:-translate-y-1 hover:bg-negro transition-all active:scale-95 border border-esmeralda">
            Subir recuerdos 
        </button>

        <div class="w-full pt-12 mt-6 border-t border-esmeralda/20 flex flex-col items-center">
            <p class="text-[11px] text-negro/70 uppercase tracking-[0.2em] mb-4 font-bold">Vista de Galería</p>
            <div class="bg-esmeralda/5 backdrop-blur-sm border border-esmeralda/20 rounded-full p-1 flex inline-flex shadow-sm mb-8">
                <button id="btn1Col" class="px-6 py-2.5 text-[11px] font-bold uppercase tracking-wider text-blanco bg-esmeralda rounded-full transition-all">1 Columna</button>
                <button id="btn2Col" class="px-6 py-2.5 text-[11px] font-bold uppercase tracking-wider text-esmeralda hover:bg-esmeralda/10 rounded-full transition-all">2 Columnas</button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-2 gap-6 w-full px-2">
            </div>
        </div>
        
    </div>

    <!-- Modal para subir archivos -->
    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-negro/80 backdrop-blur-md hidden">
        <div class="relative bg-blanco border-2 border-esmeralda rounded-none w-full max-w-md p-8 shadow-2xl flex flex-col items-center max-h-[90vh] overflow-y-auto">
            
            <button id="closeModalBtnIcon" class="absolute top-5 right-5 text-esmeralda/60 hover:text-esmeralda transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-7xl font-script text-esmeralda mb-6 mt-2 text-center drop-shadow-sm">Sube tus momentos</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-6 text-left">
                <div>
                    <label class="text-esmeralda text-[11px] font-bold tracking-widest uppercase mb-2 block">Tu nombre / Familia *</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia Martínez" class="input-suelen px-4 py-3 w-full text-center uppercase tracking-wider">
                </div>
                
                <div>
                    <label class="text-esmeralda text-[11px] font-bold tracking-widest uppercase mb-2 block">Momento del evento *</label>
                    <select id="folderSelect" class="input-suelen px-4 py-3 w-full cursor-pointer appearance-none text-center uppercase tracking-wider text-xs">
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="Ceremonia">Ceremonia Religiosa</option>
                        <option value="Recepción">Llegada a la Recepción</option>
                        <option value="Vals">El Vals</option>
                        <option value="Cena">La Cena</option>
                        <option value="Baile">A Bailar / Fiesta</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-esmeralda text-[11px] font-bold tracking-widest uppercase mb-2 block">Seleccionar archivos *</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-esmeralda/40 bg-esmeralda/5 rounded-none p-8 text-center transition-colors hover:bg-esmeralda/10">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-esmeralda mb-3 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-esmeralda text-[12px] font-bold uppercase tracking-widest">Elige fotos o videos</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-esmeralda/20 bg-blanco shadow-inner p-2">
                        <p class="text-[10px] text-negro text-center py-2 uppercase font-bold border-b border-esmeralda/10 tracking-widest mb-2">Archivos seleccionados:</p>
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="w-full mt-2 py-3 text-[11px] text-red-600 uppercase font-bold hover:bg-red-50 transition-colors tracking-widest border border-red-200">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-4">
                    <button id="btnCancelar" class="flex-1 bg-transparent border border-esmeralda/30 text-esmeralda font-bold py-4 text-[11px] tracking-widest uppercase hover:bg-esmeralda/5 transition-colors">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-esmeralda text-blanco font-bold py-4 text-[11px] tracking-widest uppercase shadow-md hover:-translate-y-1 transition-transform border border-esmeralda">Subir al Álbum</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="text-[12px] uppercase tracking-widest font-bold mt-6 text-esmeralda bg-esmeralda/10 p-4 border border-esmeralda/20 hidden text-center w-full"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // NOTA: Recuerda cambiar estas credenciales por las de tu proyecto en Firebase.
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.firebasestorage.app",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");
        const removePreviewBtn = document.getElementById('removePreviewBtn');

        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

        // Limpiar selección
        removePreviewBtn.addEventListener('click', () => {
            archivoInput.value = "";
            previewContainer.innerHTML = "";
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        archivoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            previewContainer.innerHTML = "";
            const validFiles = new DataTransfer(); 

            for (const file of files) {
                if (file.type.includes("video")) {
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    const duration = await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            window.URL.revokeObjectURL(video.src);
                            resolve(video.duration);
                        };
                        video.src = URL.createObjectURL(file);
                    });

                    // Límite de 30 segundos
                    if (duration > 30.5) {
                        alert(`El video "${file.name}" es muy largo. El límite para el muro es de 30 segundos.`);
                        continue;
                    }
                }
                
                validFiles.items.add(file);

                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-gray-100 overflow-hidden shadow-sm border border-gray-200";
                
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/30"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            }

            archivoInput.files = validFiles.files;

            if (archivoInput.files.length > 0) {
                dropZone.classList.add('hidden');
                previsualizacion.classList.remove('hidden');
            } else {
                previsualizacion.classList.add('hidden');
                dropZone.classList.remove('hidden');
            }
        });

        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) return alert("Completa todos los campos para continuar.");

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, 'xv_grettel/' + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_xv_grettel"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "Recuerdos guardados con éxito";
            setTimeout(() => location.reload(), 1500);
        });

        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "px-6 py-2.5 text-[11px] font-bold uppercase tracking-wider text-blanco bg-esmeralda rounded-full transition-all";
            btn2Col.className = "px-6 py-2.5 text-[11px] font-bold uppercase tracking-wider text-esmeralda hover:bg-esmeralda/10 rounded-full transition-all";
            muro.className = "columns-1 md:columns-2 gap-6 w-full px-2";
        });
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "px-6 py-2.5 text-[11px] font-bold uppercase tracking-wider text-blanco bg-esmeralda rounded-full transition-all";
            btn1Col.className = "px-6 py-2.5 text-[11px] font-bold uppercase tracking-wider text-esmeralda hover:bg-esmeralda/10 rounded-full transition-all";
            muro.className = "columns-2 md:columns-3 gap-4 w-full px-1";
        });

        // Dibujar Muro
        let isFirstLoad = true;
        const q = query(collection(db, "muro_xv_grettel"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="text-negro/80 font-bold text-sm col-span-full py-12 text-center break-inside-avoid">Aún no hay recuerdos. ¡Sé el primero en subir algo!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto cursor-pointer border border-esmeralda/10"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto border border-esmeralda/10">`;
                    
                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "tarjeta-recuerdo group";
                    
                    divTarjeta.innerHTML = `
                        <span class="absolute top-4 right-4 bg-esmeralda/90 backdrop-blur-sm text-blanco text-[9px] font-bold px-3 py-1.5 uppercase z-10 shadow-sm tracking-widest">${datos.momento}</span>
                        ${media}
                        <div class="flex items-center justify-between mt-3 px-1">
                            <h4 class="text-esmeralda font-bold uppercase text-[11px] tracking-widest truncate flex-1">${datos.nombre}</h4>
                            <div class="flex items-center gap-3">
                                <button onclick="darLike('${id}')" class="flex items-center gap-1.5 text-esmeralda/40 hover:text-esmeralda transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span id="contador-likes-${id}" class="font-bold text-base text-negro font-numbers">${datos.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) {
                        contadorLikes.innerText = datos.likes;
                    }
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) {
                        tarjetaRemover.remove();
                    }
                }
            });

            isFirstLoad = false;
        });

        window.darLike = async function(id) {
            const docRef = doc(db, "muro_xv_grettel", id);
            await updateDoc(docRef, { likes: increment(1) });
        };

        window.activarVideo = function(id) {
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
