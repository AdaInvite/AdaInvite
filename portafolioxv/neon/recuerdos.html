<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro de Recuerdos - XV Karely</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#000000">
    <meta property="og:title" content="Mis XV Karely - Recuerdos">
    <meta property="og:description" content="Sube tus fotos y videos favoritos de la fiesta.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: {
                            rosa: '#FFB6C1',
                            fuerte: '#FF1493'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-elegant: 'Montserrat', sans-serif;
            --font-script: 'Imperial Script', cursive;
            --font-numbers: 'Montserrat', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100svh;
            font-family: var(--font-elegant); 
            background-color: #000000; 
            color: #FFFFFF;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        
        .font-script { font-family: var(--font-script) !important; }
        .font-body { font-family: var(--font-elegant) !important; }

        /* EFECTO CRISTAL CON BRILLO ROSA */
        .glass-card {
            background-color: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 192, 203, 0.4);
            border-radius: 20px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(255, 182, 193, 0.2),
                inset 0 0 10px rgba(255, 192, 203, 0.1);  
            color: #FFFFFF;
        }

        .box-glow-pink {
            border: 1px solid rgba(255, 192, 203, 0.6) !important;
            box-shadow: 
                0 0 15px rgba(255, 182, 193, 0.5),
                inset 0 0 10px rgba(255, 192, 203, 0.2) !important;
        }

        .text-glow-pink {
            text-shadow: 
                0 0 5px rgba(255, 192, 203, 0.9),
                0 0 15px rgba(255, 182, 193, 0.8),
                0 0 30px rgba(255, 105, 180, 0.6);
        }

        select option { background-color: #111; color: #FFF; }
        select { text-align-last: center; } 
        
        .input-neon {
            background-color: rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(255, 192, 203, 0.4); color: #FFFFFF;
            border-radius: 12px; font-size: 14px; font-weight: 500;
            transition: all 0.3s ease;
        }
        .input-neon:focus { 
            border-color: #FF69B4; outline: none; 
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5); 
            background-color: rgba(0, 0, 0, 0.8);
        }
        .input-neon::placeholder { color: rgba(255, 255, 255, 0.4); font-weight: 300; }

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }

        /* Ocultar barra de desplazamiento en contenedor de previsualización */
        #previewContainer::-webkit-scrollbar { width: 6px; }
        #previewContainer::-webkit-scrollbar-thumb { background: rgba(255,192,203,0.5); border-radius: 10px; }

        .tarjeta-recuerdo {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .tarjeta-recuerdo:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.4), inset 0 0 10px rgba(255, 192, 203, 0.2);
        }
    </style>
</head>
<body class="relative flex flex-col items-center">

    <!-- Fondo de Video Dinámico -->
    <video autoplay loop muted playsinline class="fixed inset-0 w-full h-full object-cover z-0 pointer-events-none opacity-60">
        <source src="https://i.imgur.com/2HwTQec.gif" type="video/mp4">
    </video>

    <!-- Gradiente para oscurecer la parte inferior y facilitar la lectura -->
    <div class="fixed inset-0 bg-gradient-to-b from-transparent via-black/40 to-black/80 z-0 pointer-events-none"></div>

    <div class="max-w-4xl w-full min-h-[100svh] flex flex-col items-center py-16 px-6 relative z-10" id="mainContainer">
        
        <!-- Corona -->
        <img src="https://i.imgur.com/LSVVTfv.png" class="w-24 md:w-32 mb-4 opacity-80 hover:opacity-100 transition-opacity duration-500" alt="Corona">
        
        <h1 class="text-7xl md:text-8xl font-script text-white mb-2 text-center text-glow-pink">Recuerdos</h1>
        <p class="font-body text-[10px] tracking-[0.4em] uppercase text-white mb-8 text-center font-bold">Mis XV Karely</p>

        <p class="text-sm md:text-base font-medium leading-relaxed mb-10 px-4 text-center max-w-md text-white/90">
            Comparte tus fotos y videos favoritos de esta noche iluminada y llena de magia.
        </p>

        <button id="openModalBtn" class="bg-black/50 backdrop-blur-md text-white font-bold py-4 px-10 rounded-full uppercase tracking-[0.2em] text-[11px] box-glow-pink hover:bg-white hover:text-black transition-all active:scale-95">
            Subir recuerdos 
        </button>

        <div class="w-full pt-12 mt-6 border-t border-white/20 flex flex-col items-center">
            <p class="text-[10px] text-white/70 uppercase tracking-widest mb-4 font-bold">Vista de Galería</p>
            <div class="bg-white/10 backdrop-blur-md border border-neon-rosa/30 rounded-full p-1 flex inline-flex shadow-lg mb-8">
                <button id="btn1Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-black bg-white rounded-full transition-all">1 Columna</button>
                <button id="btn2Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/20 rounded-full transition-all">2 Columnas</button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-2 gap-6 w-full px-2">
            </div>
        </div>
        
    </div>

    <!-- Modal para subir archivos -->
    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="relative glass-card w-full max-w-md p-8 flex flex-col items-center max-h-[90vh] overflow-y-auto">
            
            <button id="closeModalBtnIcon" class="absolute top-5 right-5 text-white/50 hover:text-white hover:drop-shadow-[0_0_8px_rgba(255,192,203,0.8)] transition-all">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-6xl font-script text-white mb-8 mt-2 text-center text-glow-pink">Sube tus momentos</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-5 text-left">
                <div>
                    <label class="text-white text-[10px] font-bold tracking-widest uppercase mb-2 block opacity-90">Tu nombre / Familia *</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia Martínez" class="input-neon px-4 py-3.5 w-full text-center uppercase tracking-wider">
                </div>
                
                <div>
                    <label class="text-white text-[10px] font-bold tracking-widest uppercase mb-2 block opacity-90">Momento del evento *</label>
                    <select id="folderSelect" class="input-neon px-4 py-3.5 w-full cursor-pointer appearance-none text-center uppercase tracking-wider text-[11px]">
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="Ceremonia">Misa de Acción</option>
                        <option value="Cóctel">Cóctel de Bienvenida</option>
                        <option value="Fiesta">¡A Celebrar!</option>
                        <option value="Vals">Mi Vals</option>
                        <option value="Tornafiesta">Tornafiesta</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-white text-[10px] font-bold tracking-widest uppercase mb-2 block opacity-90">Seleccionar archivos *</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-neon-rosa/50 bg-black/40 rounded-xl p-8 text-center transition-colors hover:bg-neon-rosa/10 cursor-pointer">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-neon-rosa mb-3 drop-shadow-[0_0_8px_rgba(255,105,180,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-white text-[11px] font-bold uppercase tracking-widest">Elige fotos o videos</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-neon-rosa/40 rounded-xl bg-black/60 shadow-lg">
                        <p class="text-[9px] text-white text-center py-3 uppercase font-bold border-b border-neon-rosa/20 tracking-widest">Archivos seleccionados:</p>
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="w-full py-3 text-[10px] text-red-400 uppercase font-bold hover:bg-red-500/20 transition-colors rounded-b-xl tracking-widest">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-4">
                    <button id="btnCancelar" class="flex-1 bg-transparent border border-white/30 text-white font-bold rounded-full py-4 text-[10px] tracking-widest uppercase hover:bg-white/10 transition-colors">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-white text-black font-bold rounded-full py-4 text-[10px] tracking-widest uppercase box-glow-pink hover:bg-black hover:text-white transition-all active:scale-95">Subir al Álbum</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="text-[11px] uppercase tracking-widest font-bold mt-6 text-white bg-neon-rosa/20 p-4 rounded-xl box-glow-pink hidden text-center w-full"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // NOTA: Recuerda cambiar estas credenciales por las de tu proyecto en Firebase.
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.firebasestorage.app",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");
        const removePreviewBtn = document.getElementById('removePreviewBtn');

        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

        // Limpiar selección
        removePreviewBtn.addEventListener('click', () => {
            archivoInput.value = "";
            previewContainer.innerHTML = "";
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        archivoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            previewContainer.innerHTML = "";
            const validFiles = new DataTransfer(); 

            for (const file of files) {
                if (file.type.includes("video")) {
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    const duration = await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            window.URL.revokeObjectURL(video.src);
                            resolve(video.duration);
                        };
                        video.src = URL.createObjectURL(file);
                    });

                    // Límite de 30 segundos
                    if (duration > 30.5) {
                        alert(`El video "${file.name}" es muy largo. El límite para el muro es de 30 segundos.`);
                        continue;
                    }
                }
                
                validFiles.items.add(file);

                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-black/50 rounded-lg overflow-hidden border border-neon-rosa/50 shadow-[0_0_5px_rgba(255,105,180,0.5)]";
                
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-[1px]"><svg class="w-6 h-6 text-white drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            }

            archivoInput.files = validFiles.files;

            if (archivoInput.files.length > 0) {
                dropZone.classList.add('hidden');
                previsualizacion.classList.remove('hidden');
            } else {
                previsualizacion.classList.add('hidden');
                dropZone.classList.remove('hidden');
            }
        });

        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) return alert("Completa todos los campos para continuar.");

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, 'xv_karely/' + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_xv_karely"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "Recuerdos guardados con éxito";
            setTimeout(() => location.reload(), 1500);
        });

        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-black bg-white rounded-full transition-all";
            btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/20 rounded-full transition-all";
            muro.className = "columns-1 md:columns-2 gap-6 w-full px-2";
        });
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/20 rounded-full transition-all";
            btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-black bg-white rounded-full transition-all";
            muro.className = "columns-2 md:columns-3 gap-4 w-full px-1";
        });

        // Dibujar Muro
        let isFirstLoad = true;
        const q = query(collection(db, "muro_xv_karely"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="text-white/60 font-bold text-sm col-span-full py-12 text-center break-inside-avoid">Aún no hay recuerdos. ¡Sé el primero en subir algo!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto rounded-xl cursor-pointer"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto rounded-xl">`;
                    
                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "glass-card tarjeta-recuerdo p-2 group";
                    
                    divTarjeta.innerHTML = `
                        <span class="absolute top-4 right-4 bg-black/70 backdrop-blur-md text-white text-[9px] font-bold px-3 py-1.5 rounded-full uppercase z-10 box-glow-pink tracking-widest">${datos.momento}</span>
                        ${media}
                        <div class="flex items-center justify-between mt-3 px-2 mb-1">
                            <h4 class="text-white font-bold uppercase text-[10px] tracking-widest truncate flex-1">${datos.nombre}</h4>
                            <div class="flex items-center gap-3">
                                <button onclick="darLike('${id}')" class="flex items-center gap-1.5 text-neon-rosa/70 hover:text-neon-rosa hover:drop-shadow-[0_0_8px_rgba(255,105,180,0.8)] transition-all">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span id="contador-likes-${id}" class="font-bold text-sm text-white font-numbers">${datos.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) {
                        contadorLikes.innerText = datos.likes;
                    }
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) {
                        tarjetaRemover.remove();
                    }
                }
            });

            isFirstLoad = false;
        });

        window.darLike = async function(id) {
            const docRef = doc(db, "muro_xv_karely", id);
            await updateDoc(docRef, { likes: increment(1) });
        };

        window.activarVideo = function(id) {
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
