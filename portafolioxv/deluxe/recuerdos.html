<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV Mayte - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#F5F5F0">
    <meta property="og:title" content="XV Mayte - Recuerdos">
    <meta property="og:description" content="Sube tus fotos y videos favoritos de la fiesta.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        terracota: '#2A2A2A', 
                        blanco: { perla: '#FFFFFF' }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-elegant: 'Montserrat', sans-serif;
            --font-script: 'Imperial Script', cursive;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100svh;
            font-family: var(--font-elegant); color: #2A2A2A;
            scroll-behavior: smooth;
        }
        
        h1, p, select, button { font-family: var(--font-elegant); }
        .font-script { font-family: var(--font-script) !important; font-weight: 400; }
        
        .fondo-perla {
            background-image: url('https://i.imgur.com/b8LgH93.gif');
            background-size: cover; 
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #000000;
        }

        .forma-ovalada {
            background-color: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4); 
            border-radius: 200px 200px 0 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);  
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            width: 95vw;
            max-width: 600px; 
            min-height: 100svh; 
            padding: 15% 4% 10% 4%; 
        }

        select option { background-color: #ffffff; color: #2A2A2A; }
        select { text-align-last: center; } 
        
        .input-mayte {
            background-color: rgba(255,255,255,0.6); backdrop-filter: blur(4px);
            border: 1px solid rgba(42, 42, 42, 0.3); color: #2A2A2A;
            border-radius: 8px; font-family: sans-serif; font-size: 14px;
        }
        .input-mayte:focus { border-color: #DCB9AE; outline: none; background-color: rgba(255,255,255,0.9); }
        .input-mayte::placeholder { color: rgba(42, 42, 42, 0.5); }

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }
    </style>
</head>
<body class="fondo-perla relative flex flex-col pt-8">

    <div class="forma-ovalada" id="mainContainer">
        
        <img src="https://i.imgur.com/SE9aJNw.png" class="w-20 mx-auto mb-6 drop-shadow-sm" alt="Corona">
        <h1 class="text-7xl md:text-8xl font-script text-white mb-0 text-center drop-shadow-sm">Recuerdos</h1>
        <p class="text-[10px] tracking-[0.4em] uppercase text-white font-bold mb-8 text-center mt-2">XV Mayte</p>

        <p class="text-xs italic text-white leading-relaxed mb-6 font-medium px-6 text-center max-w-sm">
            Comparte tus fotos y videos favoritos de la fiesta con nosotros.
        </p>

        <button id="openModalBtn" class="bg-white text-terracota font-bold py-3 px-8 rounded-full uppercase tracking-[0.2em] text-[10px] flex items-center justify-center gap-2 mb-8 shadow-md hover:scale-105 transition-transform active:scale-95">
            Subir recuerdos 
        </button>

        <div class="w-full pt-8 border-t border-terracota/10 flex flex-col items-center">
            <p class="text-[9px] text-white uppercase tracking-widest mb-3 font-bold">Vista de Galería</p>
            <div class="bg-white/40 backdrop-blur-sm border border-terracota/20 rounded-full p-1 flex inline-flex shadow-sm mb-6">
                <button id="btn1Col" class="px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-terracota bg-white rounded-full transition-all">1 Columna</button>
                <button id="btn2Col" class="px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-terracota hover:bg-white/50 text-terracota rounded-full transition-all">2 Columnas</button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-2 gap-4 w-full px-2">
            </div>
        </div>
        
    </div>

    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-terracota/90 backdrop-blur-sm hidden">
        <div class="relative bg-white border border-blanco-perla rounded-3xl w-full max-w-md p-6 shadow-2xl flex flex-col items-center max-h-[90vh] overflow-y-auto">
            
            <button id="closeModalBtnIcon" class="absolute top-4 right-4 text-terracota/50 hover:text-terracota transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-5xl font-script text-terracota mb-6 mt-2 text-center">Sube tus momentos</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-4 text-left font-sans">
                <div>
                    <label class="text-terracota text-[10px] font-bold tracking-widest uppercase mb-1.5 block">Tu nombre *</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia Gómez" class="input-mayte px-4 py-3 w-full text-center">
                </div>
                
                <div>
                    <label class="text-terracota text-[10px] font-bold tracking-widest uppercase mb-1.5 block">Momento del evento *</label>
                    <select id="folderSelect" class="input-mayte px-4 py-3 w-full cursor-pointer appearance-none text-center">
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="En la iglesia">En la iglesia</option>
                        <option value="En la recepción">En la recepción</option>
                        <option value="Cena">Cena</option>
                        <option value="El Vals">El Vals</option>
                        <option value="El baile">El baile</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-terracota text-[10px] font-bold tracking-widest uppercase mb-1.5 block">Seleccionar archivos *</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-terracota bg-white rounded-xl p-6 text-center">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-black mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-terracota text-[11px] font-bold uppercase tracking-widest">Elige varias fotos o videos</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-terracota/10 rounded-xl bg-gray-50">
                        <p class="text-[9px] text-terracota/70 text-center py-2 uppercase font-bold border-b border-terracota/10">Archivos seleccionados:</p>
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="w-full py-2 text-[9px] text-red-500 uppercase font-bold hover:bg-red-50 transition-colors rounded-b-xl">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-4">
                    <button id="btnCancelar" class="flex-1 bg-gray-100 text-terracota font-bold rounded-full py-3.5 text-[10px] tracking-widest uppercase hover:bg-gray-200 transition-colors">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-white texto-negro font-bold rounded-full py-3.5 text-[10px] tracking-widest uppercase shadow-md hover:scale-105 transition-transform">Subir al Álbum</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="text-[10px] uppercase tracking-widest font-bold mt-4 text-terracota bg-blanco-perla/20 p-3 rounded-lg border border-blanco-perla hidden text-center w-full font-sans"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");

        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

                // BUSCA ESTA LÍNEA Y REEMPLAZA TODO EL BLOQUE HASTA EL CIERRE DEL EVENTO
        archivoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            previewContainer.innerHTML = "";
            // Usamos DataTransfer para manejar los archivos válidos
            const validFiles = new DataTransfer(); 

            for (const file of files) {
                if (file.type.includes("video")) {
                    // Validación de duración
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    const duration = await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            window.URL.revokeObjectURL(video.src);
                            resolve(video.duration);
                        };
                        video.src = URL.createObjectURL(file);
                    });

                    if (duration > 30.5) {
                        alert(`El video "${file.name}" dura más de 30s. Por favor elige uno más corto.`);
                        continue;
                    }
                }
                
                validFiles.items.add(file);

                // Previsualización elegante para Mayte
                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-gray-200 rounded-md overflow-hidden shadow-sm";
                
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/30"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            }

            // Actualizar el input con los archivos filtrados
            archivoInput.files = validFiles.files;

            if (archivoInput.files.length > 0) {
                dropZone.classList.add('hidden');
                previsualizacion.classList.remove('hidden');
            } else {
                previsualizacion.classList.add('hidden');
                dropZone.classList.remove('hidden');
            }
        });

        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) return alert("Completa todos los campos para continuar.");

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, 'xv_mayte/' + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_mayte"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "Recuerdos guardados con éxito";
            setTimeout(() => location.reload(), 1500);
        });

        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-terracota bg-white rounded-full transition-all";
            btn2Col.className = "px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/50 rounded-full transition-all";
            muro.className = "columns-1 md:columns-2 gap-4 w-full px-2";
        });
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-terracota bg-white rounded-full transition-all";
            btn1Col.className = "px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/50 rounded-full transition-all";
            muro.className = "columns-2 md:columns-3 gap-3 w-full px-1";
        });

        // Dibujar Muro con optimización (docChanges)
        let isFirstLoad = true;
        const q = query(collection(db, "muro_mayte"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="text-white text-sm opacity-70 col-span-full font-sans py-4 text-center break-inside-avoid">Aún no hay recuerdos. ¡Sé el primero!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    // MODIFICACIÓN: Agregamos onclick y cursor-pointer al video
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto rounded-xl shadow-md bg-white/50 cursor-pointer"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto rounded-xl shadow-md">`;
                    
                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "break-inside-avoid mb-6 relative group flex flex-col";
                    
                    divTarjeta.innerHTML = `
                        <span class="absolute top-2 right-2 bg-white/80 backdrop-blur-sm text-terracota text-[8px] font-bold px-3 py-1 rounded-full uppercase z-10 shadow-sm">${datos.momento}</span>
                        ${media}
                        <div class="flex items-center justify-between mt-2 px-1">
                            <h4 class="text-white font-bold uppercase text-[10px] tracking-widest truncate flex-1 font-sans">${datos.nombre}</h4>
                            <div class="flex items-center gap-3">
                                <button onclick="darLike('${id}')" class="flex items-center gap-1 text-blanco-perla hover:text-white transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span id="contador-likes-${id}" class="font-bold text-sm num-likes">${datos.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) {
                        contadorLikes.innerText = datos.likes;
                    }
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) {
                        tarjetaRemover.remove();
                    }
                }
            });

            isFirstLoad = false;
        });

        // FUNCIONES DE INTERACCIÓN
        window.darLike = async function(id) {
            // El like ahora solo suma likes
            const docRef = doc(db, "muro_mayte", id);
            await updateDoc(docRef, { likes: increment(1) });
        };

        window.activarVideo = function(id) {
            // Nueva función: al tocar el video, se quita el silencio y salen los controles
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                // Quitamos el cursor-pointer para que se sienta como un video normal después del clic
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
