<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro de Recuerdos - XV Analiz</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#6E7F6A">
    <meta property="og:title" content="Mis XV Analiz - Recuerdos">
    <meta property="og:description" content="Sube tus fotos y videos favoritos de la fiesta.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        verde: {
                            aqua: '#6E7F6A'
                        },
                        blanco: {
                            perla: '#F0EFEA'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Birthstone+Bounce:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --verde-aqua: #6E7F6A;
            --blanco-perla: #F0EFEA;
            --font-elegant: 'Montserrat', sans-serif;
            --font-script: 'Birthstone Bounce', cursive;
            --font-serif: 'Cormorant Garamond', serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100svh;
            font-family: var(--font-elegant); 
            background-color: var(--blanco-perla); 
            color: #2C2A2A;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        
        .font-script { font-family: var(--font-script) !important; font-weight: 500; }
        .font-serif { font-family: var(--font-serif) !important; }
        .font-body { font-family: var(--font-elegant) !important; }

        /* Fondo fijo elegante con el patrón floral de la invitación */
        .fondo-completo {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1; 
            background-image: linear-gradient(rgba(240, 239, 234, 0.92), rgba(240, 239, 234, 0.97)), url('https://i.imgur.com/uR2i1n1.jpeg');
            background-size: cover; 
            background-position: center center;
            background-attachment: fixed;
        }

        .filtro-verde { 
            filter: brightness(0) saturate(100%) invert(50%) sepia(12%) saturate(836%) hue-rotate(74deg) brightness(93%) contrast(85%);
        }

        select option { background-color: #ffffff; color: #2C2A2A; }
        select { text-align-last: center; } 
        
        .input-suelen {
            background-color: rgba(255, 255, 255, 0.8); 
            border: 1px solid rgba(110, 127, 106, 0.3); color: #2C2A2A;
            border-radius: 20px; font-size: 14px;
            transition: all 0.3s ease;
        }
        .input-suelen:focus { border-color: var(--verde-aqua); outline: none; box-shadow: 0 0 0 3px rgba(110, 127, 106, 0.15); background-color: #ffffff; }
        .input-suelen::placeholder { color: rgba(44, 42, 42, 0.4); font-weight: 400; }

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }

        /* Estilo de tarjeta de galería floral */
        .tarjeta-recuerdo {
            background: #ffffff;
            border: 1px solid rgba(110, 127, 106, 0.15);
            border-radius: 1.5rem; 
            padding: 12px;
            box-shadow: 0 10px 30px -5px rgba(110, 127, 106, 0.1);
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .tarjeta-recuerdo:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px -5px rgba(110, 127, 106, 0.2);
        }

        /* Scrollbar suave para las previsualizaciones */
        #previewContainer::-webkit-scrollbar { width: 6px; }
        #previewContainer::-webkit-scrollbar-thumb { background: rgba(110, 127, 106, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="relative flex flex-col items-center">

    <!-- Capa de fondo -->
    <div class="fondo-completo"></div>

    <div class="max-w-4xl w-full min-h-[100svh] flex flex-col items-center py-16 px-6 relative z-10" id="mainContainer">
        
        <!-- Corona floral -->
        <img src="https://i.imgur.com/vH9i3Dk.png" class="w-20 md:w-28 mb-4 drop-shadow-sm filtro-verde hover:scale-105 transition-transform duration-500" alt="Corona">
        
        <h1 class="text-7xl md:text-8xl font-script text-verde-aqua mb-2 text-center drop-shadow-sm leading-none pr-4">Recuerdos</h1>
        <p class="font-body text-[10px] tracking-[0.3em] uppercase text-[#2C2A2A] font-bold mb-8 text-center border-b border-verde-aqua/30 pb-2 px-6">Mis XV Analiz</p>

        <p class="font-serif text-lg md:text-xl italic text-[#2C2A2A]/80 leading-relaxed mb-10 text-center max-w-md font-medium">
            Ayúdame a capturar cada momento.<br> Comparte tus fotos y videos favoritos de esta noche tan especial.
        </p>

        <button id="openModalBtn" class="bg-verde-aqua text-white font-bold py-4 px-10 rounded-full uppercase tracking-[0.15em] text-[11px] shadow-lg hover:-translate-y-1 hover:shadow-xl transition-all active:scale-95 border border-transparent">
            Subir recuerdos 
        </button>

        <div class="w-full pt-12 mt-6 border-t border-verde-aqua/20 flex flex-col items-center">
            <p class="text-[10px] text-[#2C2A2A]/60 uppercase tracking-[0.2em] mb-4 font-bold">Vista de Galería</p>
            <div class="bg-white/60 backdrop-blur-sm border border-verde-aqua/20 rounded-full p-1 flex inline-flex shadow-sm mb-8">
                <button id="btn1Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white bg-verde-aqua rounded-full transition-all">1 Columna</button>
                <button id="btn2Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-verde-aqua hover:bg-verde-aqua/10 rounded-full transition-all">2 Columnas</button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-2 gap-6 w-full px-2">
            </div>
        </div>
        
    </div>

    <!-- Modal para subir archivos -->
    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#2C2A2A]/60 backdrop-blur-sm hidden">
        <div class="relative bg-blanco-perla border border-white rounded-[2rem] w-full max-w-md p-8 shadow-2xl flex flex-col items-center max-h-[90vh] overflow-y-auto">
            
            <!-- Patrón de fondo sutil en el modal -->
            <div class="absolute inset-0 z-0 opacity-40 mix-blend-multiply" style="background-image: url('https://i.imgur.com/L1h3O9J.png'); border-radius: 2rem;"></div>

            <button id="closeModalBtnIcon" class="absolute top-5 right-5 text-verde-aqua/60 hover:text-verde-aqua transition-colors z-20 bg-white p-2 rounded-full shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-6xl font-script text-verde-aqua mb-8 mt-4 text-center drop-shadow-sm relative z-10 pr-2">Sube tus momentos</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-6 text-left relative z-10">
                <div>
                    <label class="text-[#2C2A2A] text-[10px] font-bold tracking-widest uppercase mb-2 block ml-2">Tu nombre / Familia *</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia Martínez" class="input-suelen px-5 py-3.5 w-full text-center uppercase tracking-wider font-bold">
                </div>
                
                <div>
                    <label class="text-[#2C2A2A] text-[10px] font-bold tracking-widest uppercase mb-2 block ml-2">Momento del evento *</label>
                    <select id="folderSelect" class="input-suelen px-5 py-3.5 w-full cursor-pointer appearance-none text-center uppercase tracking-wider text-[11px] font-bold">
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="Ceremonia">Ceremonia Religiosa</option>
                        <option value="Recepción">Llegada a la Recepción</option>
                        <option value="Vals">El Vals</option>
                        <option value="Cena">La Cena</option>
                        <option value="Baile">El Baile</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-[#2C2A2A] text-[10px] font-bold tracking-widest uppercase mb-2 block ml-2">Seleccionar archivos *</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-verde-aqua/40 bg-white/60 rounded-[1.5rem] p-8 text-center transition-colors hover:bg-verde-aqua/10 backdrop-blur-sm">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-verde-aqua mb-3 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-[#2C2A2A] text-[11px] font-bold uppercase tracking-widest">Elige fotos o videos</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-verde-aqua/20 bg-white shadow-sm rounded-2xl p-2">
                        <p class="text-[9px] text-[#2C2A2A] text-center py-2 uppercase font-bold border-b border-gray-100 tracking-widest mb-2">Archivos seleccionados:</p>
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="w-full mt-2 py-3 text-[10px] text-red-500 uppercase font-bold hover:bg-red-50 transition-colors tracking-widest rounded-xl">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-4">
                    <button id="btnCancelar" class="flex-1 bg-white border border-gray-200 text-[#2C2A2A] font-bold py-4 rounded-full text-[10px] tracking-widest uppercase hover:bg-gray-50 transition-colors shadow-sm">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-verde-aqua text-white font-bold py-4 rounded-full text-[10px] tracking-widest uppercase shadow-md hover:-translate-y-1 hover:shadow-lg transition-all">Subir al Álbum</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="text-[11px] uppercase tracking-widest font-bold mt-6 text-verde-aqua bg-verde-aqua/10 p-4 rounded-2xl border border-verde-aqua/20 hidden text-center w-full relative z-10"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // NOTA: Recuerda cambiar estas credenciales por las de tu proyecto en Firebase.
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.firebasestorage.app",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");
        const removePreviewBtn = document.getElementById('removePreviewBtn');

        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

        // Limpiar selección
        removePreviewBtn.addEventListener('click', () => {
            archivoInput.value = "";
            previewContainer.innerHTML = "";
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        archivoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            previewContainer.innerHTML = "";
            const validFiles = new DataTransfer(); 

            for (const file of files) {
                if (file.type.includes("video")) {
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    const duration = await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            window.URL.revokeObjectURL(video.src);
                            resolve(video.duration);
                        };
                        video.src = URL.createObjectURL(file);
                    });

                    // Límite de 30 segundos
                    if (duration > 30.5) {
                        alert(`El video "${file.name}" es muy largo. El límite para el muro es de 30 segundos.`);
                        continue;
                    }
                }
                
                validFiles.items.add(file);

                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-gray-100 rounded-lg overflow-hidden shadow-sm border border-gray-200";
                
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/30"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            }

            archivoInput.files = validFiles.files;

            if (archivoInput.files.length > 0) {
                dropZone.classList.add('hidden');
                previsualizacion.classList.remove('hidden');
            } else {
                previsualizacion.classList.add('hidden');
                dropZone.classList.remove('hidden');
            }
        });

        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) return alert("Completa todos los campos para continuar.");

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, 'xv_analiz/' + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_xv_analiz"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "Recuerdos guardados con éxito";
            setTimeout(() => location.reload(), 1500);
        });

        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white bg-verde-aqua rounded-full transition-all";
            btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-verde-aqua hover:bg-verde-aqua/10 rounded-full transition-all";
            muro.className = "columns-1 md:columns-2 gap-6 w-full px-2";
        });
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white bg-verde-aqua rounded-full transition-all";
            btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-verde-aqua hover:bg-verde-aqua/10 rounded-full transition-all";
            muro.className = "columns-2 md:columns-3 gap-4 w-full px-1";
        });

        // Dibujar Muro
        let isFirstLoad = true;
        const q = query(collection(db, "muro_xv_analiz"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="text-[#2C2A2A]/60 font-medium text-sm col-span-full py-12 text-center break-inside-avoid">Aún no hay recuerdos. ¡Sé el primero en subir algo!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto rounded-[1rem] cursor-pointer shadow-sm"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto rounded-[1rem] shadow-sm">`;
                    
                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "tarjeta-recuerdo group";
                    
                    divTarjeta.innerHTML = `
                        <span class="absolute top-5 right-5 bg-white/90 backdrop-blur-sm text-verde-aqua text-[9px] font-bold px-4 py-2 rounded-full uppercase z-10 shadow-sm tracking-widest border border-verde-aqua/20">${datos.momento}</span>
                        ${media}
                        <div class="flex items-center justify-between mt-4 px-2">
                            <h4 class="text-[#2C2A2A] font-bold uppercase text-[10px] tracking-widest truncate flex-1">${datos.nombre}</h4>
                            <div class="flex items-center gap-3">
                                <button onclick="darLike('${id}')" class="flex items-center gap-1.5 text-verde-aqua/60 hover:text-verde-aqua transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span id="contador-likes-${id}" class="font-bold text-lg text-verde-aqua font-serif italic">${datos.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) {
                        contadorLikes.innerText = datos.likes;
                    }
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) {
                        tarjetaRemover.remove();
                    }
                }
            });

            isFirstLoad = false;
        });

        window.darLike = async function(id) {
            const docRef = doc(db, "muro_xv_analiz", id);
            await updateDoc(docRef, { likes: increment(1) });
        };

        window.activarVideo = function(id) {
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
