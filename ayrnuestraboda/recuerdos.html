<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Recuerdos - Boda Ale y Ramón</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FFFFFF">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        verde: {
                            principal: '#7A8B71', 
                            oscuro: '#5A6653'
                        },
                        cafe: {
                            claro: '#A39587',
                            texto: '#5C554F'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&family=Pinyon+Script&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-elegant: 'Forum', serif;
            --font-script: 'Pinyon Script', cursive;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100svh;
            font-family: var(--font-elegant);
            background-color: #FFFFFF; 
            color: #5C554F;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        
        .font-script { font-family: var(--font-script) !important; font-weight: 400; }
        .font-elegant { font-family: var(--font-elegant) !important; }

        /* Texturas idénticas a la invitación */
        .textura-papel {
            background-color: #FFFFFF;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.2'/%3E%3C/svg%3E");
        }

        .textura-beige {
            background-color: #F8F5F0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.2'/%3E%3C/svg%3E");
        }

        .hojas-decor { pointer-events: none; mix-blend-mode: multiply; }

        /* Estilos de Inputs para el Modal */
        select option { background-color: #ffffff; color: #5C554F; }
        select { text-align-last: center; } 
        
        .input-elegante {
            background-color: #ffffff; 
            border: 1px solid rgba(163, 149, 135, 0.4); 
            color: #5C554F;
            border-radius: 12px; font-size: 16px;
            transition: all 0.3s ease;
        }
        .input-elegante:focus { 
            border-color: #7A8B71; 
            outline: none; 
            box-shadow: 0 0 0 2px rgba(122, 139, 113, 0.2); 
        }
        .input-elegante::placeholder { color: rgba(92, 85, 79, 0.4); }

        #uploadModal { transition: opacity 0.4s ease, visibility 0.4s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 180px; overflow-y: auto; padding: 10px;
        }

        /* Tarjeta estilo fotografía/polaroid */
        .tarjeta-recuerdo {
            background: #ffffff;
            border: 1px solid rgba(163, 149, 135, 0.2);
            padding: 10px 10px 16px 10px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 4px 10px -5px rgba(0,0,0,0.02);
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }
    </style>
</head>
<body class="relative flex flex-col items-center antialiased textura-papel">

    <!-- Decoración Hojas (Arriba izquierda e invertida) -->
    <img src="https://i.imgur.com/PQQImpW.png" class="absolute top-0 left-0 w-36 hojas-decor transform -scale-x-100 opacity-80" alt="Hojas">
    <img src="https://i.imgur.com/PQQImpW.png" class="absolute top-0 right-0 w-36  hojas-decor opacity-80" alt="Hojas">

    <div class="max-w-4xl w-full min-h-[100svh] flex flex-col items-center py-20 px-6 relative z-10" id="mainContainer">
        
        <!-- Título -->
        <p class="text-sm uppercase tracking-[0.4em] text-cafe-texto font-bold text-center mb-4">Ale & Ramón</p>
        <h1 class="text-5xl font-script text-verde-oscuro mb-4 text-center leading-none">Álbum<br>Compartido</h1>
        <p class="text-xs uppercase tracking-widest text-gray-500 mb-10 text-center max-w-sm mx-auto leading-relaxed">
            Ayúdanos a capturar cada momento especial. Sube tus fotos y videos favoritos de la boda.
        </p>

        <button id="openModalBtn" class="bg-verde-principal text-white font-bold py-4 px-10 rounded-lg text-xs uppercase tracking-[0.2em] shadow-md hover:bg-verde-oscuro hover:-translate-y-1 transition-all active:scale-95 flex items-center gap-3">
            Subir Recuerdos
        </button>

        <!-- Galería -->
        <div class="w-full pt-4 mt-8 border-t border-cafe-claro/20 flex flex-col items-center relative">
            
            <div class="textura-beige border border-cafe-claro/30 rounded-lg p-1 flex inline-flex shadow-sm mb-10">
                <button id="btn1Col" class="px-8 py-3 text-[10px] font-bold uppercase tracking-widest text-white bg-verde-principal rounded-md transition-all">1 Columna</button>
                <button id="btn2Col" class="px-8 py-3 text-[10px] font-bold uppercase tracking-widest text-verde-oscuro hover:bg-white/50 rounded-md transition-all">2 Columnas</button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-2 lg:columns-3 gap-6 w-full px-2">
                <!-- Los recuerdos se inyectan aquí -->
            </div>
        </div>
        
    </div>

    <!-- MODAL PARA SUBIR ARCHIVOS -->
    <div id="uploadModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
        <div class="relative textura-beige border border-cafe-claro/30 rounded-3xl w-full max-w-md p-8 shadow-2xl flex flex-col items-center max-h-[90vh] overflow-y-auto">
            
            <button id="closeModalBtnIcon" class="absolute top-5 right-5 text-gray-400 hover:text-cafe-texto transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-5xl font-script text-verde-oscuro mb-8 mt-2 text-center">Sube tus momentos</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-6 text-left">
                <div>
                    <label class="text-xs uppercase tracking-widest text-cafe-texto mb-2 pl-1 font-bold block">Tu nombre / Familia *</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia López" class="input-elegante px-4 py-3.5 w-full font-elegant">
                </div>
                
                <div>
                    <label class="text-xs uppercase tracking-widest text-cafe-texto mb-2 pl-1 font-bold block">Momento del evento *</label>
                    <select id="folderSelect" class="input-elegante px-4 py-3.5 w-full cursor-pointer appearance-none font-elegant uppercase text-sm tracking-widest font-bold">
                        <option value="" disabled selected>Elige un momento...</option>
                        <option value="La Ceremonia">La Ceremonia</option>
                        <option value="La Recepción">La Recepción</option>
                        <option value="El Banquete">El Banquete</option>
                        <option value="El Primer Baile">El Primer Baile</option>
                        <option value="La Fiesta">La Fiesta</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-xs uppercase tracking-widest text-cafe-texto mb-2 pl-1 font-bold block">Archivos *</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-cafe-claro/50 bg-white/50 rounded-xl p-8 text-center transition-colors hover:bg-white hover:border-verde-principal">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-cafe-claro mb-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-cafe-texto text-[11px] font-bold uppercase tracking-widest">Toca para elegir fotos o videos</p>
                        <p class="text-[9px] text-gray-400 mt-2 uppercase tracking-widest">Máx. 30 segundos por video</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-cafe-claro/30 rounded-xl bg-white shadow-sm overflow-hidden">
                        <p class="text-[9px] text-cafe-texto text-center py-3 uppercase font-bold border-b border-cafe-claro/20 tracking-widest bg-gray-50">Archivos seleccionados:</p>
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="w-full py-3 text-[10px] text-red-400 uppercase font-bold hover:bg-red-50 transition-colors tracking-widest border-t border-cafe-claro/20">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-4">
                    <button id="btnCancelar" class="flex-1 bg-white border border-cafe-claro/40 text-cafe-texto font-bold rounded-lg py-4 text-[10px] tracking-widest uppercase hover:bg-gray-50 transition-colors">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-verde-principal text-white font-bold rounded-lg py-4 text-[10px] tracking-widest uppercase shadow-md hover:-translate-y-1 transition-transform">Subir al Álbum</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="text-[11px] uppercase tracking-widest font-bold mt-6 text-verde-oscuro bg-white p-4 rounded-xl border border-verde-principal/30 hidden text-center w-full shadow-sm"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // TUS CREDENCIALES DE FIREBASE
        const firebaseConfig = {
          apiKey: "AIzaSyDx6aIzPkxE3BKLwLegToNKb7hyEaddGA8",
          authDomain: "boda-a-y-r.firebaseapp.com",
          projectId: "boda-a-y-r",
          storageBucket: "boda-a-y-r.firebasestorage.app",
          messagingSenderId: "74608605808",
          appId: "1:74608605808:web:dd4bdb1a9d2bedb2c8d2b5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        
        const NOMB_COLECCION = "muro_boda_ar"; // Colección exclusiva
        const RUTA_STORAGE = "recuerdos_boda/"; // Carpeta de storage exclusiva

        // Referencias UI
        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");
        const removePreviewBtn = document.getElementById('removePreviewBtn');

        // Control Modal
        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

        // Limpiar selección
        removePreviewBtn.addEventListener('click', () => {
            archivoInput.value = "";
            previewContainer.innerHTML = "";
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        // Manejo de archivos e inputs
        archivoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            previewContainer.innerHTML = "";
            const validFiles = new DataTransfer(); 

            for (const file of files) {
                if (file.type.includes("video")) {
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    const duration = await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            window.URL.revokeObjectURL(video.src);
                            resolve(video.duration);
                        };
                        video.src = URL.createObjectURL(file);
                    });

                    if (duration > 30.5) {
                        alert(`El video "${file.name}" dura más de 30 segundos. Por favor elige uno más corto.`);
                        continue;
                    }
                }
                
                validFiles.items.add(file);

                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-gray-100 rounded-lg overflow-hidden shadow-sm border border-gray-200";
                
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/30"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            }

            archivoInput.files = validFiles.files;

            if (archivoInput.files.length > 0) {
                dropZone.classList.add('hidden');
                previsualizacion.classList.remove('hidden');
            } else {
                previsualizacion.classList.add('hidden');
                dropZone.classList.remove('hidden');
            }
        });

        // Subir a Firebase
        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value.trim();
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) return alert("Completa todos los campos para continuar.");

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, RUTA_STORAGE + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] Subiendo ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, NOMB_COLECCION), {
                                nombre, 
                                momento, 
                                url_multimedia: url, 
                                likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "¡Recuerdos guardados con éxito!";
            setTimeout(() => location.reload(), 1500);
        });

        // Vistas de Muro
        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "px-8 py-3 text-[10px] font-bold uppercase tracking-widest text-white bg-verde-principal rounded-md transition-all";
            btn2Col.className = "px-8 py-3 text-[10px] font-bold uppercase tracking-widest text-verde-oscuro hover:bg-white/50 rounded-md transition-all";
            muro.className = "columns-1 md:columns-2 gap-6 w-full px-2";
        });
        
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "px-8 py-3 text-[10px] font-bold uppercase tracking-widest text-white bg-verde-principal rounded-md transition-all";
            btn1Col.className = "px-8 py-3 text-[10px] font-bold uppercase tracking-widest text-verde-oscuro hover:bg-white/50 rounded-md transition-all";
            muro.className = "columns-2 md:columns-3 lg:columns-4 gap-4 w-full px-1";
        });

        // Dibujar Muro en Tiempo Real
        let isFirstLoad = true;
        const q = query(collection(db, NOMB_COLECCION), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="text-gray-400 font-medium text-sm col-span-full py-16 text-center break-inside-avoid border-2 border-dashed border-cafe-claro/30 rounded-xl mx-4">Aún no hay recuerdos. ¡Sé el primero en subir un momento mágico!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto rounded-sm cursor-pointer border border-gray-100"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto rounded-sm border border-gray-100">`;
                    
                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "tarjeta-recuerdo group hover:-translate-y-1 transition-transform duration-300";
                    
                    divTarjeta.innerHTML = `
                        <span class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm text-verde-oscuro border border-verde-oscuro/20 text-[8px] font-bold px-3 py-1.5 rounded-sm uppercase z-10 shadow-sm tracking-widest">${datos.momento}</span>
                        ${media}
                        <div class="flex items-center justify-between mt-4 px-1">
                            <h4 class="text-cafe-texto font-bold uppercase text-[10px] tracking-[0.2em] truncate flex-1 font-sans">${datos.nombre}</h4>
                            <div class="flex items-center gap-3">
                                <button onclick="darLike('${id}')" class="flex items-center gap-1.5 text-cafe-claro hover:text-babyPink transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span id="contador-likes-${id}" class="font-bold text-sm text-verde-oscuro font-serif">${datos.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) {
                        contadorLikes.innerText = datos.likes;
                        // Pequeña animación al dar like
                        contadorLikes.parentElement.classList.add('scale-125', 'text-babyPink');
                        setTimeout(() => contadorLikes.parentElement.classList.remove('scale-125', 'text-babyPink'), 300);
                    }
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) {
                        tarjetaRemover.remove();
                    }
                }
            });

            isFirstLoad = false;
        });

        window.darLike = async function(id) {
            const docRef = doc(db, NOMB_COLECCION, id);
            await updateDoc(docRef, { likes: increment(1) });
        };

        window.activarVideo = function(id) {
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
