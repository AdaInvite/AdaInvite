<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV Suelen Camila - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#8496B0">
    <meta property="og:title" content="XV Suelen Camila - Recuerdos">
    <meta property="og:description" content="Sube tus fotos y videos favoritos de la fiesta.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        azul: {
                            principal: '#8496B0'
                        },
                        blanco: {
                            perla: '#F0EFEA'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --azul-principal: #8496B0;
            --blanco-perla: #F0EFEA;
            --font-elegant: 'Lora', serif;
            --font-script: 'Great Vibes', cursive;
            --font-numbers: 'Cinzel', serif; 
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100svh;
            font-family: var(--font-elegant); 
            background-color: var(--blanco-perla);
            color: #2C2A2A;
            scroll-behavior: smooth;
        }
        
        h1, p, select, button, label, input { font-family: var(--font-elegant); }
        .font-script { font-family: var(--font-script) !important; font-weight: 400; }
        .font-numbers { font-family: var(--font-numbers) !important; }

        .seccion-azul {
            position: relative; 
            overflow: hidden; 
            z-index: 1; 
            color: var(--blanco-perla);
            width: 100%;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(132, 150, 176, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .seccion-azul::before {
            content: "";
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px; 
            z-index: -1; 
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://i.imgur.com/7c26hP1.gif');
            background-size: cover;
            background-position: center;
            filter: blur(6px); 
        }

        @media (min-width: 768px) {
            .seccion-azul {
                border-radius: 60px;
            }
        }

        .filtro-blanco {
            filter: invert(100%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(100%);
        }

        select option { background-color: #ffffff; color: #2C2A2A; }
        select { text-align-last: center; } 
        
        .input-suelen {
            background-color: #ffffff; 
            border: 1px solid #d1d5db; color: #2C2A2A;
            border-radius: 12px; font-size: 14px;
        }
        .input-suelen:focus { border-color: var(--azul-principal); outline: none; box-shadow: 0 0 0 2px rgba(132, 150, 176, 0.2); }
        .input-suelen::placeholder { color: rgba(44, 42, 42, 0.5); }

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4 md:p-10">

    <div class="seccion-azul max-w-4xl w-full min-h-[90svh] flex flex-col items-center py-16 px-6" id="mainContainer">
        
        <img src="https://i.imgur.com/xu9ym4s.png" class="w-20 md:w-28 mb-6 drop-shadow-sm filtro-blanco" alt="Corona">
        
        <h1 class="text-6xl md:text-8xl font-script text-white mb-2 text-center drop-shadow-md">Recuerdos</h1>
        <p class="text-[11px] tracking-[0.4em] uppercase text-white font-bold mb-8 text-center">Mis XV Suelen Camila</p>

        <p class="text-sm md:text-base italic text-white/90 leading-relaxed mb-10 font-medium px-4 text-center max-w-md">
            Comparte tus fotos y videos favoritos de esta noche inolvidable con nosotros.
        </p>

        <button id="openModalBtn" class="bg-white text-azul-principal font-bold py-4 px-10 rounded-md uppercase tracking-[0.2em] text-[11px] shadow-lg hover:-translate-y-1 transition-all active:scale-95 border border-white">
            Subir recuerdos 
        </button>

        <div class="w-full pt-12 mt-4 border-t border-white/20 flex flex-col items-center">
            <p class="text-[10px] text-white/80 uppercase tracking-widest mb-4 font-bold">Vista de Galería</p>
            <div class="bg-black/20 backdrop-blur-sm border border-white/20 rounded-md p-1 flex inline-flex shadow-sm mb-8">
                <button id="btn1Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-azul-principal bg-white rounded transition-all">1 Columna</button>
                <button id="btn2Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/10 rounded transition-all">2 Columnas</button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-2 gap-6 w-full px-2">
            </div>
        </div>
        
    </div>

    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
        <div class="relative bg-blanco-perla border border-gray-200 rounded-[30px] w-full max-w-md p-8 shadow-2xl flex flex-col items-center max-h-[90vh] overflow-y-auto">
            
            <button id="closeModalBtnIcon" class="absolute top-5 right-5 text-azul-principal/60 hover:text-azul-principal transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-5xl font-script text-azul-principal mb-8 mt-2 text-center text-shadow-light">Sube tus momentos</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-5 text-left">
                <div>
                    <label class="text-[#2C2A2A] text-[10px] font-bold tracking-widest uppercase mb-2 block">Tu nombre *</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia Martínez" class="input-suelen px-4 py-3.5 w-full text-center uppercase tracking-wider font-bold">
                </div>
                
                <div>
                    <label class="text-[#2C2A2A] text-[10px] font-bold tracking-widest uppercase mb-2 block">Momento del evento *</label>
                    <select id="folderSelect" class="input-suelen px-4 py-3.5 w-full cursor-pointer appearance-none text-center uppercase tracking-wider font-bold text-[11px]">
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="Ceremonia">Ceremonia Religiosa</option>
                        <option value="Recepción">Llegada al Salón</option>
                        <option value="Cena">La Cena</option>
                        <option value="Vals">El Vals</option>
                        <option value="Baile">A Bailar</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-[#2C2A2A] text-[10px] font-bold tracking-widest uppercase mb-2 block">Seleccionar archivos *</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-azul-principal/50 bg-white rounded-xl p-8 text-center transition-colors hover:bg-gray-50">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-azul-principal mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-[#2C2A2A] text-[11px] font-bold uppercase tracking-widest">Elige fotos o videos</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-gray-200 rounded-xl bg-white shadow-sm">
                        <p class="text-[9px] text-[#2C2A2A] text-center py-3 uppercase font-bold border-b border-gray-100 tracking-widest">Archivos seleccionados:</p>
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="w-full py-3 text-[10px] text-red-500 uppercase font-bold hover:bg-red-50 transition-colors rounded-b-xl tracking-widest">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-6">
                    <button id="btnCancelar" class="flex-1 bg-white border border-gray-300 text-[#2C2A2A] font-bold rounded-md py-4 text-[10px] tracking-widest uppercase hover:bg-gray-50 transition-colors">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-azul-principal text-white border border-azul-principal font-bold rounded-md py-4 text-[10px] tracking-widest uppercase shadow-md hover:-translate-y-1 transition-transform">Subir al Álbum</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="text-[11px] uppercase tracking-widest font-bold mt-6 text-azul-principal bg-azul-principal/10 p-4 rounded-md border border-azul-principal/20 hidden text-center w-full"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // NOTA: Recuerda que estas credenciales siguen apuntando al proyecto de Mayte,
        // deberás cambiarlas por las del proyecto de Suelen Camila si creas uno nuevo en Firebase.
        const firebaseConfig = {
            apiKey: "AIzaSyC6oWLoLyRL3AUUpWceHQWlTHDZ4-wQ7tI",
            authDomain: "xv-mayte-3f7c3.firebaseapp.com",
            projectId: "xv-mayte-3f7c3",
            storageBucket: "xv-mayte-3f7c3.firebasestorage.app",
            messagingSenderId: "24046456453",
            appId: "1:24046456453:web:2aef8664b2c4343ebae3ec"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");

        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

        archivoInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            dropZone.classList.add('hidden');
            previsualizacion.classList.remove('hidden');
            previewContainer.innerHTML = "";

            files.forEach(file => {
                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-gray-200 rounded-md overflow-hidden shadow-sm";
                
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/30"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            });
        });

        document.getElementById('removePreviewBtn').addEventListener('click', () => {
            archivoInput.value = "";
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) return alert("Completa todos los campos para continuar.");

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, 'xv_suelen/' + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_suelen"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "Recuerdos guardados con éxito";
            setTimeout(() => location.reload(), 1500);
        });

        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-azul-principal bg-white rounded transition-all";
            btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/10 rounded transition-all";
            muro.className = "columns-1 md:columns-2 gap-6 w-full px-2";
        });
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-azul-principal bg-white rounded transition-all";
            btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/10 rounded transition-all";
            muro.className = "columns-2 md:columns-3 gap-4 w-full px-1";
        });

        // Dibujar Muro
        let isFirstLoad = true;
        const q = query(collection(db, "muro_suelen"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="text-white/80 italic text-sm col-span-full py-8 text-center break-inside-avoid">Aún no hay recuerdos. ¡Sé el primero en subir algo!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto rounded-xl shadow-md bg-white/10 cursor-pointer border border-white/20"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto rounded-xl shadow-md border border-white/20">`;
                    
                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "break-inside-avoid mb-8 relative group flex flex-col";
                    
                    divTarjeta.innerHTML = `
                        <span class="absolute top-3 right-3 bg-white text-azul-principal text-[9px] font-bold px-3 py-1.5 rounded uppercase z-10 shadow-md tracking-widest">${datos.momento}</span>
                        ${media}
                        <div class="flex items-center justify-between mt-3 px-1">
                            <h4 class="text-white font-bold uppercase text-[11px] tracking-[0.2em] truncate flex-1">${datos.nombre}</h4>
                            <div class="flex items-center gap-3">
                                <button onclick="darLike('${id}')" class="flex items-center gap-1.5 text-white/70 hover:text-white transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span id="contador-likes-${id}" class="font-bold text-sm font-numbers num-likes">${datos.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) {
                        contadorLikes.innerText = datos.likes;
                    }
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) {
                        tarjetaRemover.remove();
                    }
                }
            });

            isFirstLoad = false;
        });

        window.darLike = async function(id) {
            const docRef = doc(db, "muro_suelen", id);
            await updateDoc(docRef, { likes: increment(1) });
        };

        window.activarVideo = function(id) {
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
