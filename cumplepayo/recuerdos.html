<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 20 Danna Paola - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#800020">
    <meta property="og:title" content="Mis 20 Danna Paola - Recuerdos">
    <meta property="og:description" content="Sube tus fotos y videos favoritos de la fiesta.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vino: {
                            tinto: '#800020'
                        },
                        blanco: {
                            hueso: '#FAF9F6'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            --vino-tinto: #800020;
            --blanco-hueso: #FAF9F6;
            --font-serif: 'Cormorant Garamond', serif;
            --font-script: 'Pinyon Script', cursive;
            --font-body: 'Montserrat', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100svh;
            font-family: var(--font-body); 
            background-color: #050505; /* Fondo negro sólido */
            color: var(--blanco-hueso);
            scroll-behavior: smooth;
        }
        
        h1, h2, h3, p, select, button, label, input { font-family: var(--font-serif); font-weight: 400; }
        .font-script { font-family: var(--font-script) !important; font-weight: 400; }
        .font-body { font-family: var(--font-body); }
        .font-bold { font-weight: 600; }

        /* Utilidad para fondos oscuros */
        .bg-section-dark {
            background-color: #050505;
        }

        /* Cortes Decorativos */
        .corte-pico {
            clip-path: polygon(50% 0, 100% 4vw, 100% 100%, 0 100%, 0 4vw);
            -webkit-clip-path: polygon(50% 0, 100% 4vw, 100% 100%, 0 100%, 0 4vw);
            margin-top: -3.9vw;
            position: relative;
            z-index: 10;
        }
        
        .corte-valle {
            clip-path: polygon(0 0, 50% 4vw, 100% 0, 100% 100%, 0 100%);
            -webkit-clip-path: polygon(0 0, 50% 4vw, 100% 0, 100% 100%, 0 100%);
            margin-top: -3.9vw;
            position: relative;
            z-index: 10;
        }

        .text-shadow-dark { text-shadow: 0px 4px 15px rgba(0,0,0,0.8), 0px 0px 5px rgba(0,0,0,0.5); }
        .text-shadow-light { text-shadow: 0px 2px 10px rgba(128, 0, 32, 0.4); }

        select option { background-color: #050505; color: #FAF9F6; font-family: var(--font-serif); }
        select { text-align-last: center; } 
        
        .input-danna {
            background-color: transparent; 
            border: none; border-bottom: 1px solid rgba(250, 249, 246, 0.4);
            color: var(--blanco-hueso);
            border-radius: 0px; 
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .input-danna:focus { border-color: var(--vino-tinto); outline: none; background-color: rgba(128, 0, 32, 0.1); }
        .input-danna::placeholder { color: rgba(250, 249, 246, 0.4); font-style: italic; font-weight: 300;}

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }
        
        /* Pantalla de carga para procesamiento HEIC/Video */
        #processingOverlay {
            position: absolute; inset: 0;
            background: rgba(5,5,5,0.85); backdrop-filter: blur(3px);
            z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 0.75rem; transition: opacity 0.3s;
        }
        #processingOverlay.hidden { opacity: 0; pointer-events: none; display: none; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="relative flex flex-col items-center justify-start min-h-[100svh]">

    <div class="max-w-5xl w-full flex flex-col items-center pt-16 pb-20 px-6 relative z-10 bg-section-dark" id="mainContainer">
        
        <h1 class="text-7xl md:text-9xl font-script text-vino-tinto mb-4 text-center text-shadow-dark leading-none">Recuerdos</h1>
        <p class="font-body text-[10px] md:text-[12px] tracking-[0.4em] uppercase text-white/80 font-bold mb-8 text-center drop-shadow-md">Mis 20 Danna Paola</p>

        <p class="text-lg md:text-2xl italic text-white/90 leading-relaxed mb-10 text-center max-w-lg drop-shadow-sm px-4">
            "Quiero compartir este momento tan especial con las personas que más amo."<br>Sube tus fotos aquí.
        </p>

        <button id="openModalBtn" class="bg-vino-tinto text-white font-bold font-body py-4 px-10 rounded-sm uppercase tracking-[0.2em] text-[10px] shadow-lg hover:bg-transparent hover:text-vino-tinto transition-all active:scale-95 border border-vino-tinto duration-300 mb-12">
            Subir mis fotos 
        </button>

        <div class="w-full pt-16 border-t border-white/10 flex flex-col items-center corte-pico bg-[#0A0A0A] px-2 pb-10">
            <p class="font-body text-[9px] text-white/50 uppercase tracking-[0.3em] mb-4 font-bold mt-12 drop-shadow-sm">Vista de Galería</p>
            <div class="bg-black/50 backdrop-blur-md border border-white/10 rounded-sm p-1 flex inline-flex shadow-sm mb-10">
                <button id="btn1Col" class="font-body px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-white bg-vino-tinto rounded-sm transition-all">1 Columna</button>
                <button id="btn2Col" class="font-body px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-white/70 hover:bg-white/10 rounded-sm transition-all">2 Columnas</button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-3 gap-6 w-full px-2 max-w-6xl">
            </div>
        </div>
        
    </div>

    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="relative bg-section-dark border border-vino-tinto/40 rounded-xl w-full max-w-md p-8 shadow-2xl flex flex-col items-center max-h-[90vh] overflow-y-auto overflow-x-hidden hide-scrollbar">

            <button id="closeModalBtnIcon" class="absolute top-5 right-5 text-white/40 hover:text-vino-tinto transition-colors z-20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-6xl font-script text-vino-tinto mb-8 mt-4 text-center relative z-10 text-shadow-dark">Tus Momentos</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-6 text-left relative z-10 px-2">
                <div>
                    <label class="font-body text-white/80 text-[9px] font-bold tracking-[0.2em] uppercase mb-1.5 block opacity-90">Tu Nombre</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia López" class="input-danna py-2 w-full text-center tracking-wider">
                </div>
                
                <div>
                    <label class="font-body text-white/80 text-[9px] font-bold tracking-[0.2em] uppercase mb-1.5 block opacity-90">Momento de la fiesta</label>
                    <select id="folderSelect" class="input-danna py-2 w-full cursor-pointer appearance-none text-center tracking-widest text-lg">
                        <option value="" disabled selected class="italic text-white/30">Elige una opción...</option>
                        <option value="La Fiesta">La Fiesta</option>
                        <option value="Baile">El Baile</option>
                        <option value="Con la Festejada">Con Danna Paola</option>
                    </select>
                </div>
                
                <div class="mt-4">
                    <label class="font-body text-white/80 text-[9px] font-bold tracking-[0.2em] uppercase mb-2 block opacity-90">Seleccionar archivos</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-vino-tinto/50 bg-black/40 rounded-xl p-8 text-center transition-colors hover:bg-white/5 cursor-pointer shadow-inner overflow-hidden">
                        
                        <div id="processingOverlay" class="hidden">
                            <svg class="animate-spin h-8 w-8 text-vino-tinto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p class="font-body text-white/80 text-[8px] font-bold uppercase tracking-widest text-center px-2">Procesando archivos...<br>No cierres esta ventana</p>
                        </div>

                        <input type="file" id="archivoInput" accept="image/jpeg, image/png, video/mp4, video/mov, image/heic, image/heif" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-vino-tinto/80 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="font-body text-white/80 text-[10px] font-bold uppercase tracking-widest">Toca aquí para elegir</p>
                        <p class="font-body text-vino-tinto/60 text-[8px] font-bold uppercase tracking-widest mt-2">(Videos máximo 30s)</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-white/10 rounded-xl bg-black/60 shadow-sm overflow-hidden">
                        <p class="font-body text-[8px] text-white/60 text-center py-3 uppercase font-bold border-b border-white/10 tracking-[0.2em]">Archivos seleccionados:</p>
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="font-body w-full py-3 text-[9px] text-red-400 bg-red-900/20 uppercase font-bold hover:bg-red-900/40 transition-colors tracking-widest border-t border-red-900/30">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-6">
                    <button id="btnCancelar" class="font-body flex-1 bg-transparent border border-white/20 text-white/80 font-bold rounded-sm py-3.5 text-[9px] tracking-[0.2em] uppercase hover:bg-white/5 transition-colors shadow-sm">Cancelar</button>
                    <button id="btnSubir" class="font-body flex-[1.5] bg-vino-tinto text-white border border-vino-tinto font-bold rounded-sm py-3.5 text-[9px] tracking-[0.2em] uppercase shadow-lg hover:-translate-y-1 transition-transform">Subir Álbum</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="font-body text-[10px] uppercase tracking-widest font-bold mt-6 text-white bg-vino-tinto/40 p-4 rounded-sm border border-vino-tinto/50 hidden text-center w-full relative z-10 shadow-sm"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // CREDENCIALES (Asegúrate de colocar las correspondientes al proyecto de Danna Paola en Firebase)
               const firebaseConfig = {
          apiKey: "AIzaSyBjSXaM2DctOkOJrya1tHYMJoW6etg_p-w",
          authDomain: "cumple-pao.firebaseapp.com",
          projectId: "cumple-pao",
          storageBucket: "cumple-pao.firebasestorage.app",
          messagingSenderId: "579253721998",
          appId: "1:579253721998:web:6d49c161237d5c2220a2df"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");
        const processingOverlay = document.getElementById('processingOverlay');

        // Función auxiliar para medir duración de video
        function getVideoDuration(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.onloadedmetadata = () => {
                    window.URL.revokeObjectURL(video.src);
                    resolve(video.duration);
                };
                video.src = URL.createObjectURL(file);
            });
        }

        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

        // LÓGICA UNIVERSAL: DataTransfer + HEIC Conversion + 30s Video Limit
        archivoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            processingOverlay.classList.remove('hidden');
            previewContainer.innerHTML = "";
            
            const archivosProcesados = new DataTransfer();

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                const fileName = file.name.toLowerCase();

                // 1. REGLA DE VIDEO (Máx 30s)
                if (file.type.includes("video")) {
                    const duration = await getVideoDuration(file);
                    if (duration > 30) {
                        alert(`El video "${file.name}" dura más de 30 segundos y no será subido.`);
                        continue; 
                    }
                }

                // 2. PAUSA ANTI-CONGELAMIENTO (150ms)
                await new Promise(resolve => setTimeout(resolve, 150));

                // 3. DETECCIÓN Y CONVERSIÓN DE HEIC / HEIF
                if (fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic') {
                    try {
                        const conversionPromise = heic2any({
                            blob: file,
                            toType: "image/jpeg",
                            quality: 0.5 
                        });

                        const timeoutPromise = new Promise((_, reject) => 
                            setTimeout(() => reject(new Error("Tiempo agotado")), 15000)
                        );

                        const convertedBlob = await Promise.race([conversionPromise, timeoutPromise]);
                        const finalBlob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                        
                        file = new File([finalBlob], file.name.replace(/\.heic|\.heif/i, ".jpg"), {
                            type: "image/jpeg"
                        });
                    } catch (err) {
                        console.warn(`Error al convertir ${file.name}:`, err);
                        continue; 
                    }
                }

                // 4. AGREGAR A LA LISTA LIMPIA
                archivosProcesados.items.add(file);
                
                // 5. CREAR MINIATURA PARA UI
                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-black/50 rounded overflow-hidden shadow-sm border border-white/20";
                
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/60"><svg class="w-6 h-6 text-white/80" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            }

            // ACTUALIZAR EL INPUT ORIGINAL
            archivoInput.files = archivosProcesados.files;
            
            processingOverlay.classList.add('hidden');

            if (archivoInput.files.length > 0) {
                dropZone.classList.add('hidden');
                previsualizacion.classList.remove('hidden');
            } else {
                archivoInput.value = ""; 
                dropZone.classList.remove('hidden');
                previsualizacion.classList.add('hidden');
            }
        });

        document.getElementById('removePreviewBtn').addEventListener('click', () => {
            archivoInput.value = "";
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) return alert("Por favor, completa todos los campos para continuar.");

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, '20_danna/' + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_danna"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "¡Recuerdos guardados con éxito!";
            setTimeout(() => location.reload(), 1500);
        });

        // Alternar vistas
        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "font-body px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-white bg-vino-tinto rounded-sm transition-all";
            btn2Col.className = "font-body px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-white/70 hover:bg-white/10 rounded-sm transition-all";
            muro.className = "columns-1 md:columns-2 gap-6 w-full px-2 max-w-4xl";
        });
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "font-body px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-white bg-vino-tinto rounded-sm transition-all";
            btn1Col.className = "font-body px-6 py-2.5 text-[9px] font-bold uppercase tracking-[0.2em] text-white/70 hover:bg-white/10 rounded-sm transition-all";
            muro.className = "columns-2 md:columns-3 gap-6 w-full px-1 max-w-6xl";
        });

        // Dibujar Muro
        let isFirstLoad = true;
        const q = query(collection(db, "muro_danna"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="text-white/50 font-light text-lg col-span-full py-12 text-center break-inside-avoid italic">Aún no hay recuerdos. ¡Sé el primero en subir un momento!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto rounded-t-lg bg-black cursor-pointer object-cover border-b border-vino-tinto/20"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto rounded-t-lg object-cover border-b border-vino-tinto/20">`;
                    
                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "break-inside-avoid mb-8 bg-[#0A0A0A] border border-white/10 rounded-lg shadow-2xl flex flex-col group hover:-translate-y-1 transition-transform duration-300";
                    
                    divTarjeta.innerHTML = `
                        <div class="relative">
                            <span class="absolute top-3 right-3 bg-vino-tinto text-white text-[8px] font-bold px-3 py-1.5 rounded-sm shadow-md uppercase tracking-widest z-10 opacity-90">${datos.momento}</span>
                            ${media}
                        </div>
                        <div class="flex items-center justify-between p-4 rounded-b-lg">
                            <h4 class="text-white/90 font-serif text-lg tracking-wide truncate flex-1 capitalize">${datos.nombre}</h4>
                            <div class="flex items-center gap-2">
                                <button onclick="darLike('${id}')" class="flex items-center gap-1.5 text-white/40 hover:text-vino-tinto transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span id="contador-likes-${id}" class="font-bold font-body text-xs num-likes text-white/80">${datos.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) {
                        contadorLikes.innerText = datos.likes;
                    }
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) {
                        tarjetaRemover.remove();
                    }
                }
            });

            isFirstLoad = false;
        });

        window.darLike = async function(id) {
            const docRef = doc(db, "muro_danna", id);
            await updateDoc(docRef, { likes: increment(1) });
        };

        window.activarVideo = function(id) {
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
