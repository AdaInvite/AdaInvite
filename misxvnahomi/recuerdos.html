<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV Nahomi Alexa - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    
    <meta name="theme-color" content="#E6A8B8">
    <meta property="og:title" content="XV Nahomi Alexa - Recuerdos">
    <meta property="og:description" content="Sube tus fotos y videos favoritos de la fiesta.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosa: {
                            pastel: '#E6A8B8'
                        },
                        blanco: {
                            perla: '#F0EFEA'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --rosa-pastel: #E6A8B8;
            --blanco-perla: #F0EFEA;
            --font-elegant: 'Lora', serif;
            --font-script: 'Great Vibes', cursive;
            --font-numbers: 'Cinzel', serif; 
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100svh;
            font-family: var(--font-elegant); 
            background-color: var(--blanco-perla);
            color: #2C2A2A;
            scroll-behavior: smooth;
        }
        
        h1, p, select, button, label, input { font-family: var(--font-elegant); }
        .font-script { font-family: var(--font-script) !important; font-weight: 400; }
        .font-numbers { font-family: var(--font-numbers) !important; }

        .seccion-rosa {
            position: relative; 
            overflow: hidden; 
            z-index: 1; 
            color: var(--blanco-perla);
            width: 100%;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(230, 168, 184, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .seccion-rosa::before {
            content: "";
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px; 
            z-index: -1; 
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://i.imgur.com/MmXulZL.gif');
            background-size: cover;
            background-position: center;
            filter: blur(5px); 
        }

        @media (min-width: 768px) {
            .seccion-rosa {
                border-radius: 60px;
            }
        }

        .filtro-blanco {
            filter: invert(100%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(100%);
        }
        .filtro-rosa {
            filter: invert(75%) sepia(21%) saturate(666%) hue-rotate(298deg) brightness(96%) contrast(92%);
        }

        .text-shadow-light { 
            text-shadow: 0px 2px 10px rgba(230, 168, 184, 0.6); 
        }

        select option { background-color: #ffffff; color: #2C2A2A; }
        select { text-align-last: center; } 
        
        .input-nahomi {
            background-color: #ffffff; 
            border: 1px solid #d1d5db; color: #2C2A2A;
            border-radius: 8px; font-size: 14px;
            transition: all 0.3s ease;
        }
        .input-nahomi:focus { border-color: var(--rosa-pastel); outline: none; box-shadow: 0 0 0 3px rgba(230, 168, 184, 0.2); }
        .input-nahomi::placeholder { color: rgba(44, 42, 42, 0.5); font-style: italic; }

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4 md:p-10">

    <div class="seccion-rosa max-w-5xl w-full min-h-[90svh] flex flex-col items-center pt-16 pb-12 px-6" id="mainContainer">
        
        <img src="https://i.imgur.com/yOsSYnN.png" class="w-24 md:w-32 mb-6 drop-shadow-sm filtro-blanco" alt="Corona">
        
        <h1 class="text-7xl md:text-9xl font-script text-white mb-2 text-center text-shadow-light">Recuerdos</h1>
        <p class="text-[11px] tracking-[0.4em] uppercase text-white font-bold mb-8 text-center drop-shadow-sm">Mis XV Nahomi Alexa</p>

        <p class="text-sm md:text-lg italic text-white/90 leading-relaxed mb-10 font-medium px-4 text-center max-w-lg">
            Comparte tus fotos y videos favoritos de esta noche inolvidable con nosotros.
        </p>

        <button id="openModalBtn" class="bg-white text-rosa-pastel font-bold py-4 px-10 rounded-md uppercase tracking-[0.2em] text-[11px] shadow-lg hover:-translate-y-1 transition-all active:scale-95 border border-white">
            Subir recuerdos 
        </button>

        <div class="w-full pt-16 mt-6 border-t border-white/20 flex flex-col items-center">
            <p class="text-[10px] text-white/80 uppercase tracking-widest mb-4 font-bold">Vista de Galería</p>
            <div class="bg-black/20 backdrop-blur-sm border border-white/20 rounded-md p-1 flex inline-flex shadow-sm mb-10">
                <button id="btn1Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-rosa-pastel bg-white rounded transition-all">1 Columna</button>
                <button id="btn2Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/10 rounded transition-all">2 Columnas</button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-3 gap-6 w-full px-2">
            </div>
        </div>
        
    </div>

    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
        <div class="relative bg-blanco-perla border border-gray-200 rounded-[30px] w-full max-w-md p-8 shadow-2xl flex flex-col items-center max-h-[90vh] overflow-y-auto">
            
            <div class="absolute top-0 left-0 right-0 mx-auto w-full z-0 opacity-40 pointer-events-none">
                <img src="https://i.imgur.com/MTE3z9r.png" class="w-full h-auto filtro-rosa" alt="decoración">
            </div>

            <button id="closeModalBtnIcon" class="absolute top-5 right-5 text-rosa-pastel hover:text-rosa-pastel/70 transition-colors z-20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-6xl font-script text-rosa-pastel mb-8 mt-6 text-center text-shadow-light relative z-10">Tus Momentos</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-5 text-left relative z-10">
                <div>
                    <label class="text-[#2C2A2A] text-[10px] font-bold tracking-widest uppercase mb-2 block">Tu nombre *</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Familia González" class="input-nahomi px-4 py-3.5 w-full text-center font-bold">
                </div>
                
                <div>
                    <label class="text-[#2C2A2A] text-[10px] font-bold tracking-widest uppercase mb-2 block">Momento del evento *</label>
                    <select id="folderSelect" class="input-nahomi px-4 py-3.5 w-full cursor-pointer appearance-none text-center font-bold tracking-wider text-[11px]">
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="Ceremonia">La Ceremonia</option>
                        <option value="Recepción">Cóctel de Bienvenida</option>
                        <option value="Banquete">El Banquete</option>
                        <option value="Vals y Brindis">Vals y Brindis</option>
                        <option value="Baile">El Baile / DJ</option>
                        <option value="Banda">Música en Vivo / Banda</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-[#2C2A2A] text-[10px] font-bold tracking-widest uppercase mb-2 block">Seleccionar archivos *</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-rosa-pastel/50 bg-white rounded-xl p-8 text-center transition-colors hover:bg-gray-50">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-rosa-pastel mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-[#2C2A2A] text-[11px] font-bold uppercase tracking-widest">Elige fotos o videos</p>
                        <p class="text-[#2C2A2A]/50 text-[9px] font-bold uppercase tracking-widest mt-2">(Videos máximo 30s)</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-gray-200 rounded-xl bg-white shadow-sm">
                        <p class="text-[9px] text-[#2C2A2A] text-center py-3 uppercase font-bold border-b border-gray-100 tracking-widest">Archivos seleccionados:</p>
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="w-full py-3 text-[10px] text-red-500 uppercase font-bold hover:bg-red-50 transition-colors rounded-b-xl tracking-widest">Limpiar selección</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-6">
                    <button id="btnCancelar" class="flex-1 bg-white border border-gray-300 text-[#2C2A2A] font-bold rounded-md py-4 text-[10px] tracking-widest uppercase hover:bg-gray-50 transition-colors">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-rosa-pastel text-white border border-rosa-pastel font-bold rounded-md py-4 text-[10px] tracking-widest uppercase shadow-md hover:-translate-y-1 transition-transform">Subir al Álbum</button>
                </div>
            </div>
            
            <p id="estadoCarga" class="text-[11px] uppercase tracking-widest font-bold mt-6 text-rosa-pastel bg-rosa-pastel/10 p-4 rounded-md border border-rosa-pastel/20 hidden text-center w-full relative z-10"></p>

            <div class="absolute bottom-0 left-0 right-0 mx-auto w-full z-0 opacity-40 pointer-events-none rotate-180">
                <img src="https://i.imgur.com/MTE3z9r.png" class="w-full h-auto filtro-rosa" alt="decoración">
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // NOTA: Recuerda cambiar las credenciales para apuntar al proyecto de Nahomi Alexa en Firebase.
             const firebaseConfig = {
              apiKey: "AIzaSyDcBPRfHI-8ix-b_abzh--ojsRwj54YSjg",
              authDomain: "xv-nahomi.firebaseapp.com",
              projectId: "xv-nahomi",
              storageBucket: "xv-nahomi.firebasestorage.app",
              messagingSenderId: "884040315412",
              appId: "1:884040315412:web:68b2d01b01ec0c4b092d01"
            };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');
        const btnSubir = document.getElementById("btnSubir");

        // Array para guardar únicamente los archivos que pasan la validación de 30s
        let archivosConfirmados = [];

        // Función auxiliar para medir duración de video
        function getVideoDuration(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.onloadedmetadata = () => {
                    window.URL.revokeObjectURL(video.src);
                    resolve(video.duration);
                };
                video.src = URL.createObjectURL(file);
            });
        }

        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

        // Validación al seleccionar archivos (Límite 30s)
        archivoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            previewContainer.innerHTML = "";
            let validFiles = [];

            for (const file of files) {
                // Si es video, comprobamos duración
                if (file.type.includes("video")) {
                    const duration = await getVideoDuration(file);
                    if (duration > 30) {
                        alert(`El video "${file.name}" dura más de 30 segundos y no será subido.`);
                        continue; // Salta este archivo
                    }
                }
                validFiles.push(file);
                
                // Crear preview
                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-gray-200 rounded-md overflow-hidden shadow-sm border border-gray-300";
                if (file.type.includes("image")) {
                    thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                } else {
                    thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/40"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                }
                previewContainer.appendChild(thumb);
            }

            archivosConfirmados = validFiles;

            if (validFiles.length > 0) {
                dropZone.classList.add('hidden');
                previsualizacion.classList.remove('hidden');
            } else {
                archivoInput.value = ""; 
            }
        });

        document.getElementById('removePreviewBtn').addEventListener('click', () => {
            archivoInput.value = "";
            archivosConfirmados = []; 
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        btnSubir.addEventListener("click", async () => {
            const archivos = archivosConfirmados; 
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;

            if (archivos.length === 0 || !nombre || !momento) return alert("Por favor, completa todos los campos para continuar.");

            btnSubir.disabled = true;
            estadoCarga.classList.remove('hidden');

            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const total = archivos.length;
                
                await new Promise((resolve, reject) => {
                    const storageRef = ref(storage, 'xv_nahomi/' + Date.now() + "_" + file.name);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                        },
                        (error) => { reject(error); },
                        async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_nahomi"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }

            estadoCarga.innerText = "¡Recuerdos guardados con éxito!";
            setTimeout(() => location.reload(), 1500);
        });

        // Alternar vistas
        const btn1Col = document.getElementById('btn1Col');
        const btn2Col = document.getElementById('btn2Col');
        const muro = document.getElementById('muro');

        btn1Col.addEventListener('click', () => {
            btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-rosa-pastel bg-white rounded transition-all";
            btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/10 rounded transition-all";
            muro.className = "columns-1 md:columns-2 gap-6 w-full px-2";
        });
        btn2Col.addEventListener('click', () => {
            btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-rosa-pastel bg-white rounded transition-all";
            btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/10 rounded transition-all";
            muro.className = "columns-2 md:columns-3 gap-4 w-full px-1";
        });

        // Dibujar Muro
        let isFirstLoad = true;
        const q = query(collection(db, "muro_nahomi"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty && muro.innerHTML.trim() === "") {
                muro.innerHTML = `<div id="emptyMessage" class="text-white/80 italic text-sm col-span-full py-8 text-center break-inside-avoid">Aún no hay recuerdos. ¡Sé el primero en subir algo!</div>`;
                return;
            }

            const emptyMessage = document.getElementById('emptyMessage');
            if (emptyMessage) emptyMessage.remove();

            snapshot.docChanges().forEach((change) => {
                const datos = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const media = datos.tipo === "video" 
                        ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto rounded-t-xl bg-white/10 cursor-pointer object-cover border-b border-white/20"></video>` 
                        : `<img src="${datos.url_multimedia}" class="w-full h-auto rounded-t-xl object-cover border-b border-white/20">`;
                    
                    const divTarjeta = document.createElement('div');
                    divTarjeta.id = `tarjeta-${id}`;
                    divTarjeta.className = "break-inside-avoid mb-8 relative group flex flex-col bg-white/10 backdrop-blur-md rounded-xl shadow-lg border border-white/20 transition-transform duration-300 hover:-translate-y-1";
                    
                    divTarjeta.innerHTML = `
                        <span class="absolute top-3 right-3 bg-white text-rosa-pastel text-[9px] font-bold px-3 py-1.5 rounded uppercase z-10 shadow-md tracking-widest">${datos.momento}</span>
                        ${media}
                        <div class="flex items-center justify-between p-4 rounded-b-xl bg-black/20">
                            <h4 class="text-white font-bold uppercase text-[11px] tracking-[0.2em] truncate flex-1">${datos.nombre}</h4>
                            <div class="flex items-center gap-3">
                                <button onclick="darLike('${id}')" class="flex items-center gap-1.5 text-white/80 hover:text-white transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span id="contador-likes-${id}" class="font-bold text-sm font-numbers num-likes">${datos.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    if (isFirstLoad) {
                        muro.appendChild(divTarjeta);
                    } else {
                        muro.insertBefore(divTarjeta, muro.firstChild);
                    }
                }

                if (change.type === "modified") {
                    const contadorLikes = document.getElementById(`contador-likes-${id}`);
                    if (contadorLikes) {
                        contadorLikes.innerText = datos.likes;
                    }
                }

                if (change.type === "removed") {
                    const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                    if (tarjetaRemover) {
                        tarjetaRemover.remove();
                    }
                }
            });

            isFirstLoad = false;
        });

        window.darLike = async function(id) {
            const docRef = doc(db, "muro_nahomi", id);
            await updateDoc(docRef, { likes: increment(1) });
        };

        window.activarVideo = function(id) {
            const videoElement = document.getElementById(`vid-${id}`);
            if (videoElement) {
                videoElement.muted = false;
                videoElement.controls = true;
                videoElement.classList.remove('cursor-pointer');
            }
        };
    </script>
</body>
</html>
