<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#XVFatima - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/NwSJuPz.jpeg">
    
    <meta name="theme-color" content="#FCF9F9">
    <meta property="og:title" content="#XVFatima - Recuerdos">
    <meta property="og:description" content="Sube tus fotos y videos favoritos de la fiesta.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosa: {
                            elegante: '#BA8797' 
                        },
                        plata: {
                            elegante: '#C0C0C0' 
                        },
                        blanco: {
                            perla: '#FCF9F9'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&family=Pinyon+Script&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Librería para convertir HEIC a JPG -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            --rosa-elegante: #BA8797;
            --blanco-perla: #FCF9F9;
            --font-elegant: 'Forum', serif;
            --font-script: 'Pinyon Script', cursive;
            --font-numbers: 'Forum', sans-serif; 
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--blanco-perla); 
            font-family: var(--font-elegant);
            color: var(--rosa-elegante);
            display: flex; justify-content: center; 
            overflow-x: hidden;
            text-transform: uppercase;
        }

        h1, h2, h3, p, select, button, label, input { font-family: var(--font-elegant); font-weight: 400; text-transform: uppercase; }
        .font-bold { font-weight: 700; }
        .font-script { font-family: var(--font-script) !important; font-weight: 400; text-transform: none !important; }
        .font-numbers { font-family: var(--font-numbers) !important; font-weight: 400; }
        .font-sans-text { font-family: 'Montserrat', sans-serif !important; text-transform: none !important; }

        .mobile-container {
            width: 100%;
            max-width: 500px; 
            min-height: 100svh;
            background-color: var(--blanco-perla); 
            position: relative;
            overflow-x: hidden; overflow-y: auto;
            box-shadow: 0 0 40px rgba(0,0,0,0.1); 
            scroll-behavior: smooth;
        }

        /* TEXTURA DE FONDO SUTIL */
        .bg-texture-main {
            background-image: url('https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/%C3%8Dtems%20boda%20negro/Textura%20sobre.png');
            background-size: 400px;
            opacity: 0.15;
            position: absolute;
            inset: 0;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* MARCO Y DECORACIONES FIJAS */
        .marco-decorativo {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            z-index: 40;
            pointer-events: none;
            background-image: 
                url('https://i.imgur.com/xLlHmWn.png'),     /* Arriba Izquierda */
                url('https://i.imgur.com/TjMfNnt.png'),     /* Abajo Derecha */
                url('https://i.imgur.com/Gk4NWpp.png'),     /* Arriba Derecha */
                url('https://i.imgur.com/mg7xo3j.png');     /* Abajo Izquierda */
            background-position: 
                top left, 
                bottom right, 
                top right, 
                bottom left;
            background-repeat: no-repeat;
            background-size: 130px auto; /* Ajustado para móvil */
        }

        .text-shadow-light { text-shadow: 0px 2px 10px rgba(186, 135, 151, 0.4); }

        select option { background-color: var(--blanco-perla); color: #2C2A2A; font-family: var(--font-elegant); }
        select { text-align-last: center; } 
        
        .input-fatima {
            background-color: #ffffff; 
            border: 1px solid rgba(186, 135, 151, 0.4);
            color: #2C2A2A;
            border-radius: 12px; 
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .input-fatima:focus { border-color: var(--rosa-elegante); outline: none; background-color: #ffffff; box-shadow: 0 4px 12px rgba(186, 135, 151, 0.15); }
        .input-fatima::placeholder { color: rgba(44, 42, 42, 0.4); font-weight: 400; }

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }
        
        /* Pantalla de carga para procesamiento HEIC/Video */
        #processingOverlay {
            position: absolute; inset: 0;
            background: rgba(252, 249, 249, 0.9); backdrop-filter: blur(2px);
            z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 1rem; transition: opacity 0.3s;
        }
        #processingOverlay.hidden { opacity: 0; pointer-events: none; display: none; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estilo para Notificaciones Toast (Reemplazo de alert) */
        #toastMessage {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast-visible {
            opacity: 1 !important;
            transform: translate(-50%, 0) !important;
            pointer-events: auto !important;
        }
    </style>
</head>
<body>

    <!-- Contenedor Toast para Alertas Elegantes -->
    <div id="toastMessage" class="fixed top-8 left-1/2 transform -translate-x-1/2 -translate-y-16 opacity-0 pointer-events-none px-6 py-3 rounded-full shadow-2xl z-[9999] text-xs font-bold tracking-widest text-center min-w-[280px]">
        Mensaje aquí
    </div>

    <!-- MARCO GLOBAL Y DECORACIONES FLORALES (Fijo en pantalla) -->
    <div class="fixed top-4 bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-[468px] border border-rosa-elegante/80 rounded-2xl md:rounded-3xl z-30 pointer-events-none"></div>
    <div class="marco-decorativo"></div>

    <div class="mobile-container relative">
        <div class="bg-texture-main"></div>

        <div class="min-h-[100svh] flex flex-col items-center pt-24 pb-16 px-6 relative z-20" id="mainContainer">
            
            <h1 class="text-6xl md:text-7xl font-script text-rosa-elegante mb-2 text-center text-shadow-light leading-none">#XVFatima</h1>
            <p class="text-base uppercase text-[#2C2A2A] font-bold mb-4 text-center drop-shadow-sm">Muro de Recuerdos</p>

            <p class="text-xs text-[#2C2A2A] leading-relaxed mb-4 text-center max-w-sm font-bold px-4">
                Hay momentos inolvidables que se atesoran para siempre en el corazón. Comparte tus fotos y videos conmigo.
            </p>

            <button id="openModalBtn" class="bg-rosa-elegante text-white font-bold py-4 px-10 rounded-2xl uppercase tracking-[0.2em] text-[11px] shadow-lg border border-rosa-elegante hover:bg-transparent hover:text-rosa-elegante transition-all active:scale-95 duration-300">
                Subir mis fotos 
            </button>

            <div class="w-full pt-6 mt-6 flex flex-col items-center border-t border-rosa-elegante/20 relative z-20">
                <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-4 font-bold drop-shadow-sm bg-blanco-perla px-2">Vista de Galería</p>
                <div class="bg-white/90 backdrop-blur-sm border border-rosa-elegante/20 rounded-xl p-1 flex inline-flex shadow-sm mb-10">
                    <button id="btn1Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-[0.2em] text-white bg-rosa-elegante rounded-lg transition-all">1 Columna</button>
                    <button id="btn2Col" class="px-6 py-2.5 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-600 hover:bg-gray-100 rounded-lg transition-all">2 Columnas</button>
                </div>
                
                <div id="muro" class="columns-1 md:columns-2 gap-6 w-full px-2 pb-10">
                </div>
            </div>
            
        </div>

        <!-- MODAL DE SUBIDA -->
        <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden absolute h-full w-full">
            <div class="relative bg-white/95 border border-rosa-elegante/30 rounded-3xl w-full max-w-md p-8 shadow-2xl flex flex-col items-center max-h-[90vh] overflow-y-auto overflow-x-hidden hide-scrollbar">
                
                <button id="closeModalBtnIcon" class="absolute top-4 right-4 text-gray-400 hover:text-rosa-elegante transition-colors z-20 bg-gray-50 rounded-full p-2 shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>

                <h2 class="text-4xl font-script text-rosa-elegante mb-4 mt-4 text-center relative z-10 text-shadow-light">Tus Momentos</h2>

                <div id="uploadForm" class="w-full flex flex-col gap-6 text-left relative z-10 px-2">
                    <div>
                        <label class="text-[#2C2A2A] text-[10px] font-bold tracking-[0.2em] uppercase mb-1.5 block opacity-90">Familia / Nombre</label>
                        <input type="text" id="nombreInput" placeholder="Ej: Familia López" class="input-fatima py-3 px-4 w-full text-center uppercase tracking-wider font-medium">
                    </div>
                    
                    <div>
                        <label class="text-[#2C2A2A] text-[10px] font-bold tracking-[0.2em] uppercase mb-1.5 block opacity-90">Momento del evento</label>
                        <select id="folderSelect" class="input-fatima py-3 px-4 w-full cursor-pointer appearance-none text-center uppercase tracking-widest text-[11px] font-medium">
                            <option value="" disabled selected class="font-sans-text italic text-gray-400">Elige una opción...</option>
                            <option value="Misa">La Misa</option>
                            <option value="Con Fatima">Con la quinceañera</option>
                            <option value="Recepción">La Recepción</option>
                            <option value="Fiesta y Baile">Fiesta y Batucada</option>
                        </select>
                    </div>
                    
                    <div class="mt-2">
                        <label class="text-[#2C2A2A] text-[10px] font-bold tracking-[0.2em] uppercase mb-2 block opacity-90">Seleccionar archivos</label>
                        <div id="dropZone" class="relative border-2 border-dashed border-rosa-elegante/50 bg-[#FCF9F9]/80 rounded-2xl p-8 text-center transition-colors hover:bg-white cursor-pointer shadow-sm overflow-hidden">
                            
                            <!-- OVERLAY DE PROCESAMIENTO (HEIC + Video) -->
                            <div id="processingOverlay" class="hidden">
                                <svg class="animate-spin h-8 w-8 text-rosa-elegante mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <p class="text-rosa-elegante text-[9px] font-bold uppercase tracking-widest text-center px-2">Procesando archivos...<br>No cierres esta ventana</p>
                            </div>

                            <!-- INPUT OPTIMIZADO PARA MÓVILES -->
                            <input type="file" id="archivoInput" accept="image/jpeg, image/png, video/mp4, video/mov, image/heic, image/heif" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            <svg class="w-8 h-8 mx-auto text-rosa-elegante mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <p class="text-[#2C2A2A] text-[11px] font-bold uppercase tracking-widest">Toca aquí para elegir</p>
                            <p class="text-gray-400 text-[9px] font-bold uppercase tracking-widest mt-2">(Videos máximo 30s)</p>
                        </div>

                        <div id="previsualizacion" class="w-full relative hidden mt-4 border border-rosa-elegante/20 rounded-2xl bg-white shadow-sm overflow-hidden">
                            <p class="text-[9px] text-[#2C2A2A] text-center py-3 uppercase font-bold border-b border-gray-100 tracking-[0.2em]">Archivos seleccionados:</p>
                            <div id="previewContainer"></div>
                            <button id="removePreviewBtn" class="w-full py-3 text-[10px] text-red-500 bg-red-50 uppercase font-bold hover:bg-red-100 transition-colors tracking-widest border-t border-red-100 font-sans-text">Limpiar selección</button>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-4">
                        <button id="btnCancelar" class="flex-1 bg-gray-100 text-gray-600 font-bold rounded-xl py-3.5 text-[10px] tracking-[0.2em] uppercase hover:bg-gray-200 transition-colors shadow-sm">Cancelar</button>
                        <button id="btnSubir" class="flex-[1.5] bg-rosa-elegante text-white font-bold rounded-xl py-3.5 text-[10px] tracking-[0.2em] uppercase shadow-md hover:bg-opacity-90 transition-transform">Subir Álbum</button>
                    </div>
                </div>
                
                <p id="estadoCarga" class="text-[11px] uppercase tracking-widest font-bold mt-6 text-white bg-rosa-elegante p-4 rounded-xl border border-rosa-elegante/30 hidden text-center w-full relative z-10 shadow-md"></p>
            </div>
        </div>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
            import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

            // CREDENCIALES DE FATIMA SOFIA
            const firebaseConfig = {
                apiKey: "AIzaSyD20VBRnajwjwwS9fhM2x-j-KoBAdoj9wo",
                authDomain: "invitaciones-xv-e28d5.firebaseapp.com",
                projectId: "invitaciones-xv-e28d5",
                storageBucket: "invitaciones-xv-e28d5.firebasestorage.app",
                messagingSenderId: "531033690105",
                appId: "1:531033690105:web:2fd2350b2b5fe02a8d7728"
            };

            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const storage = getStorage(app);

            // GESTIÓN DE LIKES (LocalStorage)
            let likedPosts = JSON.parse(localStorage.getItem('liked_posts_fatima')) || [];

            // SISTEMA DE ALERTAS (TOAST)
            window.showToast = function(msg, isError = true) {
                const toast = document.getElementById('toastMessage');
                toast.innerText = msg;
                if(isError) {
                    toast.classList.add('bg-red-500', 'text-white');
                    toast.classList.remove('bg-rosa-elegante', 'text-white');
                } else {
                    toast.classList.remove('bg-red-500', 'text-white');
                    toast.classList.add('bg-rosa-elegante', 'text-white');
                }
                toast.classList.add('toast-visible');
                
                setTimeout(() => {
                    toast.classList.remove('toast-visible');
                }, 3500);
            };

            const modal = document.getElementById('uploadModal');
            const openBtn = document.getElementById('openModalBtn');
            const archivoInput = document.getElementById('archivoInput');
            const previewContainer = document.getElementById('previewContainer');
            const previsualizacion = document.getElementById('previsualizacion');
            const dropZone = document.getElementById('dropZone');
            const estadoCarga = document.getElementById('estadoCarga');
            const btnSubir = document.getElementById("btnSubir");
            const processingOverlay = document.getElementById('processingOverlay');

            // Función auxiliar para medir duración de video
            function getVideoDuration(file) {
                return new Promise((resolve) => {
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    video.onloadedmetadata = () => {
                        window.URL.revokeObjectURL(video.src);
                        resolve(video.duration);
                    };
                    video.src = URL.createObjectURL(file);
                });
            }

            openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
            document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
            document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

            // LÓGICA UNIVERSAL: DataTransfer + HEIC Conversion + 30s Video Limit
            archivoInput.addEventListener('change', async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                processingOverlay.classList.remove('hidden');
                previewContainer.innerHTML = "";
                
                const archivosProcesados = new DataTransfer();

                for (let i = 0; i < files.length; i++) {
                    let file = files[i];
                    const fileName = file.name.toLowerCase();

                    // 1. REGLA DE VIDEO (Máx 30s)
                    if (file.type.includes("video")) {
                        const duration = await getVideoDuration(file);
                        if (duration > 30) {
                            window.showToast(`El video "${file.name}" dura más de 30s y no se subirá.`, true);
                            continue; 
                        }
                    }

                    // 2. PAUSA ANTI-CONGELAMIENTO (150ms)
                    await new Promise(resolve => setTimeout(resolve, 150));

                    // 3. DETECCIÓN Y CONVERSIÓN DE HEIC / HEIF
                    if (fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic') {
                        try {
                            const conversionPromise = heic2any({
                                blob: file,
                                toType: "image/jpeg",
                                quality: 0.5 
                            });

                            const timeoutPromise = new Promise((_, reject) => 
                                setTimeout(() => reject(new Error("Tiempo agotado")), 15000)
                            );

                            const convertedBlob = await Promise.race([conversionPromise, timeoutPromise]);
                            const finalBlob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                            
                            file = new File([finalBlob], file.name.replace(/\.heic|\.heif/i, ".jpg"), {
                                type: "image/jpeg"
                            });
                        } catch (err) {
                            console.warn(`Error al convertir ${file.name}:`, err);
                            continue; // Si falla, lo ignoramos
                        }
                    }

                    // 4. AGREGAR A LA LISTA LIMPIA
                    archivosProcesados.items.add(file);
                    
                    // 5. CREAR MINIATURA PARA UI
                    const url = URL.createObjectURL(file);
                    const thumb = document.createElement('div');
                    thumb.className = "relative h-20 bg-gray-100 rounded-xl overflow-hidden shadow-sm border border-gray-200";
                    
                    if (file.type.includes("image")) {
                        thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                    } else {
                        thumb.innerHTML = `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center bg-black/40"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg></div>`;
                    }
                    previewContainer.appendChild(thumb);
                }

                // ACTUALIZAR EL INPUT ORIGINAL
                archivoInput.files = archivosProcesados.files;
                
                processingOverlay.classList.add('hidden');

                if (archivoInput.files.length > 0) {
                    dropZone.classList.add('hidden');
                    previsualizacion.classList.remove('hidden');
                } else {
                    archivoInput.value = ""; 
                    dropZone.classList.remove('hidden');
                    previsualizacion.classList.add('hidden');
                }
            });

            document.getElementById('removePreviewBtn').addEventListener('click', () => {
                archivoInput.value = "";
                previsualizacion.classList.add('hidden');
                dropZone.classList.remove('hidden');
            });

            btnSubir.addEventListener("click", async () => {
                const archivos = Array.from(archivoInput.files);
                const nombre = document.getElementById("nombreInput").value;
                const momento = document.getElementById("folderSelect").value;

                if (archivos.length === 0 || !nombre || !momento) {
                    window.showToast("Por favor, completa todos los campos para continuar.", true);
                    return;
                }

                btnSubir.disabled = true;
                estadoCarga.classList.remove('hidden');

                for (let i = 0; i < archivos.length; i++) {
                    const file = archivos[i];
                    const total = archivos.length;
                    
                    await new Promise((resolve, reject) => {
                        // CARPETA ESPECÍFICA FATIMA
                        const storageRef = ref(storage, 'xv_fatima/' + Date.now() + "_" + file.name);
                        const uploadTask = uploadBytesResumable(storageRef, file);

                        uploadTask.on('state_changed', 
                            (snapshot) => {
                                const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                                btnSubir.innerText = `[${i+1}/${total}] ${progress}%`;
                            },
                            (error) => { reject(error); },
                            async () => {
                                const url = await getDownloadURL(uploadTask.snapshot.ref);
                                // COLECCIÓN ESPECÍFICA FATIMA
                                await addDoc(collection(db, "muro_xvfatima"), {
                                    nombre, momento, url_multimedia: url, likes: 0,
                                    tipo: file.type.includes("video") ? "video" : "imagen",
                                    fecha: new Date()
                                });
                                resolve();
                            }
                        );
                    });
                }

                estadoCarga.innerText = "¡Recuerdos guardados con éxito!";
                setTimeout(() => location.reload(), 1500);
            });

            // Alternar vistas
            const btn1Col = document.getElementById('btn1Col');
            const btn2Col = document.getElementById('btn2Col');
            const muro = document.getElementById('muro');

            btn1Col.addEventListener('click', () => {
                btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-[0.2em] text-white bg-rosa-elegante rounded-lg transition-all";
                btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-600 hover:bg-gray-100 rounded-lg transition-all";
                muro.className = "columns-1 gap-6 w-full px-2";
            });
            btn2Col.addEventListener('click', () => {
                btn2Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-[0.2em] text-white bg-rosa-elegante rounded-lg transition-all";
                btn1Col.className = "px-6 py-2.5 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-600 hover:bg-gray-100 rounded-lg transition-all";
                muro.className = "columns-2 gap-4 w-full px-1";
            });

            // Dibujar Muro
            let isFirstLoad = true;
            // CONSULTA A COLECCIÓN FATIMA
            const q = query(collection(db, "muro_xvfatima"), orderBy("fecha", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty && muro.innerHTML.trim() === "") {
                    muro.innerHTML = `<div id="emptyMessage" class="text-gray-500 font-bold text-sm col-span-full py-6 text-center break-inside-avoid drop-shadow-sm font-medium">Aún no hay recuerdos. <br>¡Sé el primero en subir un momento!</div>`;
                    return;
                }

                const emptyMessage = document.getElementById('emptyMessage');
                if (emptyMessage) emptyMessage.remove();

                snapshot.docChanges().forEach((change) => {
                    const datos = change.doc.data();
                    const id = change.doc.id;

                    if (change.type === "added") {
                        const media = datos.tipo === "video" 
                            ? `<video id="vid-${id}" src="${datos.url_multimedia}" autoplay muted loop playsinline onclick="activarVideo('${id}')" class="w-full h-auto bg-black/5 cursor-pointer object-cover"></video>` 
                            : `<img src="${datos.url_multimedia}" class="w-full h-auto object-cover">`;
                        
                        // Verificar si el usuario ya dio like previamente
                        const userLiked = likedPosts.includes(id);
                        const heartColorClass = userLiked ? 'text-rosa-elegante fill-current' : 'text-gray-400';

                        const divTarjeta = document.createElement('div');
                        divTarjeta.id = `tarjeta-${id}`;
                        divTarjeta.className = "break-inside-avoid mb-6 bg-white border border-rosa-elegante/20 rounded-2xl shadow-md flex flex-col group hover:-translate-y-1 transition-transform duration-300 overflow-hidden relative z-20";
                        
                        divTarjeta.innerHTML = `
                            <div class="relative">
                                <span class="absolute top-3 right-3 bg-rosa-elegante text-white text-[8px] font-bold px-3 py-1.5 rounded-full shadow-md uppercase tracking-widest z-10 opacity-95">${datos.momento}</span>
                                ${media}
                            </div>
                            <div class="flex items-center justify-between p-4 bg-white border-t border-gray-100">
                                <h4 class="text-[#2C2A2A] font-bold uppercase text-[11px] tracking-[0.2em] truncate flex-1">${datos.nombre}</h4>
                                <div class="flex items-center gap-2">
                                    <button onclick="darLike('${id}')" class="flex items-center gap-1.5 transition-colors focus:outline-none hover:scale-110 active:scale-95 duration-200">
                                        <svg id="heart-icon-${id}" class="w-5 h-5 ${heartColorClass} transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                        <span id="contador-likes-${id}" class="font-bold text-sm font-numbers text-rosa-elegante">${datos.likes}</span>
                                    </button>
                                </div>
                            </div>
                        `;

                        if (isFirstLoad) {
                            muro.appendChild(divTarjeta);
                        } else {
                            muro.insertBefore(divTarjeta, muro.firstChild);
                        }
                    }

                    if (change.type === "modified") {
                        const contadorLikes = document.getElementById(`contador-likes-${id}`);
                        if (contadorLikes) {
                            contadorLikes.innerText = datos.likes;
                        }
                    }

                    if (change.type === "removed") {
                        const tarjetaRemover = document.getElementById(`tarjeta-${id}`);
                        if (tarjetaRemover) {
                            tarjetaRemover.remove();
                        }
                    }
                });

                isFirstLoad = false;
            });

            window.darLike = async function(id) {
                // VERIFICAR LÍMITE DE UN LIKE POR PERSONA MEDIANTE LOCALSTORAGE
                if (likedPosts.includes(id)) {
                    window.showToast("¡Ya le diste me gusta a este recuerdo!", false);
                    return;
                }

                // Actualización Visual Inmediata (Optimistic UI)
                const heartIcon = document.getElementById(`heart-icon-${id}`);
                const contadorText = document.getElementById(`contador-likes-${id}`);
                
                if (heartIcon) {
                    heartIcon.classList.remove('text-gray-400', 'fill-none');
                    heartIcon.classList.add('text-rosa-elegante', 'fill-current');
                }
                
                if (contadorText) {
                    let currentLikes = parseInt(contadorText.innerText) || 0;
                    contadorText.innerText = currentLikes + 1;
                }

                // Guardar en LocalStorage para no permitir más likes de este usuario a esta foto
                likedPosts.push(id);
                localStorage.setItem('liked_posts_fatima', JSON.stringify(likedPosts));

                // ACTUALIZAR LIKES EN DB DE FATIMA
                try {
                    const docRef = doc(db, "muro_xvfatima", id);
                    await updateDoc(docRef, { likes: increment(1) });
                } catch (error) {
                    console.error("Error al dar like:", error);
                    window.showToast("Hubo un problema de conexión al dar like.", true);
                }
            };

            window.activarVideo = function(id) {
                const videoElement = document.getElementById(`vid-${id}`);
                if (videoElement) {
                    videoElement.muted = false;
                    videoElement.controls = true;
                    videoElement.classList.remove('cursor-pointer');
                }
            };
        </script>
    </div> <!-- FIN DEL CONTENEDOR MÓVIL -->
</body>
</html>
