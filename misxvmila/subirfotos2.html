<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV Mila - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/OONuNTG.png">
    
    <meta name="theme-color" content="#D4AF37">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dorado: { elegante: '#D4AF37' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100%;
            font-family: 'Cinzel', serif; color: #D4AF37;
            scroll-behavior: smooth;
        }
        .font-script { font-family: 'Great Vibes', cursive; }
        .bg-floral-section {
            background-image: url('https://i.imgur.com/VBju3Lm.jpeg');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        
        .input-ada {
            background-color: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            border: 1px solid rgba(212, 175, 55, 0.5); color: white;
            border-radius: 8px; font-family: sans-serif; font-size: 14px;
        }
        .input-ada:focus { border-color: #D4AF37; outline: none; background-color: rgba(0,0,0,0.7); }
        .input-ada::placeholder { color: rgba(255, 255, 255, 0.4); }
        select option { background-color: rgba(0,0,0,0.9); color: #D4AF37; }

        #uploadModal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; pointer-events: none; }
    </style>
</head>
<body class="bg-floral-section relative min-h-screen overflow-x-hidden p-4 pb-20">

    <div class="fixed inset-4 md:inset-8 border border-dorado-elegante z-0 pointer-events-none rounded-2xl opacity-50"></div>
    <img src="https://i.imgur.com/TjUVH3M.png" class="fixed top-[-10px] left-[-10px] w-32 md:w-48 z-10 pointer-events-none drop-shadow-md" alt="Rosa">
    <img src="https://i.imgur.com/TjUVH3M.png" class="fixed top-[-10px] right-[-10px] w-32 md:w-48 z-10 pointer-events-none drop-shadow-md transform scale-x-[-1]" alt="Rosa">

    <div class="relative z-20 text-center max-w-5xl w-full mx-auto flex flex-col items-center pt-12">
        
        <div id="mainHeader" class="flex flex-col items-center mb-10">
            <h1 class="text-6xl md:text-7xl font-script text-dorado-elegante drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] mb-2">Muro de recuerdos</h1>
            <p class="text-[16px] md:text-[18px] tracking-[0.5em] uppercase text-white font-bold drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] mb-10">XV MILA</p>
            
            <p class="text-sm italic text-white leading-relaxed mb-6 font-medium drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] px-4 max-w-md">
                Comparte tus momentos favoritos de la fiesta con nosotros.
            </p>

            <button id="openModalBtn" class="bg-dorado-elegante text-black font-bold rounded-full px-10 py-4 shadow-[0_5px_20px_rgba(212,175,55,0.5)] text-[12px] tracking-[3px] uppercase flex items-center justify-center gap-3 hover:scale-105 transition-transform active:scale-95 mt-4">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5 5 5 0 0 0 5 5 5 5 0 0 0 5-5 5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3Z"/></svg>
                Subir Foto o Video
            </button>
        </div>

        <div class="w-full mt-6 pt-10 border-t border-dorado-elegante/20">
            <div id="muro" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full px-2">
                <div class="text-white text-sm opacity-70 col-span-full font-sans">Cargando recuerdos...</div>
            </div>
        </div>
    </div>

    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="relative bg-[#0d0d0d] border border-dorado-elegante/50 rounded-2xl w-full max-w-md p-6 shadow-[0_10px_50px_rgba(212,175,55,0.2)] flex flex-col items-center">
            
            <button id="closeModalBtnIcon" class="absolute top-4 right-4 text-dorado-elegante opacity-70 hover:opacity-100 transition-opacity">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-3xl font-script text-dorado-elegante mb-6 mt-2">Sube tu momento</h2>

            <div id="uploadForm" class="w-full flex flex-col gap-5 text-left font-sans">
                
                <div>
                    <label class="text-dorado-elegante text-[11px] font-bold tracking-widest uppercase mb-1.5 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
                        Tu nombre *
                    </label>
                    <input type="text" id="nombreInput" placeholder="Ej: Ana María" class="input-ada px-4 py-3 w-full">
                    <p class="text-white/40 text-[10px] mt-1 ml-1">Tu nombre aparecerá en la foto del álbum</p>
                </div>
                
                <div>
                    <label class="text-dorado-elegante text-[11px] font-bold tracking-widest uppercase mb-1.5 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path></svg>
                        Momento del evento *
                    </label>
                    <select id="folderSelect" class="input-ada px-4 py-3 w-full cursor-pointer appearance-none">
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="En la iglesia">En la iglesia</option>
                        <option value="En la recepción">En la recepción</option>
                        <option value="Cena">Cena</option>
                        <option value="El Vals">El Vals</option>
                        <option value="El baile">El baile</option>
                        <option value="El pastel">El pastel</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-dorado-elegante text-[11px] font-bold tracking-widest uppercase mb-1.5 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"></path></svg>
                        Seleccionar archivo *
                    </label>
                    
                    <div id="dropZone" class="relative border-2 border-dashed border-dorado-elegante/50 bg-black/30 rounded-xl p-6 text-center hover:bg-dorado-elegante/10 transition-colors cursor-pointer mt-1">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-10 h-10 mx-auto text-dorado-elegante mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-white text-sm font-bold">Haz clic o arrastra tu archivo aquí</p>
                        <p class="text-dorado-elegante/70 text-[10px] mt-2 uppercase tracking-wide">JPG, PNG, GIF, MP4 - Máx. 30s</p>
                    </div>

                    <div id="previsualizacion" class="w-full relative hidden mt-2">
                        <button id="removePreviewBtn" class="absolute top-2 right-2 bg-red-600 border border-white text-white rounded-full p-1 z-40 hover:bg-red-700 active:scale-95 shadow-md">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                        <div id="previewContainer" class="border border-dorado-elegante/50 rounded-xl overflow-hidden bg-black h-40 flex items-center justify-center relative">
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 mt-4">
                    <button id="btnCancelar" class="flex-1 bg-white/10 text-white font-bold rounded-lg py-3.5 text-[11px] tracking-[2px] uppercase hover:bg-white/20 transition-colors">
                        Cancelar
                    </button>
                    <button id="btnSubir" class="flex-[1.5] bg-dorado-elegante text-black font-bold rounded-lg py-3.5 shadow-lg text-[11px] tracking-[2px] uppercase hover:bg-yellow-500 transition-colors disabled:opacity-50 flex justify-center items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Subir al Álbum
                    </button>
                </div>
            </div>

            <p id="estadoCarga" class="text-[11px] uppercase tracking-widest font-bold mt-4 text-white bg-black p-3 rounded-md border border-dorado-elegante hidden text-center w-full font-sans"></p>
        </div>
    </div>

    <img src="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png" class="fixed bottom-4 right-4 w-16 opacity-40 z-10 pointer-events-none" alt="AdaInvite">

    <script type="module">
        // IMPORTAMOS 'uploadBytesResumable' PARA VER EL PORCENTAJE EN VIVO
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // TUS LLAVES (XV-MILA-FINAL)
        const firebaseConfig = {
            apiKey: "AIzaSyD2YvEdaxuUV9UkdeNfkFFGoZ0K539eA_c",
            authDomain: "xv-mila-final.firebaseapp.com",
            projectId: "xv-mila-final",
            storageBucket: "xv-mila-final.firebasestorage.app",
            messagingSenderId: "165068896780",
            appId: "1:165068896780:web:59c4d6e7ea08f399a30c29"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtnIcon = document.getElementById('closeModalBtnIcon');
        const btnCancelar = document.getElementById('btnCancelar');
        
        const archivoInput = document.getElementById('archivoInput');
        const dropZone = document.getElementById('dropZone');
        const previsualizacion = document.getElementById('previsualizacion');
        const previewContainer = document.getElementById('previewContainer');
        const removePreviewBtn = document.getElementById('removePreviewBtn');
        const estadoCarga = document.getElementById('estadoCarga');

        function limpiarFormulario() {
            document.getElementById("nombreInput").value = "";
            document.getElementById("folderSelect").value = "";
            limpiarVistaPrevia(true);
        }

        function limpiarVistaPrevia(borrarInputReal = true) {
            if (borrarInputReal) archivoInput.value = ""; 
            previewContainer.innerHTML = ""; 
            previsualizacion.classList.add('hidden'); 
            dropZone.classList.remove('hidden'); 
            estadoCarga.classList.add('hidden');
        }

        function openModal() {
            limpiarFormulario(); 
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto'; 
            limpiarVistaPrevia(true); 
        }

        openBtn.addEventListener('click', openModal);
        closeBtnIcon.addEventListener('click', closeModal);
        btnCancelar.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        function procesarArchivoParaVistaPrevia(archivo) {
            dropZone.classList.add('hidden'); 
            previsualizacion.classList.remove('hidden'); 
            const objectUrl = URL.createObjectURL(archivo);
            if (archivo.type.includes("image")) {
                previewContainer.innerHTML = `<img src="${objectUrl}" class="w-full h-full object-contain" alt="Vista previa">`;
            } else if (archivo.type.includes("video")) {
                previewContainer.innerHTML = `<video src="${objectUrl}" muted loop controls class="w-full h-full object-contain"></video>`;
            }
        }

        archivoInput.addEventListener('change', (e) => {
            const archivo = e.target.files[0];
            limpiarVistaPrevia(false); 

            if (!archivo) { limpiarVistaPrevia(true); return; }

            if (archivo.type.startsWith("video/")) {
                const videoElement = document.createElement('video');
                videoElement.preload = 'metadata';
                videoElement.onloadedmetadata = function() {
                    window.URL.revokeObjectURL(videoElement.src);
                    if (videoElement.duration > 31) {
                        alert("¡Ups! 🎬 El video dura más de 30 segundos. Por favor elige uno más corto.");
                        limpiarVistaPrevia(true); 
                        return;
                    } else { procesarArchivoParaVistaPrevia(archivo); }
                }
                videoElement.src = URL.createObjectURL(archivo);
            } else { procesarArchivoParaVistaPrevia(archivo); }
        });

        removePreviewBtn.addEventListener('click', () => limpiarVistaPrevia(true));

        // --- SUBIDA A FIREBASE CON PORCENTAJE EN VIVO ---
        document.getElementById("btnSubir").addEventListener("click", async () => {
            const archivo = archivoInput.files[0]; 
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;
            const btn = document.getElementById("btnSubir");

            if (!archivo || !nombre || !momento) {
                alert("Por favor llena tu nombre, elige qué momento fue y selecciona un archivo.");
                return;
            }

            // Desactivamos botones mientras sube
            btn.disabled = true;
            btnCancelar.disabled = true;
            btn.innerText = "Iniciando...";
            estadoCarga.innerText = "Preparando tu recuerdo...";
            estadoCarga.classList.remove('hidden');

            try {
                const nombreArchivoSeguro = Date.now() + "_" + archivo.name.replace(/[^a-z0-9.]/gi, '_').toLowerCase();
                const storageRef = ref(storage, 'xv_mila/' + nombreArchivoSeguro);
                
                // Usamos la función Resumable para leer el progreso
                const uploadTask = uploadBytesResumable(storageRef, archivo);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        // Aquí calculamos el progreso del 0 al 100%
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        btn.innerText = `Subiendo... ${Math.round(progress)}%`;
                    }, 
                    (error) => {
                        // Si falla (Ej. falta de reglas de seguridad) nos avisa aquí
                        console.error("Error de subida:", error);
                        alert("Error al subir: " + error.message + "\n\n(Asegúrate de haber configurado las Reglas de Storage en 'if true')");
                        btn.disabled = false;
                        btnCancelar.disabled = false;
                        btn.innerHTML = `Intentar de nuevo`;
                        estadoCarga.classList.add('hidden');
                    }, 
                    async () => {
                        // Cuando llega al 100%
                        btn.innerText = "Guardando...";
                        estadoCarga.innerText = "Generando tarjeta...";
                        
                        const urlDescarga = await getDownloadURL(uploadTask.snapshot.ref);

                        await addDoc(collection(db, "muro_mila"), {
                            nombre: nombre,
                            momento: momento,
                            url_multimedia: urlDescarga,
                            likes: 0,
                            tipo: archivo.type.includes("video") ? "video" : "imagen",
                            fecha: new Date()
                        });

                        estadoCarga.innerText = "¡Súper! Se subió al muro.";
                        
                        setTimeout(() => {
                            closeModal();
                            btn.disabled = false;
                            btnCancelar.disabled = false;
                            btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> Subir al Álbum`;
                        }, 1500);
                    }
                );
                
            } catch (error) {
                console.error(error);
                alert("Ocurrió un error inesperado.");
                btn.disabled = false;
                btnCancelar.disabled = false;
                btn.innerHTML = `Intentar de nuevo`;
            }
        });

        // --- MURO ---
        const q = query(collection(db, "muro_mila"), orderBy("fecha", "desc"));
        onSnapshot(q, (snapshot) => {
            const muro = document.getElementById("muro");
            muro.innerHTML = ""; 

            if (snapshot.empty) {
                muro.innerHTML = `<div class="text-white text-sm opacity-60 col-span-full pt-10 font-sans">Aún no hay recuerdos. ¡Sé el primero en subir uno!</div>`;
                return;
            }

            snapshot.forEach((documento) => {
                const datos = documento.data();
                const id = documento.id;

                let mediaHTML = datos.tipo === "video" 
                    ? `<video src="${datos.url_multimedia}" controls class="w-full h-72 object-cover rounded-xl mb-4 border-2 border-dorado-elegante/30 shadow-inner"></video>`
                    : `<img src="${datos.url_multimedia}" class="w-full h-72 object-cover rounded-xl mb-4 border-2 border-dorado-elegante/30 shadow-lg" alt="Recuerdo">`;

                let tarjeta = `
                <div class="bg-black/70 backdrop-blur-sm border border-dorado-elegante rounded-2xl p-5 text-left shadow-2xl relative transform transition-all hover:border-white/50 group">
                    <span class="absolute top-3 right-3 bg-dorado-elegante text-black text-[9px] font-bold px-3 py-1.5 rounded-full uppercase tracking-wider z-10 shadow-md">${datos.momento}</span>
                    ${mediaHTML}
                    <div class="flex items-center justify-between gap-2 pt-1">
                        <h4 class="text-white font-bold tracking-widest uppercase text-xs truncate drop-shadow-md font-sans">${datos.nombre}</h4>
                        <button onclick="darLike('${id}')" class="flex items-center gap-2 text-dorado-elegante hover:text-white transition-colors p-1 active:scale-125 transition-transform">
                            <svg class="w-7 h-7 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <span class="font-bold text-xl num-likes drop-shadow-md font-sans">${datos.likes}</span>
                        </button>
                    </div>
                </div>`;
                muro.innerHTML += tarjeta;
            });
        });

        window.darLike = async function(idDocumento) {
            const docRef = doc(db, "muro_mila", idDocumento);
            try {
                const btn = event.currentTarget;
                const span = btn.querySelector('.num-likes');
                span.innerText = parseInt(span.innerText) + 1;
                btn.classList.add('text-white');
                await updateDoc(docRef, { likes: increment(1) });
            } catch(e) { console.error("Error en like", e); }
        };
    </script>
</body>
</html>
