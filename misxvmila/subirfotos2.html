<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV Mila - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/OONuNTG.png">
    
    <meta name="theme-color" content="#D4AF37">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dorado: { elegante: '#D4AF37' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        /* FONDO FIJO SIN ESTIRAMIENTO CORREGIDO */
        body, html {
            margin: 0; padding: 0; width: 100%; 
            min-height: 100svh;
            font-family: 'Cinzel', serif; 
            color: #D4AF37;
            background-color: transparent; 
        }

        .background-fijo {
    position: fixed;
    /* Le damos margen extra arriba y abajo para que la barra de Safari no lo recorte */
    top: -10vh; left: 0;
    width: 100%; 
    height: 120vh; 
    background-image: url('https://i.imgur.com/VBju3Lm.jpeg');
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    background-color: black;
    z-index: -1;
}

        .font-script { font-family: 'Great Vibes', cursive; }
        
        .contenedor-principal {
            position: relative;
            min-height: 100svh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .marco-estirable {
            position: absolute;
            inset: 15px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            pointer-events: none;
            z-index: 5;
            height: calc(100% - 30px); 
        }

        .input-ada {
            background-color: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.5); color: white;
            border-radius: 8px; font-family: sans-serif; font-size: 14px;
        }
        #uploadModal { transition: opacity 0.3s ease; }
        #uploadModal.hidden { opacity: 0; visibility: hidden; display: flex !important; }
        
        #previewContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; padding: 10px;
        }
    </style>
</head>
<body>

    <div class="background-fijo"></div>

    <div class="contenedor-principal p-4 pb-20">
        <div class="marco-estirable"></div>

        <img src="https://i.imgur.com/TjUVH3M.png" class="absolute top-0 left-0 w-32 md:w-48 z-10 pointer-events-none" alt="Rosa">
        <img src="https://i.imgur.com/TjUVH3M.png" class="absolute top-0 right-0 w-32 md:w-48 z-10 pointer-events-none transform scale-x-[-1]" alt="Rosa">

        <img src="https://i.imgur.com/TjUVH3M.png" class="absolute bottom-0 left-0 w-32 md:w-48 z-10 pointer-events-none transform scale-y-[-1]" alt="Rosa">
        <img src="https://i.imgur.com/TjUVH3M.png" class="absolute bottom-0 right-0 w-32 md:w-48 z-10 pointer-events-none transform scale-x-[-1] scale-y-[-1]" alt="Rosa">

        <div class="relative z-20 text-center max-w-5xl w-full mx-auto pt-12 flex flex-col items-center">
            
            <div id="mainHeader" class="flex flex-col items-center mb-8">
                <h1 class="text-6xl md:text-5xl font-script text-dorado-elegante drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] mb-2">Recuerdos</h1>
                <p class="text-[16px] md:text-[18px] tracking-[0.5em] uppercase text-white font-bold drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] mb-8">XV MILA</p>
                
                <p class="text-sm italic text-white leading-relaxed mb-4 font-medium drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] px-4 max-w-md text-center font-sans">
                    Comparte tus momentos favoritos de la fiesta con nosotros.
                </p>

                <button id="openModalBtn" class="bg-dorado-elegante text-black font-bold rounded-full px-10 py-4 shadow-[0_5px_20px_rgba(212,175,55,0.5)] text-[10px] tracking-[3px] uppercase flex items-center justify-center gap-3 hover:scale-105 transition-transform active:scale-95 mt-2">
                    Subir Momentos
                </button>
            </div>

            <div class="w-full mt-6 pt-6 border-t border-dorado-elegante/20 flex flex-col items-center">
                <p class="text-[10px] text-dorado-elegante uppercase tracking-widest mb-3 font-bold">Vista de Galería</p>
                <div class="bg-black/40 backdrop-blur-sm border border-dorado-elegante/40 rounded-lg p-1 flex inline-flex shadow-lg mb-6">
                    <button id="btn1Col" class="px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-black bg-dorado-elegante rounded-md transition-all">1 Columna</button>
                    <button id="btn2Col" class="px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-dorado-elegante hover:bg-white/10 rounded-md transition-all">2 Columnas</button>
                </div>
                
                <div id="muro" class="columns-1 md:columns-2 lg:columns-3 gap-6 w-full px-2">
                    </div>
            </div>
        </div>
    </div>

    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="relative bg-[#0d0d0d] border border-dorado-elegante/50 rounded-2xl w-full max-w-md p-6 shadow-[0_10px_50px_rgba(212,175,55,0.2)] flex flex-col items-center max-h-[90vh] overflow-y-auto">
            <button id="closeModalBtnIcon" class="absolute top-4 right-4 text-dorado-elegante opacity-70">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-3xl font-script text-dorado-elegante mb-6 mt-2 text-center">Sube tus momentos</h2>
            <div id="uploadForm" class="w-full flex flex-col gap-5 text-left font-sans">
                <div>
                    <label class="text-dorado-elegante text-[11px] font-bold tracking-widest uppercase mb-1.5 block">Tu nombre *</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Ana María" class="input-ada px-4 py-3 w-full">
                </div>
                <div>
                    <label class="text-dorado-elegante text-[11px] font-bold tracking-widest uppercase mb-1.5 block">Momento del evento *</label>
                    <select id="folderSelect" class="input-ada px-4 py-3 w-full cursor-pointer appearance-none">
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="En la iglesia">En la iglesia</option>
                        <option value="En la recepción">En la recepción</option>
                        <option value="Cena">Cena</option>
                        <option value="El Vals">El Vals</option>
                        <option value="El baile">El baile</option>
                        <option value="El pastel">El pastel</option>
                    </select>
                </div>
                <div>
                    <label class="text-dorado-elegante text-[11px] font-bold tracking-widest uppercase mb-1.5 block">Archivos *</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-dorado-elegante/50 bg-black/30 rounded-xl p-6 text-center cursor-pointer">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-8 h-8 mx-auto text-dorado-elegante mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-white text-xs font-bold uppercase tracking-widest">Toca para elegir fotos o videos</p>
                    </div>
                    <div id="previsualizacion" class="w-full relative hidden mt-4 border border-dorado-elegante/20 rounded-xl bg-black/50">
                        <div id="previewContainer"></div>
                        <button id="removePreviewBtn" class="w-full py-2 text-[9px] text-red-500 uppercase font-bold hover:bg-red-500/10">Limpiar selección</button>
                    </div>
                </div>
                <div class="flex gap-3 mt-2">
                    <button id="btnCancelar" class="flex-1 bg-white/10 text-white font-bold rounded-lg py-3.5 text-[10px] tracking-widest uppercase">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-dorado-elegante text-black font-bold rounded-lg py-3.5 text-[10px] tracking-widest uppercase shadow-lg">Subir al Álbum</button>
                </div>
            </div>
            <p id="estadoCarga" class="text-[10px] uppercase tracking-widest font-bold mt-4 text-white bg-black p-3 rounded-md border border-dorado-elegante hidden text-center w-full"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD2YvEdaxuUV9UkdeNfkFFGoZ0K539eA_c",
            authDomain: "xv-mila-final.firebaseapp.com",
            projectId: "xv-mila-final",
            storageBucket: "xv-mila-final.firebasestorage.app",
            messagingSenderId: "165068896780",
            appId: "1:165068896780:web:59c4d6e7ea08f399a30c29"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const archivoInput = document.getElementById('archivoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previsualizacion = document.getElementById('previsualizacion');
        const dropZone = document.getElementById('dropZone');
        const btnSubir = document.getElementById("btnSubir");

        document.getElementById('openModalBtn').addEventListener('click', () => { modal.classList.remove('hidden'); });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); });

        // VISTAS DE COLUMNAS (Aquí están de vuelta)
        document.getElementById('btn1Col').addEventListener('click', () => {
            document.getElementById('muro').className = "columns-1 md:columns-2 lg:columns-3 gap-6 w-full px-2";
            document.getElementById('btn1Col').className = "px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-black bg-dorado-elegante rounded-md transition-all";
            document.getElementById('btn2Col').className = "px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-dorado-elegante hover:bg-white/10 rounded-md transition-all";
        });

        document.getElementById('btn2Col').addEventListener('click', () => {
            document.getElementById('muro').className = "columns-2 md:columns-3 lg:columns-4 gap-3 w-full px-1";
            document.getElementById('btn2Col').className = "px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-black bg-dorado-elegante rounded-md transition-all";
            document.getElementById('btn1Col').className = "px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-dorado-elegante hover:bg-white/10 rounded-md transition-all";
        });

        archivoInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            dropZone.classList.add('hidden');
            previsualizacion.classList.remove('hidden');
            previewContainer.innerHTML = "";
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                const thumb = document.createElement('div');
                thumb.className = "relative h-20 bg-black rounded-lg overflow-hidden border border-white/10";
                thumb.innerHTML = file.type.includes("image") 
                    ? `<img src="${url}" class="w-full h-full object-cover">`
                    : `<video src="${url}" autoplay muted loop class="w-full h-full object-cover"></video>`;
                previewContainer.appendChild(thumb);
            });
        });

        document.getElementById('removePreviewBtn').addEventListener('click', () => {
            archivoInput.value = "";
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        btnSubir.addEventListener("click", async () => {
            const archivos = Array.from(archivoInput.files);
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;
            if (archivos.length === 0 || !nombre || !momento) return alert("Completa todos los campos");

            btnSubir.disabled = true;
            for (let i = 0; i < archivos.length; i++) {
                const file = archivos[i];
                const storageRef = ref(storage, 'xv_mila/' + Date.now() + "_" + file.name);
                const uploadTask = uploadBytesResumable(storageRef, file);
                await new Promise((resolve) => {
                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const p = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                            btnSubir.innerText = `Subiendo ${i+1}/${archivos.length}: ${p}%`;
                        }, null, async () => {
                            const url = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "muro_mila"), {
                                nombre, momento, url_multimedia: url, likes: 0,
                                tipo: file.type.includes("video") ? "video" : "imagen",
                                fecha: new Date()
                            });
                            resolve();
                        }
                    );
                });
            }
            location.reload();
        });

        const q = query(collection(db, "muro_mila"), orderBy("fecha", "desc"));
        onSnapshot(q, (snapshot) => {
            const muro = document.getElementById('muro');
            
            // LÓGICA DE MURO VACÍO
            if (snapshot.empty) {
                muro.innerHTML = `
                    <div class="col-span-full py-20 text-center flex flex-col items-center">
                        <p class="text-dorado-elegante font-script text-3xl mb-3">Aún no hay recuerdos</p>
                        <p class="text-white/60 text-[10px] uppercase tracking-[4px] font-sans">¡Sé el primero en compartir un momento!</p>
                    </div>`;
                return;
            }

            let hayCambioEstructural = false;
            snapshot.docChanges().forEach(change => {
                if (change.type === "added" || change.type === "removed") hayCambioEstructural = true;
                if (change.type === "modified") {
                    const span = document.getElementById(`likes-${change.doc.id}`);
                    if (span) span.innerText = change.doc.data().likes;
                }
            });

            if (hayCambioEstructural) {
                muro.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const d = docSnap.data();
                    const id = docSnap.id;
                    const media = d.tipo === "video" 
                        ? `<video src="${d.url_multimedia}" autoplay muted loop playsinline class="w-full h-auto cursor-pointer" onclick="this.muted = !this.muted; this.controls = !this.controls;"></video>` 
                        : `<img src="${d.url_multimedia}" class="w-full h-auto">`;
                    
                    muro.innerHTML += `
<div class="break-inside-avoid inline-block w-full mb-6 bg-white rounded-xl shadow-2xl overflow-hidden relative group transform transition-all hover:scale-[1.01]"> <span class="absolute top-2 right-2 bg-white text-dorado-elegante text-[8px] font-bold px-2 py-1 rounded shadow-md z-10 uppercase tracking-wider">${d.momento}</span>
    ${media}
    
    <div class="bg-dorado-elegante px-3 py-3 flex items-center justify-between"> <h4 class="text-white font-bold uppercase text-[9px] truncate flex-1 tracking-wider drop-shadow">${d.nombre}</h4>
        
        <button onclick="darLike('${id}')" class="flex items-center gap-1.5 text-white active:scale-125 transition-transform cursor-pointer pl-2">
            <svg class="w-5 h-5 fill-current drop-shadow" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span id="likes-${id}" class="text-sm font-bold drop-shadow transition-all duration-200">${d.likes}</span>
        </button>
    </div>
</div>`;
                });
            }
        });

        window.darLike = async (id) => {
            await updateDoc(doc(db, "muro_mila", id), { likes: increment(1) });
        };
    </script>
</body>
</html>
