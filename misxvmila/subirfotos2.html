<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV Mila - Muro de Recuerdos</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/OONuNTG.png">
    
    <meta name="theme-color" content="#D4AF37">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dorado: { elegante: '#D4AF37' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
    /* 1. Ajuste del fondo para que no se mueva */
    body, html {
        margin: 0; padding: 0; width: 100%; 
        min-height: 100svh; /* Altura mínima de la pantalla */
        font-family: 'Cinzel', serif; color: #D4AF37;
        scroll-behavior: smooth;
        /* Esto deja el fondo quieto mientras scrolleas */
        background-image: url('https://i.imgur.com/VBju3Lm.jpeg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed; 
        background-repeat: no-repeat;
    }

    /* 2. El contenedor relativo es clave para que el marco sepa hasta dónde estirarse */
    .contenedor-principal {
        position: relative;
        min-height: 100svh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 3. El marco ahora es absoluto y sigue al contenido */
    .marco-estirable {
        position: absolute;
        inset: 15px; /* Margen del marco */
        border: 1px solid rgba(212, 175, 55, 0.5);
        border-radius: 20px;
        pointer-events: none;
        z-index: 5;
        /* Importante: esto hace que el marco cubra TODO el largo del contenido */
        height: calc(100% - 30px); 
    }
</style>

<body class="relative">
    <div class="contenedor-principal p-4 pb-20">
        
        <div class="marco-estirable"></div>

        <img src="https://i.imgur.com/TjUVH3M.png" class="absolute top-0 left-0 w-32 md:w-48 z-10 pointer-events-none" alt="Rosa">
        <img src="https://i.imgur.com/TjUVH3M.png" class="absolute top-0 right-0 w-32 md:w-48 z-10 pointer-events-none transform scale-x-[-1]" alt="Rosa">

        <div class="relative z-20 text-center max-w-5xl w-full mx-auto pt-12">
             </div>

    </div>
</body>
        
        <div id="mainHeader" class="flex flex-col items-center mb-8">
            <h1 class="text-6xl md:text-5xl font-script text-dorado-elegante drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] mb-2">Recuerdos</h1>
            <p class="text-[16px] md:text-[18px] tracking-[0.5em] uppercase text-white font-bold drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] mb-8">XV MILA</p>
            
            <p class="text-sm italic text-white leading-relaxed mb-4 font-medium drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] px-4 max-w-md">
                Comparte tus momentos favoritos de la fiesta con nosotros.
            </p>

            <button id="openModalBtn" class="bg-dorado-elegante text-black font-bold rounded-full px-10 py-4 shadow-[0_5px_20px_rgba(212,175,55,0.5)] text-[12px] tracking-[3px] uppercase flex items-center justify-center gap-3 hover:scale-105 transition-transform active:scale-95 mt-2">
                Subir Foto o Video
            </button>
        </div>

        <div class="w-full mt-6 pt-6 border-t border-dorado-elegante/20 flex flex-col items-center">
            <p class="text-[10px] text-dorado-elegante uppercase tracking-widest mb-3 font-bold">Vista de Galería</p>
            <div class="bg-black/40 backdrop-blur-sm border border-dorado-elegante/40 rounded-lg p-1 flex inline-flex shadow-lg mb-6">
                <button id="btn1Col" class="px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-black bg-dorado-elegante rounded-md transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    1 Columna
                </button>
                <button id="btn2Col" class="px-5 py-2 text-[10px] font-bold uppercase tracking-wider text-dorado-elegante hover:bg-white/10 rounded-md transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    2 Columnas
                </button>
            </div>
            
            <div id="muro" class="columns-1 md:columns-2 lg:columns-3 gap-6 w-full px-2">
                <div class="text-white text-sm opacity-70 col-span-full font-sans py-4">Cargando recuerdos...</div>
            </div>
        </div>
    </div>

    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="relative bg-[#0d0d0d] border border-dorado-elegante/50 rounded-2xl w-full max-w-md p-6 shadow-[0_10px_50px_rgba(212,175,55,0.2)] flex flex-col items-center max-h-[90vh] overflow-y-auto">
            <button id="closeModalBtnIcon" class="absolute top-4 right-4 text-dorado-elegante opacity-70 hover:opacity-100 transition-opacity">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-3xl font-script text-dorado-elegante mb-6 mt-2">Sube tu momento</h2>
            <div id="uploadForm" class="w-full flex flex-col gap-5 text-left font-sans">
                <div>
                    <label class="text-dorado-elegante text-[11px] font-bold tracking-widest uppercase mb-1.5 flex items-center gap-2">Tu nombre *</label>
                    <input type="text" id="nombreInput" placeholder="Ej: Ana María" class="input-ada px-4 py-3 w-full">
                </div>
                <div>
                    <label class="text-dorado-elegante text-[11px] font-bold tracking-widest uppercase mb-1.5 flex items-center gap-2">Momento del evento *</label>
                    <select id="folderSelect" class="input-ada px-4 py-3 w-full cursor-pointer appearance-none">
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="En la iglesia">En la iglesia</option>
                        <option value="En la recepción">En la recepción</option>
                        <option value="Cena">Cena</option>
                        <option value="El Vals">El Vals</option>
                        <option value="El baile">El baile</option>
                        <option value="El pastel">El pastel</option>
                    </select>
                </div>
                <div>
                    <label class="text-dorado-elegante text-[11px] font-bold tracking-widest uppercase mb-1.5 flex items-center gap-2">Seleccionar archivo *</label>
                    <div id="dropZone" class="relative border-2 border-dashed border-dorado-elegante/50 bg-black/30 rounded-xl p-6 text-center hover:bg-dorado-elegante/10 transition-colors cursor-pointer mt-1">
                        <input type="file" id="archivoInput" accept="video/mp4, video/mov, image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <svg class="w-10 h-10 mx-auto text-dorado-elegante mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-white text-sm font-bold">Haz clic o arrastra tu archivo aquí</p>
                    </div>
                    <div id="previsualizacion" class="w-full relative hidden mt-2">
                        <button id="removePreviewBtn" class="absolute top-2 right-2 bg-red-600 border border-white text-white rounded-full p-1 z-40 hover:bg-red-700 active:scale-95 shadow-md">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                        <div id="previewContainer" class="border border-dorado-elegante/50 rounded-xl overflow-hidden bg-black h-40 flex items-center justify-center relative"></div>
                    </div>
                </div>
                <div class="flex gap-3 mt-2">
                    <button id="btnCancelar" class="flex-1 bg-white/10 text-white font-bold rounded-lg py-3.5 text-[11px] tracking-[2px] uppercase">Cancelar</button>
                    <button id="btnSubir" class="flex-[1.5] bg-dorado-elegante text-black font-bold rounded-lg py-3.5 shadow-lg text-[11px] tracking-[2px] uppercase">Subir al Álbum</button>
                </div>
            </div>
            <p id="estadoCarga" class="text-[11px] uppercase tracking-widest font-bold mt-4 text-white bg-black p-3 rounded-md border border-dorado-elegante hidden text-center w-full font-sans"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD2YvEdaxuUV9UkdeNfkFFGoZ0K539eA_c",
            authDomain: "xv-mila-final.firebaseapp.com",
            projectId: "xv-mila-final",
            storageBucket: "xv-mila-final.firebasestorage.app",
            messagingSenderId: "165068896780",
            appId: "1:165068896780:web:59c4d6e7ea08f399a30c29"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const archivoInput = document.getElementById('archivoInput');
        const previsualizacion = document.getElementById('previsualizacion');
        const previewContainer = document.getElementById('previewContainer');
        const dropZone = document.getElementById('dropZone');
        const estadoCarga = document.getElementById('estadoCarga');

        // Modal Logic
        openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
        document.getElementById('closeModalBtnIcon').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });
        document.getElementById('btnCancelar').addEventListener('click', () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; });

        // Preview Logic
        archivoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            dropZone.classList.add('hidden');
            previsualizacion.classList.remove('hidden');
            const url = URL.createObjectURL(file);
            previewContainer.innerHTML = file.type.includes("image") ? `<img src="${url}" class="h-full object-contain">` : `<video src="${url}" muted loop class="h-full object-contain"></video>`;
        });

        document.getElementById('removePreviewBtn').addEventListener('click', () => {
            archivoInput.value = "";
            previsualizacion.classList.add('hidden');
            dropZone.classList.remove('hidden');
        });

        // Upload Logic
        document.getElementById("btnSubir").addEventListener("click", async () => {
            const archivo = archivoInput.files[0];
            const nombre = document.getElementById("nombreInput").value;
            const momento = document.getElementById("folderSelect").value;
            if(!archivo || !nombre || !momento) return alert("Completa todos los campos");

            const btn = document.getElementById("btnSubir");
            btn.disabled = true;
            estadoCarga.classList.remove('hidden');

            const storageRef = ref(storage, 'xv_mila/' + Date.now() + "_" + archivo.name);
            const uploadTask = uploadBytesResumable(storageRef, archivo);

            uploadTask.on('state_changed', 
                (snapshot) => { btn.innerText = `Subiendo... ${Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100)}%`; },
                (error) => { alert("Error al subir"); btn.disabled = false; },
                async () => {
                    const url = await getDownloadURL(uploadTask.snapshot.ref);
                    await addDoc(collection(db, "muro_mila"), {
                        nombre, momento, url_multimedia: url, likes: 0,
                        tipo: archivo.type.includes("video") ? "video" : "imagen",
                        fecha: new Date()
                    });
                    location.reload();
                }
            );
        });

        // View Toggle Logic
        document.getElementById('btn1Col').addEventListener('click', () => {
            document.getElementById('muro').className = "columns-1 md:columns-2 lg:columns-3 gap-6 w-full px-2";
        });
        document.getElementById('btn2Col').addEventListener('click', () => {
            document.getElementById('muro').className = "columns-2 md:columns-3 lg:columns-4 gap-3 w-full px-1";
        });

        // Real-time Feed
        const q = query(collection(db, "muro_mila"), orderBy("fecha", "desc"));
        onSnapshot(q, (snapshot) => {
            const muro = document.getElementById('muro');
            muro.innerHTML = "";
            snapshot.forEach((doc) => {
                const datos = doc.data();
                const id = doc.id;
                const media = datos.tipo === "video" ? `<video src="${datos.url_multimedia}" controls class="w-full h-auto rounded-xl border border-dorado-elegante/30"></video>` : `<img src="${datos.url_multimedia}" class="w-full h-auto rounded-xl border border-dorado-elegante/30">`;
                
                muro.innerHTML += `
                <div class="break-inside-avoid mb-4 bg-black/70 border border-dorado-elegante rounded-2xl p-3 relative">
                    <span class="absolute top-2 right-2 bg-dorado-elegante text-black text-[8px] font-bold px-2 py-1 rounded-full uppercase z-10">${datos.momento}</span>
                    ${media}
                    <div class="flex items-center justify-between mt-3">
                        <h4 class="text-white font-bold uppercase text-[9px] truncate flex-1">${datos.nombre}</h4>
                        <div class="flex items-center gap-3">
                            <a href="${datos.url_multimedia}" target="_blank" download="Mila_Recuerdo" class="text-dorado-elegante hover:text-white transition-all">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            </a>
                            <button onclick="darLike('${id}')" class="flex items-center gap-1 text-dorado-elegante hover:text-white transition-all">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                <span class="font-bold text-sm num-likes">${datos.likes}</span>
                            </button>
                        </div>
                    </div>
                </div>`;
            });
        });

        window.darLike = async function(id) {
            const docRef = doc(db, "muro_mila", id);
            await updateDoc(docRef, { likes: increment(1) });
        };
    </script>
</body>
</html>
