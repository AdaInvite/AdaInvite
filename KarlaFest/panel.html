<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Karla Fest</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Assets/Logo%20AdaInvite%20Negro.png">
    <meta name="theme-color" content="#9B8AA5">
    <link rel="apple-touch-icon" href="https://i.imgur.com/olRq9Eb.jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9B8AA5', 
                        surface: '#FAF9FB',
                        text: '#3D3542',
                    },
                    fontFamily: {
                        sans: ['"Montserrat"', 'sans-serif'],
                        dancing: ['"Dancing Script"', 'cursive']
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { box-sizing: border-box; background-color: #FAF9FB; color: #3D3542; }
        :root { --primary-color: #9B8AA5; --surface-color: #FAF9FB; --text-color: #3D3542; --white: #FFFFFF; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(155, 138, 165, 0.2); }
        .info-label { color: var(--primary-color); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    </style>
</head>
<body class="h-full font-sans antialiased flex flex-col items-center">
    
    <div id="app-wrapper" class="w-full h-full overflow-x-hidden overflow-y-auto">
        <!-- HEADER MÓVIL -->
        <nav class="fixed top-0 left-0 right-0 z-50 bg-white shadow-sm py-3 px-4 flex justify-between items-center">
            <img src="https://firebasestorage.googleapis.com/v0/b/adainvite-app.firebasestorage.app/o/assets%2Flogos%2FLogo%20AdaInvite%20Transp.png?alt=media&token=0a379f2d-c9c3-42be-bccc-facd1654dab8" alt="AdaInvite Logo" class="h-10">
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Panel de Enlaces</span>
            </div>
        </nav>

        <section class="pt-24 pb-12 px-4 max-w-lg mx-auto space-y-8 flex flex-col justify-center min-h-[90vh]">
            
            <div class="text-center mt-4">
                <h2 class="font-dancing text-5xl mb-2 text-primary">Generador</h2>
                <p class="text-xs uppercase tracking-widest font-bold text-gray-500">Karla Fest • 30 Años</p>
                <p class="text-[11px] text-gray-400 mt-4 leading-relaxed max-w-[280px] mx-auto">
                    Crea los enlaces personalizados con el nombre de tus invitados listos para enviar por WhatsApp.
                </p>
            </div>

            <!-- SECCIÓN ÚNICA: GENERADOR DE PASES -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="info-label mb-4 flex items-center gap-2"><i data-lucide="link" class="w-4 h-4"></i> Crear Invitación</h3>
                
                <div class="space-y-4">
                    <div>
                        <input type="text" id="inputFamilia" placeholder="Nombre (Ej. Familia Fabila o Juan Pérez)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm transition-all focus:bg-white text-center font-semibold text-gray-700">
                    </div>
                    
                    <button onclick="generarLink()" class="w-full bg-primary text-white font-bold py-4 rounded-xl uppercase tracking-widest text-xs hover:bg-opacity-90 shadow-md transition-all active:scale-95 flex justify-center items-center gap-2 mt-2">
                        <i data-lucide="wand-2" class="w-4 h-4"></i> Generar Enlace
                    </button>
                </div>

                <!-- Resultado Generador -->
                <div id="resultadoContainer" class="hidden mt-6 pt-5 border-t border-gray-100 transition-all duration-300">
                    <p class="text-[10px] text-gray-400 font-bold uppercase mb-2">Mensaje listo para enviar:</p>
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-4 text-xs text-gray-600 font-medium whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto shadow-inner" id="linkGenerado"></div>
                    <button onclick="copiarLink()" id="btnCopiar" class="w-full flex items-center justify-center gap-2 bg-white border-2 border-primary text-primary py-3 rounded-xl text-xs font-bold uppercase tracking-wider hover:bg-gray-50 transition-colors active:scale-95">
                        <i data-lucide="copy" class="w-4 h-4"></i> Copiar texto completo
                    </button>
                </div>
            </div>
            
        </section>
    </div>

    <!-- MODAL PERSONALIZADO -->
    <div id="customModal" class="fixed inset-0 z-[100] flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal(false)"></div>
        <div class="relative bg-white p-6 rounded-3xl shadow-2xl w-[85%] max-w-sm transform scale-95 transition-transform duration-300" id="modalContentBox">
            <div id="modalIconContainer" class="mx-auto w-14 h-14 rounded-full flex items-center justify-center mb-4">
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-center text-gray-800 mb-2 font-sans">Título</h3>
            <p id="modalMessage" class="text-sm text-center text-gray-500 mb-6 font-sans leading-relaxed">Mensaje descriptivo</p>
            <div id="modalButtons" class="flex gap-3 justify-center">
            </div>
        </div>
    </div>

    <script>
        // Inicializar Iconos
        lucide.createIcons();

        // --- SISTEMA DE MODALES ---
        let modalResolve = null;
        let modalTimeout = null;

        function showModal({ type = 'info', title, message, showCancel = false, confirmText = 'Aceptar' }) {
            return new Promise((resolve) => {
                modalResolve = resolve;
                
                const modal = document.getElementById('customModal');
                const box = document.getElementById('modalContentBox');
                const titleEl = document.getElementById('modalTitle');
                const messageEl = document.getElementById('modalMessage');
                const buttonsEl = document.getElementById('modalButtons');
                const iconEl = document.getElementById('modalIconContainer');
                
                titleEl.textContent = title;
                messageEl.textContent = message;
                
                if (type === 'warning') {
                    iconEl.className = 'mx-auto w-14 h-14 rounded-full bg-orange-50 flex items-center justify-center mb-4 text-orange-500';
                    iconEl.innerHTML = '<i data-lucide="alert-triangle" class="w-7 h-7"></i>';
                } else {
                    iconEl.className = 'mx-auto w-14 h-14 rounded-full bg-primary/10 flex items-center justify-center mb-4 text-primary';
                    iconEl.innerHTML = '<i data-lucide="info" class="w-7 h-7"></i>';
                }
                
                buttonsEl.innerHTML = '';
                if (showCancel) {
                    buttonsEl.innerHTML += `<button onclick="closeModal(false)" class="flex-1 px-4 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold text-[11px] uppercase tracking-wider hover:bg-gray-200 transition-colors active:scale-95">Cancelar</button>`;
                }
                
                const btnColorClass = 'bg-primary hover:bg-opacity-90';
                buttonsEl.innerHTML += `<button onclick="closeModal(true)" class="flex-1 px-4 py-3 ${btnColorClass} text-white rounded-xl font-bold text-[11px] uppercase tracking-wider transition-colors active:scale-95">${confirmText}</button>`;
                
                lucide.createIcons();
                
                if(modalTimeout) clearTimeout(modalTimeout);
                
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    box.classList.remove('scale-95');
                }, 10);
            });
        }

        function closeModal(result) {
            const modal = document.getElementById('customModal');
            const box = document.getElementById('modalContentBox');
            
            modal.classList.add('opacity-0');
            box.classList.add('scale-95');
            
            if (modalResolve) {
                modalResolve(result);
                modalResolve = null; 
            }
            
            if(modalTimeout) clearTimeout(modalTimeout);
            
            modalTimeout = setTimeout(() => {
                if(!modalResolve) {
                    modal.classList.add('hidden');
                }
            }, 300);
        }

        // --- LÓGICA DEL GENERADOR DE ENLACES ---
        // Asegúrate de cambiar esta URL si tu dominio cambia.
        const URL_BASE_INVITACION = "https://adainvite.com/KarlaFest";
        let textoCompleto = "";

        async function generarLink() {
            const familia = document.getElementById('inputFamilia').value.trim();
            
            if(!familia) {
                await showModal({ 
                    type: 'warning', 
                    title: 'Falta el nombre', 
                    message: 'Por favor, escribe el nombre del invitado o familia antes de generar el enlace.' 
                });
                return;
            }
            
            // Generamos la URL solo con el parámetro "n" (nombre)
            const linkFinal = `${URL_BASE_INVITACION}?n=${encodeURIComponent(familia)}`;
            
            // Texto adaptado (Sin mencionar confirmación de asistencia)
            textoCompleto = `¡Hola! Se acerca mi gran día y me haría muchísima ilusión que me acompañaras a celebrar mis 30 años.\n\nTe comparto el enlace con todos los detalles de la celebración:\n${linkFinal}\n\n¡Ahí nos vemos!`;
            
            document.getElementById('linkGenerado').innerText = textoCompleto;
            document.getElementById('resultadoContainer').classList.remove('hidden');
            
            const btn = document.getElementById('btnCopiar');
            btn.classList.replace('border-green-500', 'border-primary');
            btn.classList.replace('text-green-600', 'text-primary');
            btn.innerHTML = `<i data-lucide="copy" class="w-4 h-4"></i> Copiar texto completo`;
            lucide.createIcons();
        }

        async function copiarLink() {
            const textArea = document.createElement("textarea");
            textArea.value = textoCompleto;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                const btn = document.getElementById('btnCopiar');
                btn.classList.replace('border-primary', 'border-green-500');
                btn.classList.replace('text-primary', 'text-green-600');
                btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> ¡Copiado con éxito!`;
                lucide.createIcons();
                
                // Regresar el botón a la normalidad después de 3 segundos
                setTimeout(() => {
                    btn.classList.replace('border-green-500', 'border-primary');
                    btn.classList.replace('text-green-600', 'text-primary');
                    btn.innerHTML = `<i data-lucide="copy" class="w-4 h-4"></i> Copiar texto completo`;
                    lucide.createIcons();
                    
                    // Limpiar el input para el siguiente invitado
                    document.getElementById('inputFamilia').value = '';
                    document.getElementById('inputFamilia').focus();
                }, 3000);
            } catch (err) {
                await showModal({ 
                    type: 'warning', 
                    title: 'Error al copiar', 
                    message: 'No se pudo copiar el texto a tu portapapeles. Selecciona el texto manualmente.' 
                });
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
