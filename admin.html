<!doctype html>
<html lang="es" class="h-full">
<head> 
    <!-- 1. Icono para la pestaña del navegador (PC y Android) -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Logo%20AdaInvite.png">
      <!-- 2. Icono para Pantalla de Inicio en iPhone/iPad (iOS) -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Logo%20AdaInvite.png">
  <link rel="apple-touch-icon" sizes="152x152" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Logo%20AdaInvite.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/AdaInvite/AdaInvite/main/Logo%20AdaInvite.png">

  <!-- 3. Configuración para que se comporte como una Aplicación Web -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AdaInvite">

    <meta name="theme-color" content="#9B8AA5">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | AdaInvite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-purple: #9B8AA5;
            --surface-color: #FAF9FB;
            --text-color: #3D3542;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--surface-color);
            color: var(--text-color);
        }
        .tab-btn.active {
            background-color: var(--primary-purple);
            color: white;
        }
        .tab-btn.active .badge {
            background-color: white;
            color: var(--primary-purple);
        }
        .order-card:hover {
            border-color: var(--primary-purple);
        }
        .order-card.selected {
            border-color: var(--primary-purple);
            background-color: #F8F6F9;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #E5E7EB;
            border-radius: 0.5rem;
            transition: border-color 0.3s;
            background-color: var(--white);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 1px var(--primary-purple);
        }
        .filter-btn.active-filter {
            border-color: #3D3542 !important;
            background-color: #FAF9FB !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="h-full flex flex-col md:flex-row overflow-auto md:overflow-hidden bg-gray-50">

    <!-- PANTALLA DE LOGIN (BLOQUEO) -->
    <div id="login-screen" class="fixed inset-0 bg-[#FAF9FB] z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 max-w-sm w-full text-center">
            <img src="https://i.imgur.com/NyEstKd.png" alt="AdaInvite" class="h-12 mx-auto mb-6">
            <h2 class="text-xl font-bold text-[#3D3542] mb-2">Acceso Admin</h2>
            
           <form onsubmit="event.preventDefault(); verificarPassword(event);">
                <input type="password" id="admin-pass" class="form-input mb-2 text-center text-lg tracking-widest" placeholder="••••••••" required>
                <p id="login-error" class="text-xs text-red-500 mb-4 h-4 opacity-0 transition-opacity">Contraseña incorrecta</p>
                <button type="submit" class="w-full bg-[#9B8AA5] hover:opacity-90 transition-opacity text-white py-3 rounded-lg font-bold shadow-md">
                    Entrar
                </button>
            </form>
        </div>
    </div>
    
    <!-- BARRA LATERAL (MENÚ DE PAQUETES) -->
    <aside class="w-full md:w-64 bg-white border-b md:border-b-0 md:border-r border-gray-200 flex flex-col shrink-0 hidden-until-login opacity-0 transition-opacity duration-500">
        <div class="p-6 border-b border-gray-200 text-center">
            <img src="https://i.imgur.com/NyEstKd.png" alt="AdaInvite" class="h-10 mx-auto mb-2">
            <span class="text-base font-bold tracking-widest text-[#9B8AA5] uppercase">Admin Panel</span>
        </div>

        <div class="p-4 flex flex-col gap-2">
            <!-- Opción "Todos / General" -->
            <button onclick="cargarTodosGeneral(this)" id="btn-todos" class="tab-btn active w-full flex items-center justify-between px-4 py-3 rounded-lg font-medium text-base transition-colors bg-[#9B8AA5] text-white">
                <span>Resumen</span>
                <span id="badge-todos" class="badge hidden bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
            <button onclick="cargarDatosMultiples(['solicitudes_basico', 'basico'], this, 'basico')" id="btn-basico" class="tab-btn w-full flex items-center justify-between px-4 py-3 rounded-lg font-medium text-base transition-colors text-gray-600 hover:bg-gray-100">
                <span>Paquete Básico</span>
                <span id="badge-basico" class="badge hidden bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
            <button onclick="cargarDatosMultiples(['solicitudes_premium', 'premium'], this, 'premium')" class="tab-btn w-full flex items-center justify-between px-4 py-3 rounded-lg font-medium text-base transition-colors text-gray-600 hover:bg-gray-100">
                <span>Paquete Premium</span>
                <span id="badge-premium" class="badge hidden bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
            <button onclick="cargarDatosMultiples(['solicitudes_vip', 'vip'], this, 'vip')" class="tab-btn w-full flex items-center justify-between px-4 py-3 rounded-lg font-medium text-base transition-colors text-gray-600 hover:bg-gray-100">
                <span>Paquete VIP</span>
                <span id="badge-vip" class="badge hidden bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </aside>

    <!-- LISTA DE SOLICITUDES Y RESUMEN MÓVIL -->
    <div class="w-full md:w-80 bg-gray-50 border-b md:border-b-0 md:border-r border-gray-200 flex flex-col shrink-0 overflow-y-auto hidden-until-login opacity-0 transition-opacity duration-500 h-auto md:h-full">
        <div class="p-4 border-b border-gray-200 bg-white sticky top-0 z-10 flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <h2 id="titulo-seccion-lista" class="font-bold text-lg text-[#3D3542]">Todos los Pedidos</h2>
                <p id="total-solicitudes" class="text-xs text-gray-500">Cargando...</p>
            </div>

            <!-- FILTROS RÁPIDOS POR ESTATUS -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="filtrarPedidos('pendiente')" id="filter-pendiente" class="filter-btn active-filter p-2 rounded-lg border border-gray-200 bg-white text-center transition-all">
                    <span id="count-nuevos" class="block text-sm font-bold text-[#3D3542]">0</span>
                    <span class="block text-[10px] text-gray-500 uppercase font-semibold">Nuevos</span>
                </button>
                <button onclick="filtrarPedidos('en_proceso')" id="filter-proceso" class="filter-btn p-2 rounded-lg border border-gray-200 bg-white text-center transition-all">
                    <span id="count-proceso" class="block text-sm font-bold text-amber-600">0</span>
                    <span class="block text-[10px] text-gray-500 uppercase font-semibold">Proceso</span>
                </button>
                <button onclick="filtrarPedidos('completado')" id="filter-completado" class="filter-btn p-2 rounded-lg border border-gray-200 bg-white text-center transition-all">
                    <span id="count-completados" class="block text-sm font-bold text-green-600">0</span>
                    <span class="block text-[10px] text-gray-500 uppercase font-semibold">Listos</span>
                </button>
            </div>
        </div>

        <div id="lista-solicitudes" class="p-4 flex flex-col gap-3">
            <!-- Aquí se inyectarán las tarjetas -->
        </div>
    </div>

  <!-- ÁREA PRINCIPAL -->
    <main id="main-content" class="w-full flex-1 bg-white flex flex-col min-h-screen md:min-h-0 overflow-hidden hidden-until-login opacity-0 transition-opacity duration-500">
        
        <div class="p-4 md:p-6 border-b border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center bg-white sticky top-0 z-10 gap-4 md:gap-0">
            <div>
                <h2 id="vista-cliente-nombre" class="text-lg md:text-2xl font-bold text-[#3D3542]">Selecciona una solicitud</h2>
                <p id="vista-cliente-evento" class="text-xs text-[#9B8AA5]">Para ver datos y prompt</p>
            </div>
        </div>
        
        <!-- CONTENEDOR CON SCROLL -->
        <div class="flex-1 p-4 md:p-6 overflow-y-auto bg-gray-50 flex flex-col gap-6">
            
            <div id="empty-state" class="h-full flex items-center justify-center text-gray-400 font-medium p-8 text-center text-sm md:text-base">
                Selecciona un cliente de la lista para ver su información.
            </div>

            <!-- CUADRITO INDEPENDIENTE: DATOS DEL CLIENTE -->
            <div id="datos-cliente-container" class="hidden bg-white p-4 md:p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-[#3D3542] uppercase tracking-wider">Información del Cliente</h3>
                    <button onclick="copiarDatosCliente()" id="btn-copiar-datos" class="px-4 py-2 bg-gray-800 text-white rounded-lg font-bold text-xs shadow-sm hover:bg-gray-900 transition-all flex items-center gap-1.5">
                        Copiar Datos
                    </button>
                </div>
                <div id="datos-cliente-texto" class="bg-gray-50 p-4 rounded-lg border border-gray-200 font-mono text-xs text-gray-800 whitespace-pre-wrap"></div>
            </div>
            
            <!-- CUADRITO: GENERADOR DE PROMPT -->
            <div id="prompt-wrapper" class="hidden bg-white p-4 md:p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-[#3D3542] uppercase tracking-wider">Prompt para IA</h3>
                    <button onclick="copiarPrompt()" id="btn-copiar" class="px-4 py-2 bg-[#9B8AA5] text-white rounded-lg font-bold text-xs shadow-sm hover:opacity-90 transition-all flex items-center gap-1.5">
                        Copiar Prompt
                    </button>
                </div>
                <div id="prompt-container" class="bg-gray-50 p-4 rounded-lg border border-gray-200 whitespace-pre-wrap font-mono text-xs md:text-sm text-gray-800 leading-relaxed selection:bg-purple-200 overflow-x-auto"></div>
            </div>
            
            <!-- SECCIÓN DE ESTADO DEL PEDIDO Y COMENTARIOS -->
            <div id="estado-container" class="hidden mt-2 bg-white p-4 md:p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-5">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-100 pb-5">
                    <div class="text-left">
                        <h3 class="text-lg font-bold text-[#3D3542]">Estado de Producción</h3>
                        <p class="text-sm text-gray-500">Actualiza el progreso del pedido.</p>
                    </div>
                    
                    <div class="flex bg-gray-100 p-1 rounded-lg w-full sm:w-auto overflow-x-auto">
                        <button onclick="cambiarEstatus('pendiente')" id="btn-estatus-pendiente" class="flex-1 sm:flex-none px-4 py-2 rounded-md text-xs font-bold transition-all text-gray-500 hover:bg-gray-200">
                            Pendiente
                        </button>
                        <button onclick="cambiarEstatus('en_proceso')" id="btn-estatus-proceso" class="flex-1 sm:flex-none px-4 py-2 rounded-md text-xs font-bold transition-all text-gray-500 hover:bg-gray-200">
                            En Proceso
                        </button>
                        <button onclick="cambiarEstatus('completado')" id="btn-estatus-completado" class="flex-1 sm:flex-none px-4 py-2 rounded-md text-xs font-bold transition-all text-gray-500 hover:bg-gray-200">
                            Completado
                        </button>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-[#3D3542]">Notas / Comentarios (Solo Admin)</label>
                    <textarea id="admin-comentario" rows="3" class="w-full p-3 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-700 focus:outline-none focus:border-[#9B8AA5] focus:bg-white transition-colors resize-y" placeholder="Escribe aquí notas internas, links de Canva, recordatorios..."></textarea>
                    <button onclick="guardarComentario()" id="btn-guardar-comentario" class="self-end px-5 py-2.5 bg-[#3D3542] text-white rounded-lg text-xs font-bold hover:bg-gray-800 transition-all shadow-sm">
                        Guardar Nota
                    </button>
                </div>
            </div>

        </div> 
    </main>

    <!-- FIREBASE & LOGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwgiUaie7pWejMKkEA0w-hi8eqs8eheXM",
            authDomain: "adainvite-app.firebaseapp.com",
            projectId: "adainvite-app",
            storageBucket: "adainvite-app.firebasestorage.app",
            messagingSenderId: "636581204653",
            appId: "1:636581204653:web:5e6c3732d94288880cec24"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); 

        let datosActuales = [];
        let filtroActual = 'pendiente'; 
        window.clienteSeleccionado = null;

        const configuracionPaquetes = {
            'basico': ['solicitudes_basico', 'basico'],
            'premium': ['solicitudes_premium', 'premium'],
            'vip': ['solicitudes_vip', 'vip']
        };

        // --- VERIFICAR SI YA HAY UNA SESIÓN ABIIERTA AL CARGAR LA PÁGINA ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Si ya está logueado, ocultamos el login y cargamos los datos directo
                document.getElementById('login-screen').classList.add('hidden');
                const elementosPanel = document.querySelectorAll('.hidden-until-login');
                elementosPanel.forEach(el => {
                    el.classList.remove('opacity-0');
                    el.classList.add('opacity-100');
                });
                const btnTodos = document.getElementById('btn-todos');
                cargarTodosGeneral(btnTodos);
            }
        });

        window.verificarPassword = async function(event) {
            event.preventDefault(); 
            
            const passInput = document.getElementById('admin-pass');
            const errorText = document.getElementById('login-error');
            const btnSubmit = event.target.querySelector('button[type="submit"]');
            
            const textoOriginal = btnSubmit.innerText;
            btnSubmit.innerText = "Verificando...";
            btnSubmit.disabled = true;
            
            const miCorreoAdmin = "admin@adainvite.com"; 
            const passwordIngresada = passInput.value;
            
            try {
                // Configurar persistencia para que la sesión se quede abierta
                await setPersistence(auth, browserLocalPersistence);
                await signInWithEmailAndPassword(auth, miCorreoAdmin, passwordIngresada);
                
                document.getElementById('login-screen').classList.add('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                const elementosPanel = document.querySelectorAll('.hidden-until-login');
                elementosPanel.forEach(el => {
                    el.classList.remove('opacity-0');
                    el.classList.add('opacity-100');
                });

                const btnTodos = document.getElementById('btn-todos');
                cargarTodosGeneral(btnTodos);
                
            } catch (error) {
                errorText.classList.remove('opacity-0');
                passInput.value = '';
                passInput.focus();
                setTimeout(() => { errorText.classList.add('opacity-0'); }, 3000);
            } finally {
                btnSubmit.innerText = textoOriginal;
                btnSubmit.disabled = false;
            }
        };

        window.cargarTodosGeneral = async function(btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-[#9B8AA5]', 'text-white');
                btn.classList.add('text-gray-600', 'hover:bg-gray-100');
            });
            if(btnElement) {
                btnElement.classList.remove('text-gray-600', 'hover:bg-gray-100');
                btnElement.classList.add('active', 'bg-[#9B8AA5]', 'text-white');
            }

            document.getElementById('titulo-seccion-lista').innerText = "Todos los Pedidos";
            const listaEl = document.getElementById('lista-solicitudes');
            listaEl.innerHTML = '<p class="text-sm text-gray-500 text-center mt-4">Cargando...</p>';

            document.getElementById('prompt-wrapper').classList.add('hidden');
            document.getElementById('datos-cliente-container').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('estado-container').classList.add('hidden');
            document.getElementById('vista-cliente-nombre').innerText = "Selecciona una solicitud";
            document.getElementById('vista-cliente-evento').innerText = "Para ver datos y prompt";

            let todasLasColecciones = ['solicitudes_basico', 'basico', 'solicitudes_premium', 'premium', 'solicitudes_vip', 'vip'];
            let todosLosDocumentos = [];

            for (let colName of todasLasColecciones) {
                try {
                    const querySnapshot = await getDocs(collection(db, colName));
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        data.id = doc.id; 
                        data._coleccionOrigen = colName;
                        todosLosDocumentos.push(data);
                    });
                } catch (e) {
                    console.log(`Colección ${colName} vacía o no existe.`);
                }
            }

            todosLosDocumentos.sort((a, b) => {
                const dateA = a.fechaRegistro ? a.fechaRegistro.toDate().getTime() : 0;
                const dateB = b.fechaRegistro ? b.fechaRegistro.toDate().getTime() : 0;
                return dateB - dateA;
            });

            datosActuales = todosLosDocumentos;
            
            actualizarResumenDashboardGlobal();
            renderizarLista();
        };

        window.cargarDatosMultiples = async function(coleccionesArray, btnElement, paqueteId) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-[#9B8AA5]', 'text-white');
                btn.classList.add('text-gray-600', 'hover:bg-gray-100');
            });
            btnElement.classList.remove('text-gray-600', 'hover:bg-gray-100');
            btnElement.classList.add('active', 'bg-[#9B8AA5]', 'text-white');

            const nombrePaqueteFormateado = paqueteId.toUpperCase();
            document.getElementById('titulo-seccion-lista').innerText = `Paquete ${nombrePaqueteFormateado}`;

            const listaEl = document.getElementById('lista-solicitudes');
            listaEl.innerHTML = '<p class="text-sm text-gray-500 text-center mt-4">Cargando...</p>';
            
            document.getElementById('prompt-wrapper').classList.add('hidden');
            document.getElementById('datos-cliente-container').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('estado-container').classList.add('hidden');
            document.getElementById('vista-cliente-nombre').innerText = "Selecciona una solicitud";
            document.getElementById('vista-cliente-evento').innerText = "Para ver datos y prompt";

            try {
                let todosLosDocumentos = [];

                for (let colName of coleccionesArray) {
                    try {
                        const querySnapshot = await getDocs(collection(db, colName));
                        querySnapshot.forEach((doc) => {
                            const data = doc.data();
                            data.id = doc.id; 
                            data._coleccionOrigen = colName;
                            todosLosDocumentos.push(data);
                        });
                    } catch (e) {
                        console.log(`No se encontraron datos en ${colName}`);
                    }
                }

                todosLosDocumentos.sort((a, b) => {
                    const dateA = a.fechaRegistro ? a.fechaRegistro.toDate().getTime() : 0;
                    const dateB = b.fechaRegistro ? b.fechaRegistro.toDate().getTime() : 0;
                    return dateB - dateA;
                });

                datosActuales = todosLosDocumentos;
                
                actualizarResumenDashboardGlobal();
                renderizarLista();

            } catch (error) {
                console.error("Error al cargar datos:", error);
                listaEl.innerHTML = '<p class="text-sm text-red-500 text-center mt-4">Error al cargar la información.</p>';
            }
        };

        window.actualizarResumenDashboardGlobal = function() {
            let nuevos = 0;
            let proceso = 0;
            let completados = 0;

            let contadoresPaquetes = { basico: 0, premium: 0, vip: 0 };

            datosActuales.forEach(d => {
                const estatus = d.estatus || 'pendiente';
                if(estatus === 'completado') completados++;
                else if(estatus === 'en_proceso') proceso++;
                else {
                    nuevos++;
                    if(d._coleccionOrigen && (d._coleccionOrigen.includes('basico'))) contadoresPaquetes.basico++;
                    if(d._coleccionOrigen && (d._coleccionOrigen.includes('premium'))) contadoresPaquetes.premium++;
                    if(d._coleccionOrigen && (d._coleccionOrigen.includes('vip'))) contadoresPaquetes.vip++;
                }
            });

            document.getElementById('count-nuevos').innerText = nuevos;
            document.getElementById('count-proceso').innerText = proceso;
            document.getElementById('count-completados').innerText = completados;

            ['basico', 'premium', 'vip'].forEach(p => {
                const badge = document.getElementById(`badge-${p}`);
                if(badge && contadoresPaquetes[p] > 0) {
                    badge.innerText = contadoresPaquetes[p];
                    badge.classList.remove('hidden');
                } else if(badge) {
                    badge.classList.add('hidden');
                }
            });
        };

        window.filtrarPedidos = function(estatusFiltro) {
            filtroActual = estatusFiltro;
            
            ['pendiente', 'en_proceso', 'completado'].forEach(e => {
                const btnId = e === 'pendiente' ? 'filter-pendiente' : (e === 'en_proceso' ? 'filter-proceso' : 'filter-completado');
                const btn = document.getElementById(btnId);
                if(e === estatusFiltro) {
                    btn.classList.add('active-filter');
                } else {
                    btn.classList.remove('active-filter');
                }
            });

            renderizarLista();
        };

        window.renderizarLista = function() {
            const listaEl = document.getElementById('lista-solicitudes');
            listaEl.innerHTML = '';

            const documentosFiltrados = datosActuales.filter(d => {
                const estatusItem = d.estatus || 'pendiente';
                return estatusItem === filtroActual;
            });

            document.getElementById('total-solicitudes').innerText = `${documentosFiltrados.length} pedidos`;

            if(documentosFiltrados.length === 0) {
                listaEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">No hay pedidos en esta categoría.</p>';
                return;
            }

            const hoy = new Date();

            documentosFiltrados.forEach((data) => {
                const card = document.createElement('div');
                card.className = 'order-card bg-white p-3 rounded-lg border border-gray-200 cursor-pointer transition-colors shadow-sm';
                
                if(window.clienteSeleccionado && window.clienteSeleccionado.id === data.id) {
                    card.classList.add('selected');
                }

                let fechaCorta = "Reciente";
                let diasPasados = "Hoy";

                if(data.fechaRegistro) {
                    const dateObj = data.fechaRegistro.toDate();
                    fechaCorta = dateObj.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
                    
                    const diffTime = Math.abs(hoy - dateObj);
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    
                    if(diffDays === 0) diasPasados = "Hoy";
                    else if(diffDays === 1) diasPasados = "Hace 1 día";
                    else diasPasados = `Hace ${diffDays} días`;
                }

                let estatusBadge = '';
                let etiquetaDerecha = '';

                if (data.estatus === 'completado') {
                    estatusBadge = '<span class="ml-2 px-2 py-0.5 bg-green-100 text-green-700 text-[9px] rounded-full uppercase font-bold tracking-wider">Completado</span>';
                    
                    let fechaCompletadoStr = fechaCorta;
                    if (data.fechaCompletado) {
                        try {
                            const dateCompObj = data.fechaCompletado.toDate();
                            fechaCompletadoStr = dateCompObj.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
                        } catch(e) {}
                    }

                    etiquetaDerecha = `<span class="text-[10px] text-green-700 bg-green-50 font-medium px-2 py-1 rounded shadow-sm border border-green-200 whitespace-nowrap">${fechaCompletadoStr}</span>`;
                } else {
                    if (data.estatus === 'en_proceso') {
                        estatusBadge = '<span class="ml-2 px-2 py-0.5 bg-amber-100 text-amber-700 text-[9px] rounded-full uppercase font-bold tracking-wider">En Proceso</span>';
                    }
                    etiquetaDerecha = `<span class="text-[10px] text-gray-600 bg-gray-100 font-medium px-2 py-1 rounded shadow-sm border border-gray-200 whitespace-nowrap">${fechaCorta} (${diasPasados})</span>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-[#3D3542] text-sm truncate flex-1">
                            ${data.festejado_nombre || 'Sin nombre'} 
                            <span class="estatus-badge-container">${estatusBadge}</span>
                        </span>
                    </div>
                    <div class="flex justify-between items-center mt-2">
                        <div class="text-xs text-gray-500 truncate flex-1">${data.tipo_evento || ''}</div>
                        <div class="estatus-fecha-container">
                            ${etiquetaDerecha}
                        </div>
                    </div>
                `;
                
                card.onclick = () => seleccionarCliente(data, card);
                listaEl.appendChild(card);
            });
        };

        window.seleccionarCliente = function(data, cardElement) {
            window.clienteSeleccionado = data;
            document.querySelectorAll('.order-card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');

            document.getElementById('empty-state').classList.add('hidden');
            const promptContainer = document.getElementById('prompt-container');
            const promptWrapper = document.getElementById('prompt-wrapper');
            const datosClienteContainer = document.getElementById('datos-cliente-container');
            const datosClienteTexto = document.getElementById('datos-cliente-texto');
            
            document.getElementById('vista-cliente-nombre').innerText = data.contacto_nombre || "Cliente sin nombre";
            document.getElementById('vista-cliente-evento').innerText = `${data.tipo_evento || 'Evento'} de ${data.festejado_nombre || 'Festejado'}`;

            // --- 1. DATOS DEL CLIENTE ---
            let textoDatosCliente = `Nombre del cliente: ${data.contacto_nombre || 'N/A'}\n`;
            textoDatosCliente += `Contacto (Teléfono): ${data.contacto_telefono || data.evento_whatsapp || 'N/A'}\n`;
            textoDatosCliente += `Evento: ${data.tipo_evento || 'N/A'} de ${data.festejado_nombre || 'N/A'}\n`;
            textoDatosCliente += `Fecha del evento: ${data.evento_fecha || 'N/A'}\n`;
            textoDatosCliente += `Paquete adquirido: ${data.paquete || data._coleccionOrigen || 'N/A'}`;

            datosClienteTexto.innerText = textoDatosCliente;
            datosClienteContainer.classList.remove('hidden');

            // --- 2. PROMPT CON CONTROL DE CAMPOS VACÍOS Y CÓDIGO DE VESTIMENTA ---
            let promptText = `Adapta la invitación web ${data.tematica || data.modelo_base || 'estilo estándar'} con lo siguiente:\n\n`;
            
            promptText += `Festejado/a: ${data.festejado_nombre || 'N/A'}\n`;
            promptText += `Tipo de evento: ${data.tipo_evento || 'N/A'}\n`;
            promptText += `Fecha del evento: ${data.evento_fecha || 'N/A'}\n\n`;
            
            promptText += `Frase de bienvenida: "${data.festejado_frase || 'N/A'}"\n\n`;
            
            promptText += `Padres: ${data.familia_papas || 'N/A'}\n`;
            promptText += `Padrinos: ${data.familia_padrinos || 'N/A'}\n\n`;

            if(data.ceremonia_lugar) {
                promptText += `Templo: ${data.ceremonia_lugar}\n`;
                promptText += `Dirección del templo: ${data.ceremonia_direccion || 'N/A'}\n`;
                promptText += `Ubicación templo: ${data.ceremonia_maps || 'N/A'}\n`;
                promptText += `Hora de ceremonia: ${data.ceremonia_hora || 'N/A'}\n\n`;
            } else {
                promptText += `Templo: N/A\n\n`;
            }

            promptText += `Salón: ${data.recepcion_lugar || 'N/A'}\n`;
            promptText += `Dirección del salón: ${data.recepcion_direccion || 'N/A'}\n`;
            promptText += `Ubicación salón: ${data.recepcion_maps || 'N/A'}\n`;
            promptText += `Hora de recepción: ${data.recepcion_hora || 'N/A'}\n\n`;

            if(data.imagenes && data.imagenes.historia1) {
                for(let i=1; i<=6; i++) {
                    if(data[`historia_frase_${i}`] || (data.imagenes && data.imagenes[`historia${i}`])) {
                        promptText += `Historia - Tarjeta ${i}: "${data[`historia_frase_${i}`] || 'N/A'}"\n`;
                        promptText += `Foto: ${data.imagenes[`historia${i}`] || 'N/A'}\n\n`;
                    }
                }
            } else {
                promptText += `Historias / Tarjetas: N/A\n\n`;
            }

            promptText += `Itinerario:\n${data.itinerario || 'N/A'}\n\n`;

            promptText += `Código de vestimenta (Estilo): ${data.vestimenta_estilo || 'N/A'}\n`;
            promptText += `Colores reservados (Vestimenta): ${data.vestimenta_reservados || 'N/A'}\n`;
            promptText += `Imagen Style Guide: ${(data.imagenes && data.imagenes.vestimenta) ? data.imagenes.vestimenta : 'N/A'}\n\n`;

            promptText += `Mesa de regalos Amazon: ${data.regalos_amazon || 'N/A'}\n`;
            promptText += `Mesa de regalos Liverpool: ${data.regalos_liverpool || 'N/A'}\n`;
            promptText += `Lluvia de sobres: ${data.lluvia_sobres === 'on' ? 'Sí' : 'No'}\n\n`;

            promptText += `Fecha límite RSVP: ${data.fecha_limite || 'N/A'}\n`;
            promptText += `Confirmaciones: Al número de WhatsApp ${data.evento_whatsapp || 'N/A'}\n`;
            
            let tipoConfTexto = data.tipo_confirmacion || 'N/A';
            if(tipoConfTexto === 'adultos_y_ninos') tipoConfTexto = 'Cantidad de adultos y niños';
            if(tipoConfTexto === 'solo_adultos') tipoConfTexto = 'Solo adultos';
            if(tipoConfTexto === 'sin_ninos') tipoConfTexto = 'No se admitirán niños';
            promptText += `Tipo de confirmación: ${tipoConfTexto}\n\n`;

            if(data.activar_qr) {
                promptText += `Control de Accesos QR: ${data.activar_qr === 'si' ? 'SÍ ACTIVAR' : 'No'}\n`;
                promptText += `Entrega de Pases: ${data.entrega_pases === 'enviar_con_invitacion' ? 'Con la invitación' : 'Al confirmar asistencia'}\n\n`;
            } else {
                promptText += `Control de Accesos QR: N/A\n\n`;
            }

            promptText += `Canción: ${data.evento_musica || 'N/A'}\n`;
            promptText += `Paleta de colores: ${data.colores || 'N/A'}\n`;
            promptText += `Modelo Base Solicitado: ${data.modelo_base || 'N/A'}\n\n`;

            if(data.album_titulo) {
                promptText += `Álbum compartido interactivo: SÍ (Título sugerido: ${data.album_titulo})\n\n`;
            } else {
                promptText += `Álbum compartido interactivo: N/A\n\n`;
            }

            if(data.trivia_p1) {
                promptText += `Sección - Trivia:\n`;
                promptText += `Pregunta 1: ${data.trivia_p1} | Respuesta: ${data.trivia_r1 || 'N/A'}\n`;
                promptText += `Pregunta 2: ${data.trivia_p2 || 'N/A'} | Respuesta: ${data.trivia_r2 || 'N/A'}\n`;
                promptText += `Pregunta 3: ${data.trivia_p3 || 'N/A'} | Respuesta: ${data.trivia_r3 || 'N/A'}\n\n`;
            } else {
                promptText += `Sección - Trivia: N/A\n\n`;
            }

            promptText += `--- FOTOGRAFÍAS PARA LA INVITACIÓN ---\n`;
            if(data.imagenes) {
                promptText += `Foto de Hero (Portada):\n${data.imagenes.portada || 'N/A'}\n\n`;
                
                promptText += `Fotos para incluir como separadores entre secciones:\n`;
                promptText += `Separador 1: ${data.imagenes.separador1 || 'N/A'}\n`;
                promptText += `Separador 2: ${data.imagenes.separador2 || 'N/A'}\n`;
                promptText += `Separador 3: ${data.imagenes.separador3 || 'N/A'}\n`;
                promptText += `Separador 4: ${data.imagenes.separador4 || 'N/A'}\n`;
                promptText += `Separador 5: ${data.imagenes.separador5 || 'N/A'}\n\n`;

                if(data.imagenes.galeria && data.imagenes.galeria.length > 0) {
                    promptText += `Fotos para la Galería:\n`;
                    data.imagenes.galeria.forEach((url, idx) => { promptText += `Foto ${idx+1}: ${url}\n`; });
                    promptText += `\n`;
                } else {
                    promptText += `Fotos para la Galería: N/A\n\n`;
                }
                
                if(data.imagenes.corteHonor && data.imagenes.corteHonor.length > 0) {
                    promptText += `Corte de Honor - Nombres: ${data.corte_nombres || 'N/A'}\n`;
                    promptText += `Fotos Corte de Honor:\n`;
                    data.imagenes.corteHonor.forEach((url, idx) => { promptText += `Foto ${idx+1}: ${url}\n`; });
                    promptText += `\n`;
                } else {
                    promptText += `Corte de Honor: N/A\n\n`;
                }
            } else {
                promptText += `Fotografías: N/A\n\n`;
            }

            promptText += `Observaciones del cliente:\n${data.observaciones_finales || 'N/A'}\n`;

            promptContainer.innerText = promptText;
            promptWrapper.classList.remove('hidden');
            document.getElementById('estado-container').classList.remove('hidden');

            document.getElementById('admin-comentario').value = data.comentario_admin || '';
            document.getElementById('btn-guardar-comentario').innerText = 'Guardar Nota';
            actualizarBotonesEstatus(data.estatus || 'pendiente');

            if(window.innerWidth < 768) {
                document.getElementById('main-content').scrollIntoView({ behavior: 'smooth' });
            }
        };

        window.copiarDatosCliente = function() {
            const texto = document.getElementById('datos-cliente-texto').innerText;
            navigator.clipboard.writeText(texto).then(() => {
                const btn = document.getElementById('btn-copiar-datos');
                const textoOriginal = btn.innerHTML;
                btn.innerHTML = '¡Copiado!';
                btn.classList.replace('bg-gray-800', 'bg-green-600');
                
                setTimeout(() => {
                    btn.innerHTML = textoOriginal;
                    btn.classList.replace('bg-green-600', 'bg-gray-800');
                }, 2000);
            });
        };

        window.copiarPrompt = function() {
            const texto = document.getElementById('prompt-container').innerText;
            navigator.clipboard.writeText(texto).then(() => {
                const btn = document.getElementById('btn-copiar');
                const textoOriginal = btn.innerHTML;
                btn.innerHTML = '¡Copiado!';
                btn.classList.replace('bg-[#9B8AA5]', 'bg-green-500');
                
                setTimeout(() => {
                    btn.innerHTML = textoOriginal;
                    btn.classList.replace('bg-green-500', 'bg-[#9B8AA5]');
                }, 2000);
            });
        };

        window.cambiarEstatus = async function(nuevoEstatus) {
            if(!window.clienteSeleccionado) return;
            if(window.clienteSeleccionado.estatus === nuevoEstatus) return;

            const btnId = nuevoEstatus === 'en_proceso' ? 'btn-estatus-proceso' : (nuevoEstatus === 'completado' ? 'btn-estatus-completado' : 'btn-estatus-pendiente');
            const btn = document.getElementById(btnId);
            const textoOriginal = btn.innerText;
            btn.innerText = "...";

            try {
                const coleccionDeOrigen = window.clienteSeleccionado._coleccionOrigen;
                const docRef = doc(db, coleccionDeOrigen, window.clienteSeleccionado.id);
                
                let datosActualizacion = { estatus: nuevoEstatus };
                let fechaActualCompletado = null;
                if (nuevoEstatus === 'completado') {
                    fechaActualCompletado = new Date();
                    datosActualizacion.fechaCompletado = fechaActualCompletado;
                }

                await updateDoc(docRef, datosActualizacion);

                window.clienteSeleccionado.estatus = nuevoEstatus;
                if (nuevoEstatus === 'completado') {
                    window.clienteSeleccionado.fechaCompletado = { toDate: () => fechaActualCompletado };
                }

                actualizarBotonesEstatus(nuevoEstatus);
                
                actualizarResumenDashboardGlobal();
                renderizarLista();

            } catch (error) {
                console.error("Error al actualizar estado:", error);
                alert("Hubo un error al guardar en la base de datos.");
            } finally {
                btn.innerText = textoOriginal;
            }
        };

        window.actualizarBotonesEstatus = function(estatus) {
            const btnPendiente = document.getElementById('btn-estatus-pendiente');
            const btnProceso = document.getElementById('btn-estatus-proceso');
            const btnCompletado = document.getElementById('btn-estatus-completado');

            [btnPendiente, btnProceso, btnCompletado].forEach(btn => {
                btn.className = "flex-1 sm:flex-none px-4 py-2 rounded-md text-xs font-bold transition-all text-gray-500 hover:bg-gray-200";
            });

            if (estatus === 'completado') {
                btnCompletado.className = "flex-1 sm:flex-none px-4 py-2 rounded-md text-xs font-bold transition-all bg-green-100 text-green-800 shadow-sm";
            } else if (estatus === 'en_proceso') {
                btnProceso.className = "flex-1 sm:flex-none px-4 py-2 rounded-md text-xs font-bold transition-all bg-amber-100 text-amber-800 shadow-sm";
            } else {
                btnPendiente.className = "flex-1 sm:flex-none px-4 py-2 rounded-md text-xs font-bold transition-all bg-white text-gray-800 shadow-sm";
            }
        };

        window.guardarComentario = async function() {
            if(!window.clienteSeleccionado) return;

            const btn = document.getElementById('btn-guardar-comentario');
            const textarea = document.getElementById('admin-comentario');
            const comentario = textarea.value;

            btn.innerText = "Guardando...";
            btn.disabled = true;

            try {
                const coleccionDeOrigen = window.clienteSeleccionado._coleccionOrigen;
                const docRef = doc(db, coleccionDeOrigen, window.clienteSeleccionado.id);
                
                await updateDoc(docRef, { comentario_admin: comentario });
                window.clienteSeleccionado.comentario_admin = comentario;

                btn.innerText = "¡Guardado!";
                btn.classList.replace('bg-[#3D3542]', 'bg-green-600');

                setTimeout(() => {
                    btn.innerText = "Guardar Nota";
                    btn.classList.replace('bg-green-600', 'bg-[#3D3542]');
                }, 2500);

            } catch (error) {
                console.error("Error al guardar comentario:", error);
                alert("Hubo un error al guardar la nota.");
                btn.innerText = "Guardar Nota";
            } finally {
                btn.disabled = false;
            }
        };

    </script>
</body>
</html>
